apiVersion: apps/v1
kind: Deployment
metadata:
  name: error-pages
  namespace: error-pages
  labels:
    app.kubernetes.io/name: error-pages
    app.kubernetes.io/instance: error-pages
    app.kubernetes.io/part-of: error-pages
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: error-pages
  template:
    metadata:
      labels:
        app.kubernetes.io/name: error-pages
        app.kubernetes.io/instance: error-pages
        app.kubernetes.io/part-of: error-pages
        app.kubernetes.io/managed-by: argocd
    spec:
      priorityClassName: homelab-high
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: homelab.dominiksiejak.pl/worker
          operator: Exists
          effect: PreferNoSchedule
      containers:
        - name: error-pages
          image: ghcr.io/tarampampam/error-pages:4.2.5
          env:
            - name: TEMPLATE_NAME
              value: ghost
            # Catch-all IngressRoute serves error-pages directly; keep real status codes.
            - name: SEND_SAME_HTTP_CODE
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: error-pages
  namespace: error-pages
  labels:
    app.kubernetes.io/name: error-pages
    app.kubernetes.io/instance: error-pages
    app.kubernetes.io/part-of: error-pages
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: error-pages
  ports:
    - name: http
      port: 8080
      targetPort: http
