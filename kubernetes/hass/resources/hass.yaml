apiVersion: apps/v1
kind: Deployment
metadata:
  name: hass
  namespace: hass
  labels:
    app.kubernetes.io/name: hass
    app.kubernetes.io/instance: hass
    app.kubernetes.io/part-of: hass
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hass
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hass
        app.kubernetes.io/instance: hass
        app.kubernetes.io/part-of: hass
        app.kubernetes.io/managed-by: argocd
    spec:
      priorityClassName: homelab-high
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      containers:
        - name: hass
          image: ghcr.io/home-assistant/home-assistant:2026.9.3
          env:
            - name: TZ
              value: Europe/Warsaw
          ports:
            - name: http
              containerPort: 8123
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 768Mi
            limits:
              memory: 1280Mi
      volumes:
        - name: config
          hostPath:
            path: /var/lib/hass
            type: Directory
        - name: media
          hostPath:
            path: /var/lib/hass/media
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: hass
  namespace: hass
  labels:
    app.kubernetes.io/name: hass
    app.kubernetes.io/instance: hass
    app.kubernetes.io/part-of: hass
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: hass
  ports:
    - name: http
      port: 8123
      targetPort: http
