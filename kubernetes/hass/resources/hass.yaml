apiVersion: apps/v1
kind: Deployment
metadata:
  name: hass
  namespace: hass
  labels:
    app.kubernetes.io/name: hass
    app.kubernetes.io/instance: hass
    app.kubernetes.io/part-of: hass
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hass
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hass
        app.kubernetes.io/instance: hass
        app.kubernetes.io/part-of: hass
        app.kubernetes.io/managed-by: argocd
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: wait-mqtt
          image: eclipse-mosquitto:2.1.2-alpine
          command:
            - sh
            - -c
            - until mosquitto_sub -h 127.0.0.1 -p 1883 -t '$SYS/broker/uptime' -C 1 -W 3; do sleep 2; done
      containers:
        - name: hass
          image: ghcr.io/home-assistant/home-assistant:2026.9.3
          env:
            - name: TZ
              value: Europe/Warsaw
          ports:
            - name: http
              containerPort: 8123
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: config
          hostPath:
            path: /var/lib/hass
            type: Directory
        - name: media
          hostPath:
            path: /var/lib/hass/media
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: hass
  namespace: hass
  labels:
    app.kubernetes.io/name: hass
    app.kubernetes.io/instance: hass
    app.kubernetes.io/part-of: hass
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: hass
  ports:
    - name: http
      port: 8123
      targetPort: http
