# 1Password vault Servers, item hass. Tag: ArgoCD External Secrets Operator
# Fields: mosquitto-passwd, mqtt-username, mqtt-password, timemachine-token
# CNPG generates hass_user. Do not put the DB password in 1Password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hass-mosquitto
  namespace: hass
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: hass-mosquitto
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: passwd
      remoteRef:
        key: hass/mosquitto-passwd
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hass-mqtt
  namespace: hass
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: hass-mqtt
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: username
      remoteRef:
        key: hass/mqtt-username
    - secretKey: password
      remoteRef:
        key: hass/mqtt-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hass-timemachine
  namespace: hass
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: hass-timemachine
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: LONG_LIVED_ACCESS_TOKEN
      remoteRef:
        key: hass/timemachine-token
