# netbox-docker configuration.py does not map API_TOKEN_PEPPERS from the
# environment into settings. This fragment loads Secret env → dict NetBox needs
# for v2 API tokens (NetBox ≥4.6).
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbox-api-token-peppers
  namespace: netbox
  labels:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/part-of: netbox
    app.kubernetes.io/managed-by: argocd
data:
  api_token_peppers.py: |
    import json
    import os

    _raw = os.environ.get("API_TOKEN_PEPPERS", "").strip()
    if _raw:
        if _raw.startswith("{"):
            API_TOKEN_PEPPERS = {int(k): v for k, v in json.loads(_raw).items()}
        else:
            # Plain string in Secret → pepper id 1
            API_TOKEN_PEPPERS = {1: _raw}
