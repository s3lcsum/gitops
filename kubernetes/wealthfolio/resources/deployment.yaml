apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealthfolio
  namespace: wealthfolio
  labels:
    app.kubernetes.io/name: wealthfolio
    app.kubernetes.io/instance: wealthfolio
    app.kubernetes.io/part-of: wealthfolio
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wealthfolio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wealthfolio
        app.kubernetes.io/instance: wealthfolio
        app.kubernetes.io/part-of: wealthfolio
        app.kubernetes.io/managed-by: argocd
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      containers:
        - name: wealthfolio
          image: wealthfolio/wealthfolio:3.8
          envFrom:
            - secretRef:
                name: wealthfolio
          ports:
            - name: http
              containerPort: 8088
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: data
          hostPath:
            path: /mnt/nas-media/k8s/wealthfolio/data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: wealthfolio
  namespace: wealthfolio
  labels:
    app.kubernetes.io/name: wealthfolio
    app.kubernetes.io/instance: wealthfolio
    app.kubernetes.io/part-of: wealthfolio
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: wealthfolio
  ports:
    - name: http
      port: 8088
      targetPort: http
