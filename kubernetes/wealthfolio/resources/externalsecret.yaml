# 1Password vault Servers. Tag: ArgoCD External Secrets Operator
# Item wealthfolio. Fields match stacks/wealthfolio/wealthfolio.env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wealthfolio
  namespace: wealthfolio
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: wealthfolio
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: WF_LISTEN_ADDR
      remoteRef:
        key: wealthfolio/WF_LISTEN_ADDR
    - secretKey: WF_DB_PATH
      remoteRef:
        key: wealthfolio/WF_DB_PATH
    - secretKey: WF_SECRET_KEY
      remoteRef:
        key: wealthfolio/WF_SECRET_KEY
    - secretKey: WF_CORS_ALLOW_ORIGINS
      remoteRef:
        key: wealthfolio/WF_CORS_ALLOW_ORIGINS
    - secretKey: WF_COOKIE_SECURE
      remoteRef:
        key: wealthfolio/WF_COOKIE_SECURE
    - secretKey: WF_MCP_ENABLED
      remoteRef:
        key: wealthfolio/WF_MCP_ENABLED
    - secretKey: WF_OIDC_ISSUER_URL
      remoteRef:
        key: wealthfolio/WF_OIDC_ISSUER_URL
    - secretKey: WF_OIDC_CLIENT_ID
      remoteRef:
        key: wealthfolio/WF_OIDC_CLIENT_ID
    - secretKey: WF_OIDC_CLIENT_SECRET
      remoteRef:
        key: wealthfolio/WF_OIDC_CLIENT_SECRET
    - secretKey: WF_OIDC_REDIRECT_URL
      remoteRef:
        key: wealthfolio/WF_OIDC_REDIRECT_URL
    - secretKey: WF_OIDC_ALLOWED_SUBS
      remoteRef:
        key: wealthfolio/WF_OIDC_ALLOWED_SUBS
