# Refreshes the token ClusterSecretStore uses to log into 1Password.
# creationPolicy Merge + deletionPolicy Retain: a failed sync must not delete this Secret
# or the store locks itself out. First install still needs the Secret applied once.
# Prune=false: Argo CD app `external-secrets` has prune on; without this annotation it
# deletes Secret/onepassword (not in git, same namespace) → store chicken-eggs forever.
# Empty labels: stop ESO copying ExternalSecret labels onto the Secret.
# 1Password item: Servers / k8s-external-secrets / credential
# Tag: ArgoCD External Secrets Operator
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: onepassword
    app.kubernetes.io/part-of: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: onepassword
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
        labels: {}
  data:
    - secretKey: token
      remoteRef:
        key: k8s-external-secrets/credential
