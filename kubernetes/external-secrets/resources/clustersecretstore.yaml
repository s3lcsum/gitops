# 1Password cloud SA (onepasswordSDK). Families/personal = tight hourly + daily caps.
# ExternalSecrets use refreshPolicy: OnChange (no periodic poll).
# CronJob eso-stagger-refresh force-syncs ~1 ES/hour. Manual:
#   kubectl annotate externalsecret NAME -n NS force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    onepasswordSDK:
      vault: Servers
      auth:
        serviceAccountSecretRef:
          name: onepassword
          namespace: external-secrets
          key: token
      # Experimental; default is off. Cuts GetSecret/GetSecretMap calls to cloud SA.
      cache:
        ttl: 1h
        maxSize: 200
