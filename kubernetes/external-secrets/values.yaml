# ApplicationSet chart pin.
repoURL: https://charts.external-secrets.io
chart: external-secrets
version: 2.11.0

# Overrides for external-secrets 2.11.0.
# Merged onto every pod template. Chart already sets name, instance, managed-by.
commonLabels:
  app.kubernetes.io/part-of: external-secrets
global:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
resources:
  requests:
    cpu: 10m
    memory: 64Mi
crds:
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
