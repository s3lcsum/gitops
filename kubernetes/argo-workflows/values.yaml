# ApplicationSet chart pin.
repoURL: https://argoproj.github.io/argo-helm
chart: argo-workflows
version: 2.0.8

# Overrides for argo/argo-workflows 2.0.8 (appVersion v4.1.4).
# Single-node kubeadm (lake = control-plane): every pod must tolerate NoSchedule.
crds:
  install: true
  keep: true
  upgradeJob:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

singleNamespace: false

workflow:
  serviceAccount:
    create: true
    name: argo-workflow
  rbac:
    create: true

controller:
  priorityClassName: homelab-critical
  workflowNamespaces:
    - argo-workflows
  # Workflow pods inherit these defaults (otherwise Pending on control-plane taint).
  workflowDefaults:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: homelab.dominiksiejak.pl/ai
                    operator: In
                    values:
                      - "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: homelab.dominiksiejak.pl/worker
          operator: Exists
          effect: PreferNoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: homelab.dominiksiejak.pl/ai
                operator: In
                values:
                  - "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: homelab.dominiksiejak.pl/worker
      operator: Exists
      effect: PreferNoSchedule
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

server:
  priorityClassName: homelab-critical
  secure: false
  authModes:
    - sso
  sso:
    enabled: true
    issuer: https://auth.dominiksiejak.pl/application/o/workflows/
    redirectUrl: https://workflows.dominiksiejak.pl/oauth2/callback
    # OIDC client creds. Secret name `sso` is reserved for Argo's JWE key.
    clientId:
      name: argo-workflows-sso
      key: client-id
    clientSecret:
      name: argo-workflows-sso
      key: client-secret
    # Match Argo CD / Authentik: without openid, groups claim never lands → SSO RBAC
    # eval fails with "unknown name groups" → UI "not allowed" on version/info.
    scopes:
      - openid
      - profile
      - email
      - groups
    rbac:
      enabled: true
      # Chart also hardcodes get on Secret `sso` (JWE encryption key).
      secretWhitelist:
        - argo-workflows-admin.service-account-token
        - argo-workflows-sso
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: homelab.dominiksiejak.pl/ai
                operator: In
                values:
                  - "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: homelab.dominiksiejak.pl/worker
      operator: Exists
      effect: PreferNoSchedule
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

  ingress:
    enabled: false
