# Creates Secret `sso` for Authentik OIDC (chart RBAC hardcodes that name).
# 1Password item: Servers / argo-workflows-oidc / credential
# Tag: ArgoCD External Secrets Operator
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-workflows-oidc
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: argo-workflows-oidc
    app.kubernetes.io/part-of: argo-workflows
  annotations:
    # Before server (wave 0): SSO needs Secret `sso` at boot.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: sso
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        client-id: workflows
        client-secret: "{{ .credential }}"
  data:
    - secretKey: credential
      remoteRef:
        key: argo-workflows-oidc/credential
