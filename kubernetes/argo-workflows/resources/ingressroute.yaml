# App-owned route in argo-workflows ns. Shared middlewares + default TLS live in traefik.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argo-workflows
  namespace: argo-workflows
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`workflows.dominiksiejak.pl`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
          namespace: traefik
        - name: secure-headers
          namespace: traefik
      services:
        - name: argo-workflows-server
          port: 2746
  tls: {}
