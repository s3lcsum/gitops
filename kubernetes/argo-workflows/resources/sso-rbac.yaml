# SSO users in Authentik group "admins" assume this SA (UI + API).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflows-admin
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: argo-workflows-admin
    app.kubernetes.io/part-of: argo-workflows
  annotations:
    workflows.argoproj.io/rbac-rule: "'admins' in groups"
    workflows.argoproj.io/rbac-rule-precedence: "1"
---
apiVersion: v1
kind: Secret
metadata:
  name: argo-workflows-admin.service-account-token
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: argo-workflows-admin
    app.kubernetes.io/part-of: argo-workflows
  annotations:
    kubernetes.io/service-account.name: argo-workflows-admin
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflows-admin
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: argo-workflows-admin
    app.kubernetes.io/part-of: argo-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: argo-workflows-admin
    namespace: argo-workflows
