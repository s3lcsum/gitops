# 1Password item: Servers / crowdsec-lapi / credential
# Tag: ArgoCD External Secrets Operator
# Mounted into Traefik as /etc/crowdsec-bouncer/CROWDSEC_API_KEY (plugin accepts file path).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-lapi
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: crowdsec-lapi
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations: {}
  data:
    - secretKey: CROWDSEC_API_KEY
      remoteRef:
        key: crowdsec-lapi/credential
