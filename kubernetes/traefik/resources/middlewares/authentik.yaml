apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: traefik
spec:
  forwardAuth:
    # Traefik dnsPolicy=ClusterFirstWithHostNet → ClusterIP works. Endpoints
    # track whichever node hostNetwork Authentik is on — no lake pin needed.
    address: http://authentik-server.authentik.svc:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: false
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
