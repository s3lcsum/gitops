# Portainer Traefik origin (compose edge on 192.168.89.253).
apiVersion: v1
kind: Service
metadata:
  name: portainer-traefik
  namespace: traefik
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: portainer-traefik
  namespace: traefik
  labels:
    kubernetes.io/service-name: portainer-traefik
addressType: IPv4
ports:
  - name: https
    port: 443
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.89.253
