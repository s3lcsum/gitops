# Homepage compose service on Portainer host (published 192.168.89.253:3000).
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: traefik
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: homepage
  namespace: traefik
  labels:
    kubernetes.io/service-name: homepage
addressType: IPv4
ports:
  - name: http
    port: 3000
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.89.253
