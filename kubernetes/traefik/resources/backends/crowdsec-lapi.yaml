# CrowdSec LAPI on Portainer host (published 192.168.89.253:8088 → container :8080).
apiVersion: v1
kind: Service
metadata:
  name: crowdsec-lapi
  namespace: traefik
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8088
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: crowdsec-lapi
  namespace: traefik
  labels:
    kubernetes.io/service-name: crowdsec-lapi
addressType: IPv4
ports:
  - name: http
    port: 8088
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.89.253
