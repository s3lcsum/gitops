# Authentik server for Traefik forward-auth (Portainer host).
apiVersion: v1
kind: Service
metadata:
  name: authentik-forwardauth
  namespace: traefik
spec:
  ports:
    - name: http
      port: 9000
      targetPort: 9000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: authentik-forwardauth
  namespace: traefik
  labels:
    kubernetes.io/service-name: authentik-forwardauth
addressType: IPv4
ports:
  - name: http
    port: 9000
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.89.253
