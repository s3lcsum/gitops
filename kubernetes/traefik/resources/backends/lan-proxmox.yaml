# Proxmox VE UI (direct — no Portainer hop).
apiVersion: v1
kind: Service
metadata:
  name: lan-proxmox
  namespace: traefik
spec:
  ports:
    - name: https
      port: 8006
      targetPort: 8006
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: lan-proxmox
  namespace: traefik
  labels:
    kubernetes.io/service-name: lan-proxmox
addressType: IPv4
ports:
  - name: https
    port: 8006
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.89.254
