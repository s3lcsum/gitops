# Allowlist → Portainer Traefik. Auth class: native-oidc (no edge Authentik).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portainer-native-oidc
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`portainer.dominiksiejak.pl`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
        - name: secure-headers
      services:
        - name: portainer-traefik
          port: 443
          scheme: https
          serversTransport: portainer-insecure
  tls:
    secretName: dominiksiejak-pl-tls
