apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.dominiksiejak.pl`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
        - name: secure-headers
      services:
        - name: argocd-server
          namespace: argocd
          port: 80
  tls:
    secretName: dominiksiejak-pl-tls
