# ApplicationSet chart pin.
repoURL: https://traefik.github.io/charts
chart: traefik
version: 41.6.0

# Argo CD Application sync (ApplicationSet reads these; not chart values).
argoSync:
  prune: true
  selfHeal: true

# Overrides for Traefik Helm 41.6.0 (app v3.7.13).
# hostNetwork owns :80/:443 after Cilium Gateway is down.
# setcap on a copied binary so non-root can bind privileged ports
# (chart EXAMPLES: "Privileged Ports with Host Network").
image:
  tag: v3.7.13
# Chart already sets name, instance, and managed-by. Not part of the selector.
commonLabels:
  app.kubernetes.io/part-of: traefik
deployment:
  replicas: 1
  # Required with hostNetwork so *.svc resolves via CoreDNS (not AdGuard).
  dnsPolicy: ClusterFirstWithHostNet
  # RollingUpdate deadlocks on hostNetwork :80/:443 (new pod can't bind).
  strategy:
    type: Recreate
  initContainers:
    - name: copy-binary
      image: docker.io/traefik:v3.7.13
      command: ["cp", "/usr/local/bin/traefik", "/shared/traefik"]
      volumeMounts:
        - name: traefik-bin
          mountPath: /shared
    - name: setcap
      image: docker.io/library/alpine:3.21
      command:
        - sh
        - -c
        - apk add --no-cache libcap && setcap cap_net_bind_service=+ep /shared/traefik
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - name: traefik-bin
          mountPath: /shared
  additionalVolumes:
    - name: traefik-bin
      emptyDir: {}
additionalVolumeMounts:
  - name: traefik-bin
    mountPath: /usr/local/bin
hostNetwork: true
service:
  enabled: false
podSecurityContext:
  runAsGroup: 65532
  runAsNonRoot: false
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: true
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]
ports:
  # hostNetwork: container port == host port.
  traefik:
    port: 8080
    expose:
      default: false
  web:
    port: 80
    expose:
      default: false
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 443
    expose:
      default: false
    http:
      tls:
        enabled: true
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
    allowExternalNameServices: true
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: false
gateway:
  enabled: false
ingressRoute:
  dashboard:
    enabled: false
experimental:
  plugins:
    crowdsec-bouncer-traefik-plugin:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.4.4
# LAPI key Secret (ESO) — plugin reads file path from Middleware CR.
volumes:
  - name: crowdsec-lapi
    mountPath: /etc/crowdsec-bouncer
    type: secret
env:
  - name: CROWDSEC_API_KEY
    valueFrom:
      secretKeyRef:
        name: crowdsec-lapi
        key: CROWDSEC_API_KEY
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
resources:
  requests:
    cpu: 50m
    memory: 128Mi
log:
  level: INFO
accessLog:
  enabled: true
