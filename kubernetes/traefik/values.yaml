# ApplicationSet chart pin.
repoURL: https://traefik.github.io/charts
chart: traefik
version: 41.6.0

# Overrides for Traefik Helm 41.6.0 (app v3.7.13).
# hostNetwork owns :80/:443 after Cilium Gateway is down.
deployment:
  replicas: 1
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet
service:
  enabled: true
  spec:
    type: ClusterIP
ports:
  # hostNetwork: container port == host port.
  traefik:
    port: 8080
    expose:
      default: false
  web:
    port: 80
    expose:
      default: false
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 443
    expose:
      default: false
    http:
      tls:
        enabled: true
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
    allowExternalNameServices: true
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: false
gateway:
  enabled: false
ingressRoute:
  dashboard:
    enabled: false
experimental:
  plugins:
    crowdsec-bouncer-traefik-plugin:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.4.4
# LAPI key Secret (ESO) — plugin reads file path from Middleware CR.
volumes:
  - name: crowdsec-lapi
    mountPath: /etc/crowdsec-bouncer
    type: secret
env:
  - name: CROWDSEC_API_KEY
    valueFrom:
      secretKeyRef:
        name: crowdsec-lapi
        key: CROWDSEC_API_KEY
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
resources:
  requests:
    cpu: 50m
    memory: 128Mi
log:
  level: INFO
accessLog:
  enabled: true
