# ApplicationSet chart pin.
repoURL: https://traefik.github.io/charts
chart: traefik
version: 41.6.0

# Overrides for Traefik Helm 41.6.0 (app v3.7.13).
# hostNetwork owns :80/:443 after Cilium Gateway is down.
# The lake LXC has no CAP_SETFCAP, so setcap cannot stamp the binary and a
# non-root process cannot bind :443 there. Root + NET_BIND_SERVICE can.
# WAN dst-nat and AdGuard both target 192.168.89.252.
image:
  tag: v3.7.13
# Chart already sets name, instance, and managed-by. Not part of the selector.
commonLabels:
  app.kubernetes.io/part-of: traefik
priorityClassName: homelab-critical
deployment:
  # One pod per node. hostNetwork :80/:443 then cannot collide.
  # Public WAN still arrives only at 192.168.89.252.
  kind: DaemonSet
# hostNetwork cannot surge a second pod onto the same port.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
  # Required with hostNetwork so *.svc resolves via CoreDNS (not AdGuard).
  dnsPolicy: ClusterFirstWithHostNet
hostNetwork: true
service:
  enabled: false
podSecurityContext:
  runAsGroup: 0
  runAsNonRoot: false
  runAsUser: 0
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: false
  runAsUser: 0
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]
ports:
  # hostNetwork: container port == host port.
  # Keep :8080 free for UniFi inform on the lake node.
  traefik:
    port: 9080
    expose:
      default: false
  web:
    port: 80
    expose:
      default: false
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 443
    expose:
      default: false
    http:
      tls:
        enabled: true
  # SNI passthrough for kubectl client certs. LAN only — no RouterOS dst-nat.
  # Do not put this on websecure.
  kubeapi:
    port: 6444
    expose:
      default: true
    hostPort: 6444
    protocol: TCP
  # LDAP/LDAPS. hostNetwork requires hostPort == containerPort.
  # Traefik terminates the wildcard; outpost sees plain LDAP.
  # Plain ldap:// without StartTLS will fail — both host ports speak TLS.
  ldap:
    port: 389
    expose:
      default: true
    hostPort: 389
    protocol: TCP
  ldaps:
    port: 636
    expose:
      default: true
    hostPort: 636
    protocol: TCP
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
    allowExternalNameServices: true
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: false
gateway:
  enabled: false
ingressRoute:
  dashboard:
    enabled: false
experimental:
  plugins:
    crowdsec-bouncer-traefik-plugin:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.4.4
# LAPI key Secret (ESO) — plugin reads file path from Middleware CR.
volumes:
  - name: crowdsec-lapi
    mountPath: /etc/crowdsec-bouncer
    type: secret
env:
  - name: CROWDSEC_API_KEY
    valueFrom:
      secretKeyRef:
        name: crowdsec-lapi
        key: CROWDSEC_API_KEY
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: homelab.dominiksiejak.pl/worker
    operator: Exists
    effect: PreferNoSchedule
resources:
  requests:
    cpu: 50m
    memory: 128Mi
log:
  level: INFO
accessLog:
  enabled: true
