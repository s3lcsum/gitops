# ApplicationSet chart pin.
repoURL: https://traefik.github.io/charts
chart: traefik
version: 42.2.0

# Overrides for Traefik Helm 41.6.1 (app v3.7.13).
# hostNetwork owns :80/:443 after Cilium Gateway is down.
# The lake LXC has no CAP_SETFCAP, so setcap cannot stamp the binary and a
# non-root process cannot bind :443 there. Root + NET_BIND_SERVICE can.
# WAN dst-nat and AdGuard both target 192.168.89.252.
image:
  # Avoid docker.io rate limits; Traefik also publishes to GHCR.
  registry: ghcr.io
  repository: traefik/traefik
  tag: v3.7.17
# Chart already sets name, instance, and managed-by. Not part of the selector.
commonLabels:
  app.kubernetes.io/part-of: traefik
priorityClassName: homelab-critical
deployment:
  # One pod per node. hostNetwork :80/:443 then cannot collide.
  # Public WAN still arrives only at 192.168.89.252.
  kind: DaemonSet
  # Required with hostNetwork so *.svc resolves via CoreDNS (not AdGuard).
  # Chart reads deployment.dnsPolicy, not a sibling of updateStrategy.
  dnsPolicy: ClusterFirstWithHostNet
# hostNetwork cannot surge a second pod onto the same port.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
hostNetwork: true
service:
  enabled: false
podSecurityContext:
  runAsGroup: 0
  runAsNonRoot: false
  runAsUser: 0
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: false
  runAsUser: 0
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]
ports:
  # hostNetwork: container port == host port.
  # Keep :8080 free for UniFi inform on the lake node.
  traefik:
    port: 9080
    expose:
      default: false
  web:
    port: 80
    expose:
      default: false
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    # cloudflared (pod CIDR) terminates CF Tunnel → Traefik. Trust its
    # X-Forwarded-For / Cf-Connecting-Ip chain or Authentik records 10.244.x
    # and the WAN allowlist workflow banlists Flannel instead of the client.
    forwardedHeaders:
      trustedIPs:
        - 10.244.0.0/16
        - 127.0.0.1/32
      insecure: false
  websecure:
    port: 443
    expose:
      default: false
    http:
      tls:
        enabled: true
    forwardedHeaders:
      trustedIPs:
        - 10.244.0.0/16
        - 127.0.0.1/32
      insecure: false
  # SNI passthrough for kubectl client certs. LAN only — no RouterOS dst-nat.
  # Do not put this on websecure.
  kubeapi:
    port: 6444
    expose:
      default: true
    hostPort: 6444
    protocol: TCP
  # hostNetwork: container port == host port. Do not put this on :8080 (UniFi inform).
  metrics:
    port: 9100
    expose:
      default: true
    hostPort: 9100
    protocol: TCP
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
    allowExternalNameServices: true
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: false
  # Upstream Basic for OpenCode. Traefik expands env at load time, not Helm,
  # so the credential never lands in git or the ConfigMap.
  # IngressRoute refs opencode-upstream-basic@file.
  file:
    enabled: true
    watch: true
    content:
      http:
        middlewares:
          opencode-upstream-basic:
            headers:
              customRequestHeaders:
                Authorization: 'Basic {{ env "OPENCODE_UPSTREAM_BASIC" }}'
gateway:
  enabled: false
ingressRoute:
  dashboard:
    enabled: false
experimental:
  plugins:
    crowdsec-bouncer-traefik-plugin:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.4.4
    traefik-real-ip:
      moduleName: github.com/zekihan/traefik-real-ip
      version: v0.2.0
# LAPI key Secret (ESO) — plugin reads file path from Middleware CR.
volumes:
  - name: crowdsec-lapi
    mountPath: /etc/crowdsec-bouncer
    type: secret
env:
  - name: CROWDSEC_API_KEY
    valueFrom:
      secretKeyRef:
        name: crowdsec-lapi
        key: CROWDSEC_API_KEY
  - name: OPENCODE_UPSTREAM_BASIC
    valueFrom:
      secretKeyRef:
        name: opencode-upstream-basic
        key: OPENCODE_UPSTREAM_BASIC
        # ESO owns the Secret. Missing it must not crashloop all of ingress —
        # only the opencode @file middleware fails to load.
        # Rotation: env does not hot-reload, roll the DaemonSet after ESO syncs.
        optional: true
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: homelab.dominiksiejak.pl/worker
    operator: Exists
    effect: PreferNoSchedule
resources:
  requests:
    cpu: 50m
    memory: 128Mi
log:
  level: INFO
accessLog:
  enabled: true
metrics:
  prometheus:
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    service:
      enabled: true
