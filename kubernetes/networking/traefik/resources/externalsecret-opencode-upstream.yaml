# OpenBao KV secret/k8s/opencode-upstream property OPENCODE_UPSTREAM_BASIC
# Tag: ArgoCD External Secrets Operator
# base64(opencode:<OPENCODE_SERVER_PASSWORD>) — Traefik injects Authorization.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencode-upstream-basic
  namespace: traefik
  annotations:
    # Must land before the Traefik DaemonSet: env from a Secret is resolved at
    # pod start, so a later wave leaves OPENCODE_UPSTREAM_BASIC empty until roll.
    # (crowdsec-lapi is wave 1 because it is a volume mount, not env.)
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: opencode-upstream-basic
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: OPENCODE_UPSTREAM_BASIC
      remoteRef:
        key: k8s/opencode-upstream
        property: OPENCODE_UPSTREAM_BASIC
