apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dominiksiejak-pl
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: dominiksiejak-pl-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - dominiksiejak.pl
    - "*.dominiksiejak.pl"
