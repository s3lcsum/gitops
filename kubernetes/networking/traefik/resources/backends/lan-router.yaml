# MikroTik RouterOS WebFig over HTTPS (www-ssl :443, OpenBao cert; plain :80 is disabled).
apiVersion: v1
kind: Service
metadata:
  name: lan-router
  namespace: traefik
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: lan-router
  namespace: traefik
  labels:
    kubernetes.io/service-name: lan-router
addressType: IPv4
ports:
  - name: https
    port: 443
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.89.1
