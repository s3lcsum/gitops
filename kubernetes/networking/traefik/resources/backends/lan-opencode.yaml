# OpenCode headless server on vibe (192.168.89.200:4096).
apiVersion: v1
kind: Service
metadata:
  name: lan-opencode
  namespace: traefik
spec:
  ports:
    - name: http
      port: 4096
      targetPort: 4096
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: lan-opencode
  namespace: traefik
  labels:
    kubernetes.io/service-name: lan-opencode
addressType: IPv4
ports:
  - name: http
    port: 4096
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.89.200
