# Synology DSM (direct — no Portainer hop).
apiVersion: v1
kind: Service
metadata:
  name: lan-nas
  namespace: traefik
spec:
  ports:
    - name: https
      port: 5001
      targetPort: 5001
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: lan-nas
  namespace: traefik
  labels:
    kubernetes.io/service-name: lan-nas
addressType: IPv4
ports:
  - name: https
    port: 5001
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.89.240
