# SNI passthrough. Do not put this on websecure — kubectl client certs die there.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: kube-apiserver
  namespace: traefik
spec:
  entryPoints:
    - kubeapi
  routes:
    - match: HostSNI(`k8s.dominiksiejak.pl`)
      services:
        - name: kube-apiserver
          port: 6443
  tls:
    passthrough: true
