# LAN metal UIs — Traefik-k8s → host. Auth class: native-oidc (no edge Authentik).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lan-native-oidc
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nas.dominiksiejak.pl`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
        - name: secure-headers
      services:
        - name: lan-nas
          port: 5001
          scheme: https
          serversTransport: portainer-insecure
          passHostHeader: false
    - match: Host(`router.dominiksiejak.pl`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
        - name: secure-headers
      services:
        - name: lan-router
          port: 80
          scheme: http
          passHostHeader: true
    - match: Host(`proxmox.dominiksiejak.pl`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
        - name: secure-headers
      services:
        - name: lan-proxmox
          port: 8006
          scheme: https
          serversTransport: portainer-insecure
          passHostHeader: true
  tls: {}
