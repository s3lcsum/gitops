# WireGuard endpoint hostname (RouterOS wg0 :51820). Not an IngressRoute — bridge never
# creates a DNSEndpoint for it. Same shape as ingressroute-dnsendpoints: A with no targets
# so external-dns-cloudflare applies --default-targets (ConfigMap wan-ip).
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: vpn-wan
  namespace: external-dns
  labels:
    app.kubernetes.io/name: vpn-wan
    app.kubernetes.io/part-of: external-dns
    app.kubernetes.io/managed-by: argocd
spec:
  endpoints:
    - dnsName: vpn.dominiksiejak.pl
      recordType: A
      # targets from default-targets on external-dns-cloudflare (WAN IPv4)
