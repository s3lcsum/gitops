# Low-priority catch-all for unmatched hosts (Traefik built-in 404 otherwise).
# Mirrors stacks/traefik compose labels deleted in cbf5ceb3.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: error-pages-catch-all
  namespace: error-pages
  labels:
    app.kubernetes.io/name: error-pages
    app.kubernetes.io/part-of: error-pages
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostRegexp(`.+`)
      kind: Rule
      priority: 10
      services:
        - name: error-pages
          port: 8080
  tls: {}
