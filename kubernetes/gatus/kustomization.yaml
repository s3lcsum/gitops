apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gatus
resources:
  - resources/namespace.yaml
  - resources/deployment.yaml
  - resources/ingressroute.yaml
configMapGenerator:
  - name: gatus-config
    files:
      - config.yaml
generatorOptions:
  disableNameSuffixHash: true
