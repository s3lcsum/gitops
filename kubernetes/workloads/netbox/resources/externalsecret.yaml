# OpenBao secret/k8s/netbox
# TF_API_TOKEN stays in 1Password for local tofu only — not synced into the pod Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox
  namespace: netbox
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: netbox
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: API_TOKEN_PEPPERS
      remoteRef:
        key: k8s/netbox
        property: API_TOKEN_PEPPERS
    - secretKey: DB_HOST
      remoteRef:
        key: k8s/netbox
        property: DB_HOST
    - secretKey: DB_NAME
      remoteRef:
        key: k8s/netbox
        property: DB_NAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: k8s/netbox
        property: DB_PASSWORD
    - secretKey: DB_USER
      remoteRef:
        key: k8s/netbox
        property: DB_USER
    - secretKey: LOGOUT_REDIRECT_URL
      remoteRef:
        key: k8s/netbox
        property: LOGOUT_REDIRECT_URL
    - secretKey: REDIS_HOST
      remoteRef:
        key: k8s/netbox
        property: REDIS_HOST
    - secretKey: REMOTE_AUTH_AUTO_CREATE_GROUPS
      remoteRef:
        key: k8s/netbox
        property: REMOTE_AUTH_AUTO_CREATE_GROUPS
    - secretKey: REMOTE_AUTH_AUTO_CREATE_USER
      remoteRef:
        key: k8s/netbox
        property: REMOTE_AUTH_AUTO_CREATE_USER
    - secretKey: REMOTE_AUTH_BACKEND
      remoteRef:
        key: k8s/netbox
        property: REMOTE_AUTH_BACKEND
    - secretKey: REMOTE_AUTH_DEFAULT_GROUPS
      remoteRef:
        key: k8s/netbox
        property: REMOTE_AUTH_DEFAULT_GROUPS
    - secretKey: REMOTE_AUTH_ENABLED
      remoteRef:
        key: k8s/netbox
        property: REMOTE_AUTH_ENABLED
    - secretKey: REMOTE_AUTH_GROUP_SYNC_ENABLED
      remoteRef:
        key: k8s/netbox
        property: REMOTE_AUTH_GROUP_SYNC_ENABLED
    - secretKey: REMOTE_AUTH_SUPERUSER_GROUPS
      remoteRef:
        key: k8s/netbox
        property: REMOTE_AUTH_SUPERUSER_GROUPS
    - secretKey: SECRET_KEY
      remoteRef:
        key: k8s/netbox
        property: SECRET_KEY
    - secretKey: SKIP_SUPERUSER
      remoteRef:
        key: k8s/netbox
        property: SKIP_SUPERUSER
    - secretKey: SOCIAL_AUTH_OIDC_KEY
      remoteRef:
        key: k8s/netbox
        property: SOCIAL_AUTH_OIDC_KEY
    - secretKey: SOCIAL_AUTH_OIDC_OIDC_ENDPOINT
      remoteRef:
        key: k8s/netbox
        property: SOCIAL_AUTH_OIDC_OIDC_ENDPOINT
    - secretKey: SOCIAL_AUTH_OIDC_SCOPE
      remoteRef:
        key: k8s/netbox
        property: SOCIAL_AUTH_OIDC_SCOPE
    - secretKey: SOCIAL_AUTH_OIDC_SECRET
      remoteRef:
        key: k8s/netbox
        property: SOCIAL_AUTH_OIDC_SECRET
