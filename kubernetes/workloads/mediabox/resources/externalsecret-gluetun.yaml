# OpenBao secret/k8s/gluetun
# Fields: VPN_SERVICE_PROVIDER, VPN_TYPE, SERVER_COUNTRIES, WIREGUARD_PRIVATE_KEY,
#         DNS_UPSTREAM_RESOLVER_TYPE, DNS_UPSTREAM_PLAIN_ADDRESSES
# Deployment gluetun consumes this Secret via envFrom, so secretKey == env var name.
# Refresh WIREGUARD_PRIVATE_KEY via OpenBao when Nord rotates NordLynx credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun
  namespace: mediabox
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: gluetun
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: gluetun
          app.kubernetes.io/part-of: mediabox
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: VPN_SERVICE_PROVIDER
      remoteRef:
        key: k8s/gluetun
        property: VPN_SERVICE_PROVIDER
    - secretKey: VPN_TYPE
      remoteRef:
        key: k8s/gluetun
        property: VPN_TYPE
    - secretKey: SERVER_COUNTRIES
      remoteRef:
        key: k8s/gluetun
        property: SERVER_COUNTRIES
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: k8s/gluetun
        property: WIREGUARD_PRIVATE_KEY
    - secretKey: DNS_UPSTREAM_RESOLVER_TYPE
      remoteRef:
        key: k8s/gluetun
        property: DNS_UPSTREAM_RESOLVER_TYPE
    - secretKey: DNS_UPSTREAM_PLAIN_ADDRESSES
      remoteRef:
        key: k8s/gluetun
        property: DNS_UPSTREAM_PLAIN_ADDRESSES
