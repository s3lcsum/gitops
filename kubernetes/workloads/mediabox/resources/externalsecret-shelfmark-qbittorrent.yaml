# qBittorrent WebUI login for Shelfmark.
# Same values Homepage already uses: OpenBao secret/homepage
# HOMEPAGE_VAR_QBT_USER and HOMEPAGE_VAR_QBT_PASS.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shelfmark-qbittorrent
  namespace: mediabox
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: shelfmark-qbittorrent
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: shelfmark
          app.kubernetes.io/part-of: mediabox
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: QBITTORRENT_USERNAME
      remoteRef:
        key: homepage
        property: HOMEPAGE_VAR_QBT_USER
    - secretKey: QBITTORRENT_PASSWORD
      remoteRef:
        key: homepage
        property: HOMEPAGE_VAR_QBT_PASS
