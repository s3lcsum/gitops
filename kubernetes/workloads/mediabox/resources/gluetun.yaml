# qBittorrent, SABnzbd, and Shelfmark share this pod network, so their traffic
# leaves through the one NordLynx tunnel. A second Gluetun with the same key
# would kick this session.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gluetun
  namespace: mediabox
  labels:
    app.kubernetes.io/name: gluetun
    app.kubernetes.io/instance: gluetun
    app.kubernetes.io/part-of: mediabox
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gluetun
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gluetun
        app.kubernetes.io/instance: gluetun
        app.kubernetes.io/part-of: mediabox
        app.kubernetes.io/managed-by: argocd
    spec:
      priorityClassName: homelab-low
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/hostname: k8s
      # Built-in servers.json in the image goes stale; UPDATER_PERIOD only runs after
      # the tunnel is up, so refresh Nord server IPs before VPN starts.
      initContainers:
        - name: gluetun-servers-update
          image: ghcr.io/qdm12/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          args:
            - update
            - -enduser
            - -providers
            - nordvpn
          volumeMounts:
            - name: gluetun-data
              mountPath: /gluetun
      containers:
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          envFrom:
            - secretRef:
                name: gluetun
          env:
            - name: FIREWALL_INPUT_PORTS
              value: "8080,8084,8085"
            - name: UPDATER_PERIOD
              value: 480h
            - name: UPDATER_VPN_SERVICE_PROVIDERS
              value: nordvpn
            - name: UPDATER_PREFER_DIRECT_DOWNLOAD
              value: "yes"
          readinessProbe:
            exec:
              command: ["nc", "-z", "localhost", "8000"]
            periodSeconds: 15
          startupProbe:
            exec:
              command: ["nc", "-z", "localhost", "8000"]
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: gluetun-data
              mountPath: /gluetun
            - name: tun
              mountPath: /dev/net/tun
            - name: shm
              mountPath: /dev/shm
        - name: qbittorrent
          image: ghcr.io/linuxserver/qbittorrent:5.3.0
          env:
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: TZ
              value: Europe/Warsaw
          volumeMounts:
            - name: qbittorrent
              mountPath: /config
            - name: local-media
              mountPath: /mnt/LOCAL_MEDIA
            - name: nas
              mountPath: /mnt/NAS_Shared_Media
        - name: sabnzbd
          image: ghcr.io/linuxserver/sabnzbd:5.1.3
          env:
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: TZ
              value: Europe/Warsaw
          volumeMounts:
            - name: sabnzbd
              mountPath: /config
            - name: local-media
              mountPath: /mnt/LOCAL_MEDIA
            - name: nas
              mountPath: /mnt/NAS_Shared_Media
        # Book grabs leave via NordVPN. Completed files land in the CWA inbox;
        # the library mount is read-only so Shelfmark can mark books already owned.
        - name: shelfmark
          image: ghcr.io/calibrain/shelfmark:v1.6.1
          env:
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: TZ
              value: Europe/Warsaw
            - name: DOCKERMODE
              value: "true"
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: AUTH_METHOD
              value: oidc
            - name: OIDC_DISCOVERY_URL
              value: https://auth.dominiksiejak.pl/application/o/shelfmark/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              value: shelfmark
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shelfmark
                  key: OIDC_CLIENT_SECRET
                  # Missing key must not block qBittorrent/SABnzbd. Pod still
                  # needs a restart after OpenBao secret/shelfmark appears.
                  optional: true
            - name: OIDC_SCOPES
              value: openid,email,profile,groups
            - name: OIDC_GROUP_CLAIM
              value: groups
            - name: OIDC_ADMIN_GROUP
              value: admins
            - name: OIDC_USE_ADMIN_GROUP
              value: "true"
            - name: OIDC_AUTO_PROVISION
              value: "true"
            - name: OIDC_AUTO_REDIRECT
              value: "true"
            - name: DISABLE_LOCAL_AUTH
              value: "true"
            - name: CALIBRE_WEB_URL
              value: https://calibre.dominiksiejak.pl
            - name: LIBRARY_CHECK_CALIBRE_ENABLED
              value: "true"
            - name: CALIBRE_LIBRARY_DB_PATH
              value: /calibre-library/metadata.db
          ports:
            - name: http
              containerPort: 8084
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: shelfmark
              mountPath: /config
            - name: nas
              mountPath: /books
              subPath: books/inbox
            - name: nas
              mountPath: /calibre-library
              subPath: books/library
              readOnly: true
      volumes:
        - name: gluetun-data
          emptyDir: {}
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: qbittorrent
          persistentVolumeClaim:
            claimName: mediabox-qbittorrent
        - name: sabnzbd
          persistentVolumeClaim:
            claimName: mediabox-sabnzbd
        - name: shelfmark
          persistentVolumeClaim:
            claimName: mediabox-shelfmark
        - name: local-media
          persistentVolumeClaim:
            claimName: mediabox-local-media
        - name: nas
          persistentVolumeClaim:
            claimName: mediabox-library
---
# One Service per app, all on :80. Pod listens on 8080, 8084, and 8085.
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: mediabox
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/part-of: mediabox
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: gluetun
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sabnzbd
  namespace: mediabox
  labels:
    app.kubernetes.io/name: sabnzbd
    app.kubernetes.io/instance: sabnzbd
    app.kubernetes.io/part-of: mediabox
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: gluetun
  ports:
    - name: http
      port: 80
      targetPort: 8085
---
apiVersion: v1
kind: Service
metadata:
  name: shelfmark
  namespace: mediabox
  labels:
    app.kubernetes.io/name: shelfmark
    app.kubernetes.io/instance: shelfmark
    app.kubernetes.io/part-of: mediabox
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: gluetun
  ports:
    - name: http
      port: 80
      targetPort: 8084
