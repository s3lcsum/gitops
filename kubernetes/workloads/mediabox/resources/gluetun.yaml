# qBittorrent and SABnzbd share this pod network, so their traffic leaves through the VPN.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gluetun
  namespace: mediabox
  labels:
    app.kubernetes.io/name: gluetun
    app.kubernetes.io/instance: gluetun
    app.kubernetes.io/part-of: mediabox
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gluetun
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gluetun
        app.kubernetes.io/instance: gluetun
        app.kubernetes.io/part-of: mediabox
        app.kubernetes.io/managed-by: argocd
    spec:
      priorityClassName: homelab-low
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Built-in servers.json in the image goes stale; UPDATER_PERIOD only runs after
      # the tunnel is up, so refresh Nord server IPs before VPN starts.
      initContainers:
        - name: gluetun-servers-update
          image: ghcr.io/qdm12/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          args:
            - update
            - -enduser
            - -providers
            - nordvpn
          volumeMounts:
            - name: gluetun-data
              mountPath: /gluetun
      containers:
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          envFrom:
            - secretRef:
                name: gluetun
          env:
            - name: FIREWALL_INPUT_PORTS
              value: "8080,8085"
            - name: UPDATER_PERIOD
              value: 480h
            - name: UPDATER_VPN_SERVICE_PROVIDERS
              value: nordvpn
            - name: UPDATER_PREFER_DIRECT_DOWNLOAD
              value: "yes"
          readinessProbe:
            exec:
              command: ["nc", "-z", "localhost", "8000"]
            periodSeconds: 15
          startupProbe:
            exec:
              command: ["nc", "-z", "localhost", "8000"]
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: gluetun-data
              mountPath: /gluetun
            - name: tun
              mountPath: /dev/net/tun
            - name: shm
              mountPath: /dev/shm
        - name: qbittorrent
          image: ghcr.io/linuxserver/qbittorrent:5.3.0
          env:
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: TZ
              value: Europe/Warsaw
          volumeMounts:
            - name: qbittorrent
              mountPath: /config
            - name: local-media
              mountPath: /mnt/LOCAL_MEDIA
            - name: nas
              mountPath: /mnt/NAS_Shared_Media
        - name: sabnzbd
          image: ghcr.io/linuxserver/sabnzbd:5.1.3
          env:
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: TZ
              value: Europe/Warsaw
          volumeMounts:
            - name: sabnzbd
              mountPath: /config
            - name: local-media
              mountPath: /mnt/LOCAL_MEDIA
            - name: nas
              mountPath: /mnt/NAS_Shared_Media
      volumes:
        - name: gluetun-data
          emptyDir: {}
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: qbittorrent
          persistentVolumeClaim:
            claimName: mediabox-qbittorrent
        - name: sabnzbd
          persistentVolumeClaim:
            claimName: mediabox-sabnzbd
        - name: local-media
          persistentVolumeClaim:
            claimName: mediabox-local-media
        - name: nas
          persistentVolumeClaim:
            claimName: mediabox-library
---
# Two Services on :80 — one app each. Pod still listens on 8080/8085.
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: mediabox
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/part-of: mediabox
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: gluetun
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sabnzbd
  namespace: mediabox
  labels:
    app.kubernetes.io/name: sabnzbd
    app.kubernetes.io/instance: sabnzbd
    app.kubernetes.io/part-of: mediabox
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: gluetun
  ports:
    - name: http
      port: 80
      targetPort: 8085
