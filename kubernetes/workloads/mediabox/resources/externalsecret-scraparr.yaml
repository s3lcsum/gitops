# OpenBao secret/k8s/scraparr
# Seeded from the pre-ESO hand-made Secret. Consumed by the scraparr Deployment in
# mediabox via envFrom (secretRef: scraparr), so secretKey == env var name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scraparr
  namespace: mediabox
  labels:
    app.kubernetes.io/name: scraparr
    app.kubernetes.io/instance: scraparr
    app.kubernetes.io/part-of: mediabox
    app.kubernetes.io/managed-by: argocd
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: scraparr
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: scraparr
          app.kubernetes.io/part-of: mediabox
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: k8s/scraparr
        property: RADARR_API_KEY
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: k8s/scraparr
        property: SONARR_API_KEY
    - secretKey: PROWLARR_API_KEY
      remoteRef:
        key: k8s/scraparr
        property: PROWLARR_API_KEY
    - secretKey: JELLYSEERR_API_KEY
      remoteRef:
        key: k8s/scraparr
        property: JELLYSEERR_API_KEY
    - secretKey: BAZARR_API_KEY
      remoteRef:
        key: k8s/scraparr
        property: BAZARR_API_KEY
