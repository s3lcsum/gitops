# Own pod on the node WAN. Book grabs do not need the Nord tunnel, and a
# second NordLynx login with secret/gluetun's key would drop qBittorrent.
# Prowlarr and qBittorrent are other Services in this namespace, both on :80
# (containers listen on 9696 and 8080). qBittorrent still downloads through
# Gluetun. Shelfmark tells it to save under /mnt/NAS_Shared_Media/books/downloads,
# the same path this pod mounts, then copies finished files into /books
# (CWA inbox). The library mount is read-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfmark
  namespace: mediabox
  labels:
    app.kubernetes.io/name: shelfmark
    app.kubernetes.io/instance: shelfmark
    app.kubernetes.io/part-of: mediabox
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shelfmark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shelfmark
        app.kubernetes.io/instance: shelfmark
        app.kubernetes.io/part-of: mediabox
        app.kubernetes.io/managed-by: argocd
    spec:
      priorityClassName: homelab-low
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: shelfmark
          image: ghcr.io/calibrain/shelfmark:v1.6.1
          env:
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: TZ
              value: Europe/Warsaw
            - name: DOCKERMODE
              value: "true"
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: AUTH_METHOD
              value: oidc
            - name: OIDC_DISCOVERY_URL
              value: https://auth.dominiksiejak.pl/application/o/shelfmark/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              value: shelfmark
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shelfmark
                  key: OIDC_CLIENT_SECRET
                  optional: true
            - name: OIDC_SCOPES
              value: openid,email,profile,groups
            - name: OIDC_GROUP_CLAIM
              value: groups
            - name: OIDC_ADMIN_GROUP
              value: admins
            - name: OIDC_USE_ADMIN_GROUP
              value: "true"
            - name: OIDC_AUTO_PROVISION
              value: "true"
            - name: OIDC_AUTO_REDIRECT
              value: "true"
            - name: DISABLE_LOCAL_AUTH
              value: "true"
            - name: CALIBRE_WEB_URL
              value: https://calibre.dominiksiejak.pl
            - name: LIBRARY_CHECK_CALIBRE_ENABLED
              value: "true"
            - name: CALIBRE_LIBRARY_DB_PATH
              value: /calibre-library/metadata.db
            - name: INGEST_DIR
              value: /books
            - name: PROWLARR_ENABLED
              value: "true"
            - name: PROWLARR_URL
              value: http://prowlarr.mediabox.svc
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scraparr
                  key: PROWLARR_API_KEY
            - name: PROWLARR_TORRENT_CLIENT
              value: qbittorrent
            - name: QBITTORRENT_URL
              value: http://qbittorrent.mediabox.svc
            - name: QBITTORRENT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: shelfmark-qbittorrent
                  key: QBITTORRENT_USERNAME
            - name: QBITTORRENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shelfmark-qbittorrent
                  key: QBITTORRENT_PASSWORD
            - name: QBITTORRENT_DOWNLOAD_DIR
              value: /mnt/NAS_Shared_Media/books/downloads
          ports:
            - name: http
              containerPort: 8084
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: nas
              mountPath: /books
              subPath: books/inbox
            - name: nas
              mountPath: /calibre-library
              subPath: books/library
              readOnly: true
            # Same path qBittorrent uses. Read-only: qBittorrent writes it.
            # Parent mount, not subPath — the Gluetun init creates books/downloads.
            - name: nas
              mountPath: /mnt/NAS_Shared_Media
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: mediabox-shelfmark
        - name: nas
          persistentVolumeClaim:
            claimName: mediabox-library
---
apiVersion: v1
kind: Service
metadata:
  name: shelfmark
  namespace: mediabox
  labels:
    app.kubernetes.io/name: shelfmark
    app.kubernetes.io/instance: shelfmark
    app.kubernetes.io/part-of: mediabox
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: shelfmark
  ports:
    - name: http
      port: 80
      targetPort: 8084
