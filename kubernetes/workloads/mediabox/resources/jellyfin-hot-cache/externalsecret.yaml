# Jellyfin dashboard API key — OpenBao secret/homepage (same as Homepage widget).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-prefetch
  namespace: mediabox
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: mediabox
    app.kubernetes.io/managed-by: argocd
spec:
  refreshPolicy: OnChange
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: jellyfin-prefetch
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: JELLYFIN_API_KEY
      remoteRef:
        key: homepage
        property: HOMEPAGE_VAR_JELLYFIN_KEY
