# Node-local cache for a few episode files (current + next). RWO on k8s only.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-playback-cache
  namespace: mediabox
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: mediabox
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 25Gi
