apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-playback-prefetch
  namespace: mediabox
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: mediabox
    app.kubernetes.io/managed-by: argocd
spec:
  schedule: "25 */2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jellyfin-playback-prefetch
        spec:
          priorityClassName: homelab-low
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: k8s
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          containers:
            - name: prefetch
              image: alpine:3.21
              command:
                - /bin/sh
                - -c
                - apk add --no-cache rsync curl jq >/dev/null && /bin/sh /config/prefetch-current-and-next.sh
              env:
                - name: JELLYFIN_URL
                  value: http://jellyfin.mediabox.svc
                - name: LIBRARY_ROOT
                  value: /library
                - name: HOT_ROOT
                  value: /hot
                - name: PREFETCH_MAX_EPISODES
                  value: "8"
                - name: PREFETCH_NEXTUP_LIMIT
                  value: "12"
                - name: JELLYFIN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: jellyfin-prefetch
                      key: JELLYFIN_API_KEY
              volumeMounts:
                - name: library
                  mountPath: /library
                  readOnly: true
                - name: hot
                  mountPath: /hot
                - name: config
                  mountPath: /config
          volumes:
            - name: library
              persistentVolumeClaim:
                claimName: mediabox-library
            - name: hot
              persistentVolumeClaim:
                claimName: jellyfin-playback-cache
            - name: config
              configMap:
                name: jellyfin-playback-prefetch
                defaultMode: 0444
