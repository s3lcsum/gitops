# OpenBao secret/jellyfin
# Field OIDC_CLIENT_SECRET = tofu output -raw applications → jellyfin.client_secret
# (after authentik apply creates the OAuth2 provider).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-sso
  namespace: mediabox
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: jellyfin-sso
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: jellyfin
          app.kubernetes.io/part-of: mediabox
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        SSO-Auth.xml: |
          <?xml version="1.0" encoding="utf-8"?>
          <PluginConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
            <SamlConfigs />
            <OidConfigs>
              <item>
                <key>
                  <string>authentik</string>
                </key>
                <value>
                  <PluginConfiguration>
                    <OidEndpoint>https://auth.dominiksiejak.pl/application/o/jellyfin</OidEndpoint>
                    <OidClientId>jellyfin</OidClientId>
                    <OidSecret>{{ .OIDC_CLIENT_SECRET }}</OidSecret>
                    <Enabled>true</Enabled>
                    <EnableAuthorization>true</EnableAuthorization>
                    <EnableAllFolders>true</EnableAllFolders>
                    <EnabledFolders />
                    <AdminRoles>
                      <string>admins</string>
                    </AdminRoles>
                    <Roles>
                      <string>users</string>
                      <string>admins</string>
                    </Roles>
                    <EnableFolderRoles>false</EnableFolderRoles>
                    <EnableLiveTvRoles>false</EnableLiveTvRoles>
                    <EnableLiveTv>false</EnableLiveTv>
                    <EnableLiveTvManagement>false</EnableLiveTvManagement>
                    <LiveTvRoles />
                    <LiveTvManagementRoles />
                    <FolderRoleMappings />
                    <RoleClaim>groups</RoleClaim>
                    <OidScopes>
                      <string>groups</string>
                    </OidScopes>
                    <CanonicalLinks />
                    <DisableHttps>false</DisableHttps>
                    <DoNotValidateEndpoints>false</DoNotValidateEndpoints>
                    <DoNotValidateIssuerName>false</DoNotValidateIssuerName>
                    <SchemeOverride>https</SchemeOverride>
                  </PluginConfiguration>
                </value>
              </item>
            </OidConfigs>
          </PluginConfiguration>
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: jellyfin
        property: OIDC_CLIENT_SECRET
