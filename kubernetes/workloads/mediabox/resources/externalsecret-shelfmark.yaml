# OpenBao secret/shelfmark
# Field OIDC_CLIENT_SECRET = tofu output -raw applications → shelfmark.client_secret
# (after authentik apply creates the OAuth2 provider).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shelfmark
  namespace: mediabox
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: shelfmark
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: shelfmark
          app.kubernetes.io/part-of: mediabox
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: shelfmark
        property: OIDC_CLIENT_SECRET
