# OpenBao secret/calibre
# Field HARDCOVER_TOKEN → CWA Hardcover metadata provider.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calibre-web-automated
  namespace: calibre
  labels:
    app.kubernetes.io/name: calibre-web-automated
    app.kubernetes.io/instance: calibre-web-automated
    app.kubernetes.io/part-of: calibre
    app.kubernetes.io/managed-by: argocd
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: calibre-web-automated
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: calibre-web-automated
          app.kubernetes.io/part-of: calibre
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: HARDCOVER_TOKEN
      remoteRef:
        key: calibre
        property: HARDCOVER_TOKEN
