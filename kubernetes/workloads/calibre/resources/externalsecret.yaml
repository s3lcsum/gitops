# OpenBao secret/calibre
# HARDCOVER_TOKEN → Hardcover metadata provider.
# DEDRM_ADEPTKEYS → JSON object of Adobe Adept keys for shop DeDRM (optional; defaults to {}).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calibre-web-automated
  namespace: calibre
  labels:
    app.kubernetes.io/name: calibre-web-automated
    app.kubernetes.io/instance: calibre-web-automated
    app.kubernetes.io/part-of: calibre
    app.kubernetes.io/managed-by: argocd
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: calibre-web-automated
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: calibre-web-automated
          app.kubernetes.io/part-of: calibre
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        HARDCOVER_TOKEN: "{{ .HARDCOVER_TOKEN }}"
        DEDRM_ADEPTKEYS: '{{ .DEDRM_ADEPTKEYS | default "{}" }}'
  dataFrom:
    - extract:
        key: calibre
