apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web-automated
  namespace: calibre
  labels:
    app.kubernetes.io/name: calibre-web-automated
    app.kubernetes.io/instance: calibre-web-automated
    app.kubernetes.io/part-of: calibre
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: calibre-web-automated
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calibre-web-automated
        app.kubernetes.io/instance: calibre-web-automated
        app.kubernetes.io/part-of: calibre
        app.kubernetes.io/managed-by: argocd
    spec:
      priorityClassName: homelab-low
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: cwa-bootstrap
          image: ghcr.io/crocodilestick/calibre-web-automated:v4.0.8
          command:
            - python3
            - /bootstrap/cwa-bootstrap.py
          env:
            - name: CWA_SEED_DIR
              value: /bootstrap
            - name: DEDRM_ADEPTKEYS
              valueFrom:
                secretKeyRef:
                  name: calibre-web-automated
                  key: DEDRM_ADEPTKEYS
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cwa-bootstrap
              mountPath: /bootstrap
      containers:
        - name: calibre-web-automated
          image: ghcr.io/crocodilestick/calibre-web-automated:v4.0.8
          env:
            - name: PUID
              value: "1026"
            - name: PGID
              value: "100"
            - name: TZ
              value: Europe/Warsaw
            - name: NETWORK_SHARE_MODE
              value: "true"
            - name: CWA_WATCH_MODE
              value: poll
            - name: TRUSTED_PROXY_COUNT
              value: "1"
            - name: HARDCOVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: calibre-web-automated
                  key: HARDCOVER_TOKEN
          ports:
            - name: http
              containerPort: 8083
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: books
              mountPath: /cwa-book-ingest
              subPath: inbox
            - name: books
              mountPath: /calibre-library
              subPath: library
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: calibre-cwa-config
        - name: books
          persistentVolumeClaim:
            claimName: calibre-books
        - name: cwa-bootstrap
          configMap:
            name: cwa-bootstrap
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: calibre-web-automated
  namespace: calibre
  labels:
    app.kubernetes.io/name: calibre-web-automated
    app.kubernetes.io/instance: calibre-web-automated
    app.kubernetes.io/part-of: calibre
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: calibre-web-automated
  ports:
    - name: http
      port: 8083
      targetPort: http
