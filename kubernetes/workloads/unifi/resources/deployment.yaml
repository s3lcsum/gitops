# UniFi inform/discovery need the LAN IP. Traefik API moved off :8080 for that.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi
  namespace: unifi
  labels:
    app.kubernetes.io/name: unifi
    app.kubernetes.io/instance: unifi
    app.kubernetes.io/part-of: unifi
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: unifi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unifi
        app.kubernetes.io/instance: unifi
        app.kubernetes.io/part-of: unifi
        app.kubernetes.io/managed-by: argocd
    spec:
      priorityClassName: homelab-low
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["k8s"]
      containers:
        - name: unifi-db
          image: public.ecr.aws/docker/library/mongo:7.0.40
          envFrom:
            - secretRef:
                name: unifi
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: unifi
            - name: MONGO_INITDB_DATABASE
              value: unifi
          args:
            - --bind_ip
            - 127.0.0.1
          ports:
            - name: mongo
              containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
            periodSeconds: 15
          volumeMounts:
            - name: db
              mountPath: /data/db
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
        - name: unifi
          image: lscr.io/linuxserver/unifi-network-application:10.6.106
          envFrom:
            - secretRef:
                name: unifi
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Warsaw
            - name: MONGO_USER
              value: unifi
            - name: MONGO_HOST
              value: 127.0.0.1
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_DBNAME
              value: unifi
            - name: MONGO_AUTHSOURCE
              value: admin
          ports:
            - name: https
              containerPort: 8443
            - name: inform
              containerPort: 8080
            - name: stun
              containerPort: 3478
              protocol: UDP
            - name: discovery
              containerPort: 10001
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 15
          startupProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
            failureThreshold: 60
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
      volumes:
        - name: config
          hostPath:
            path: /var/lib/unifi/config
            type: Directory
        - name: db
          hostPath:
            path: /var/lib/unifi/db
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: unifi
  namespace: unifi
  labels:
    app.kubernetes.io/name: unifi
    app.kubernetes.io/instance: unifi
    app.kubernetes.io/part-of: unifi
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: unifi
  ports:
    - name: https
      port: 8443
      targetPort: https
