# OpenBao secret/k8s/unifi
# Seeded from the pre-ESO hand-made Secret. Consumed by the UniFi Deployment via
# envFrom (secretRef: unifi), so secretKey == env var name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi
  namespace: unifi
  labels:
    app.kubernetes.io/name: unifi
    app.kubernetes.io/instance: unifi
    app.kubernetes.io/part-of: unifi
    app.kubernetes.io/managed-by: argocd
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: unifi
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: unifi
          app.kubernetes.io/part-of: unifi
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: MONGO_INITDB_ROOT_PASSWORD
      remoteRef:
        key: k8s/unifi
        property: MONGO_INITDB_ROOT_PASSWORD
    - secretKey: MONGO_PASS
      remoteRef:
        key: k8s/unifi
        property: MONGO_PASS
