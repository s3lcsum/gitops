# OpenBao secret/k8s/hass
# Fields: mosquitto-passwd, mqtt-username, mqtt-password, timemachine-token
# CNPG generates hass_user. Do not put the DB password in OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hass-mosquitto
  namespace: hass
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: hass-mosquitto
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: passwd
      remoteRef:
        key: k8s/hass
        property: mosquitto-passwd
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hass-mqtt
  namespace: hass
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: hass-mqtt
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: username
      remoteRef:
        key: k8s/hass
        property: mqtt-username
    - secretKey: password
      remoteRef:
        key: k8s/hass
        property: mqtt-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hass-timemachine
  namespace: hass
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: hass-timemachine
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: LONG_LIVED_ACCESS_TOKEN
      remoteRef:
        key: k8s/hass
        property: timemachine-token
