# OpenBao secret/k8s/watchyourlan
# Seeded from the pre-ESO hand-made Secret. Consumed by the WatchYourLAN Deployment
# via envFrom (secretRef: watchyourlan), so secretKey == env var name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: watchyourlan
  namespace: watchyourlan
  labels:
    app.kubernetes.io/name: watchyourlan
    app.kubernetes.io/instance: watchyourlan
    app.kubernetes.io/part-of: watchyourlan
    app.kubernetes.io/managed-by: argocd
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: watchyourlan
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: watchyourlan
          app.kubernetes.io/part-of: watchyourlan
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: PG_CONNECT
      remoteRef:
        key: k8s/watchyourlan
        property: PG_CONNECT
