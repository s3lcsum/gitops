# OpenBao secret/k8s/n8n
# Seeded from the pre-ESO hand-made Secret. Consumed by the n8n Deployment via
# envFrom (secretRef: n8n), so secretKey == env var name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/part-of: n8n
    app.kubernetes.io/managed-by: argocd
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: n8n
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: n8n
          app.kubernetes.io/part-of: n8n
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: n8n_encryption_key
      remoteRef:
        key: k8s/n8n
        property: n8n_encryption_key
    - secretKey: db_type
      remoteRef:
        key: k8s/n8n
        property: db_type
    - secretKey: db_postgresdb_host
      remoteRef:
        key: k8s/n8n
        property: db_postgresdb_host
    - secretKey: db_postgresdb_database
      remoteRef:
        key: k8s/n8n
        property: db_postgresdb_database
    - secretKey: db_postgresdb_user
      remoteRef:
        key: k8s/n8n
        property: db_postgresdb_user
    - secretKey: db_postgresdb_password
      remoteRef:
        key: k8s/n8n
        property: db_postgresdb_password
    - secretKey: N8N_API_ENABLED
      remoteRef:
        key: k8s/n8n
        property: N8N_API_ENABLED
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: k8s/n8n
        property: OPENAI_API_KEY
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: k8s/n8n
        property: TELEGRAM_BOT_TOKEN
    - secretKey: TELEGRAM_CHAT_ID
      remoteRef:
        key: k8s/n8n
        property: TELEGRAM_CHAT_ID
    - secretKey: ROUTEROS_API_URL
      remoteRef:
        key: k8s/n8n
        property: ROUTEROS_API_URL
    - secretKey: ROUTEROS_API_USER
      remoteRef:
        key: k8s/n8n
        property: ROUTEROS_API_USER
    - secretKey: ROUTEROS_API_PASS
      remoteRef:
        key: k8s/n8n
        property: ROUTEROS_API_PASS
    - secretKey: WAN_ALLOWLIST_SECRET
      remoteRef:
        key: k8s/n8n
        property: WAN_ALLOWLIST_SECRET
    - secretKey: FOCUS_TOGGL_SECRET
      remoteRef:
        key: k8s/n8n
        property: FOCUS_TOGGL_SECRET
    - secretKey: TOGGL_CALENDAR_SECRET
      remoteRef:
        key: k8s/n8n
        property: TOGGL_CALENDAR_SECRET
    - secretKey: GOOGLE_APPLICATION_CREDENTIALS_JSON
      remoteRef:
        key: k8s/n8n
        property: GOOGLE_APPLICATION_CREDENTIALS_JSON
