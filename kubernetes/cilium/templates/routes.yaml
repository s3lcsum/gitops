apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: https
      port: {{ .Values.edge.traefik.port }}
      targetPort: {{ .Values.edge.traefik.port }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: traefik
  namespace: {{ .Release.Namespace }}
  labels:
    kubernetes.io/service-name: traefik
addressType: IPv4
ports:
  - name: https
    port: {{ .Values.edge.traefik.port }}
    protocol: TCP
endpoints:
  - addresses:
      - {{ .Values.edge.traefik.address | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: cilium
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
{{- range $i, $chunk := .Values.edge.traefikHosts | chunk 31 }}
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: traefik-{{ $i }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    {{- range $chunk }}
    - name: cilium
      sectionName: {{ include "cilium-edge.tlsListener" . }}
    {{- end }}
  hostnames:
    {{- range $chunk }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - backendRefs:
        - name: traefik
          port: {{ $.Values.edge.traefik.port }}
---
{{- end }}
{{- range .Values.edge.origins }}
---
apiVersion: v1
kind: Service
metadata:
  name: origin-{{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  ports:
    - name: origin
      port: {{ .port }}
      targetPort: {{ .port }}
      {{- if .tls }}
      appProtocol: https
      {{- end }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: origin-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    kubernetes.io/service-name: origin-{{ .name }}
addressType: IPv4
ports:
  - name: origin
    port: {{ .port }}
    protocol: TCP
    {{- if .tls }}
    appProtocol: https
    {{- end }}
endpoints:
  - addresses:
      - {{ .address | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: origin-{{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: cilium
      sectionName: https-{{ .name }}
  hostnames:
    - {{ .host | quote }}
  rules:
    - backendRefs:
        - name: origin-{{ .name }}
          port: {{ .port }}
      {{- if .rewriteHostname }}
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: {{ .rewriteHostname | quote }}
      {{- end }}
{{- if .tls }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: origin-{{ .name }}-ca
  namespace: {{ $.Release.Namespace }}
data:
  ca.crt: |
{{ $.Files.Get .tls.caFile | indent 4 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: origin-{{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: origin-{{ .name }}
  validation:
    hostname: {{ .tls.hostname | quote }}
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: origin-{{ .name }}-ca
{{- end }}
{{- end }}
