apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    {{- range .Values.edge.traefikHosts }}
    - name: {{ include "cilium-edge.tlsListener" . }}
      protocol: TLS
      port: 443
      hostname: {{ . | quote }}
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
    {{- range .Values.edge.origins }}
    - name: https-{{ .name }}
      protocol: HTTPS
      port: 443
      hostname: {{ .host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ $.Values.edge.tlsSecret }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
