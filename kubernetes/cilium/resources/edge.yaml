# Source: cilium/templates/routes.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: traefik
  namespace: cilium
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: traefik
  validation:
    # Fixed SNI. Traefik still routes on the original Host header.
    # Wildcard cert matches this name. ISRG Root X1 verifies the LE chain.
    hostname: traefik.dominiksiejak.pl
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: letsencrypt-isrg-root-x1


