apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: origin-nas-ca
  namespace: cilium
spec:
  refreshInterval: 24h
  target:
    name: origin-nas-ca
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations: {}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Fake
          name: origin-nas-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: origin-nas
  namespace: cilium
spec:
  targetRefs:
    - group: ''
      kind: Service
      name: origin-nas
  validation:
    hostname: synology
    caCertificateRefs:
      - group: ''
        kind: Secret
        name: origin-nas-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: origin-nas
  namespace: cilium
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cilium
      sectionName: https
  hostnames:
    - nas.dominiksiejak.pl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: origin-nas
          port: 5001
          weight: 1
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: 192.168.89.240
