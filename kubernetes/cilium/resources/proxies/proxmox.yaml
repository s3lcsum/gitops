apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: origin-proxmox
  namespace: cilium
spec:
  targetRefs:
    - group: ''
      kind: Service
      name: origin-proxmox
  validation:
    hostname: lake.home
    caCertificateRefs:
      - group: ''
        kind: ConfigMap
        name: origin-proxmox-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: origin-proxmox
  namespace: cilium
spec:
  parentRefs:
    - name: cilium
      sectionName: https
  hostnames:
    - proxmox.dominiksiejak.pl
  rules:
    - backendRefs:
        - name: origin-proxmox
          port: 8006
