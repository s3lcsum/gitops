apiVersion: v1
kind: Service
metadata:
  name: origin-proxmox
  namespace: cilium
spec:
  ports:
    - name: origin
      port: 8006
      targetPort: 8006
      appProtocol: https
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: origin-proxmox
  namespace: cilium
  labels:
    kubernetes.io/service-name: origin-proxmox
addressType: IPv4
ports:
  - name: origin
    port: 8006
    protocol: TCP
    appProtocol: https
endpoints:
  - addresses:
      - 192.168.89.254
---
