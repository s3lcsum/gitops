# ApplicationSet chart pin.
repoURL: https://helm.cilium.io/
chart: cilium
version: 1.20.2

# Overrides for cilium 1.20.2 — CNI + kube-proxy replacement only.
# L7 edge is Traefik-k8s (traefik ns). No Gateway API.
k8sServiceHost: 192.168.89.252
k8sServicePort: 6443
kubeProxyReplacement: "true"
k8s:
  requireIPv4PodCIDR: true
ipam:
  mode: kubernetes
routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.244.0.0/16
bpf:
  masquerade: true
  tproxy: false
  hostLegacyRouting: true
operator:
  replicas: 1
envoy:
  enabled: false
gatewayAPI:
  enabled: false
