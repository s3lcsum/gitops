# Overrides for cilium 1.20.2.
# Release namespace is `cilium` (ApplicationSet destination = directory name).
# kube-proxy is not installed. API server is the node IP because nothing
# implements the kubernetes Service ClusterIP.
k8sServiceHost: 192.168.89.252
k8sServicePort: 6443
kubeProxyReplacement: "true"
k8s:
  requireIPv4PodCIDR: true
ipam:
  mode: kubernetes
# Single node. Native routing, no VXLAN.
routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.244.0.0/16
bpf:
  masquerade: true
  # Leave TPROXY on iptables. eBPF TPROXY steals the host :443 handshake
  # (connections sit in SYN_RECV) when Envoy is on the host network.
  tproxy: false
  # Envoy runs on the host and dials LAN origins. Route that traffic through
  # the host stack so replies come back to the node IP.
  hostLegacyRouting: true
operator:
  replicas: 1
envoy:
  enabled: true
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE
gatewayAPI:
  enabled: true
  enableAppProtocol: true
  hostNetwork:
    enabled: true
  gatewayClass:
    create: true
