apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent
  namespace: mediabox
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`qbittorrent.dominiksiejak.pl`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
          namespace: traefik
        - name: secure-headers
          namespace: traefik
        - name: authentik
          namespace: traefik
      services:
        - name: gluetun
          port: 8080
  tls: {}
---
