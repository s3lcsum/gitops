apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: mediabox
  labels:
    app.kubernetes.io/name: flaresolverr
    app.kubernetes.io/instance: flaresolverr
    app.kubernetes.io/part-of: mediabox
    app.kubernetes.io/managed-by: argocd
spec:
  # KEDA ScaledObject (kubernetes/keda) owns this. Default 1; idle scales to 0.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flaresolverr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flaresolverr
        app.kubernetes.io/instance: flaresolverr
        app.kubernetes.io/part-of: mediabox
        app.kubernetes.io/managed-by: argocd
    spec:
      # hostPath / NFS config lives on lake; AI affinity pinned vibe → FailedMount 29h.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/hostname: k8s
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
          env:
            - name: TZ
              value: Europe/Warsaw
          ports:
            - name: http
              containerPort: 8191
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          volumeMounts:
            - name: config
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: mediabox-flaresolverr
---
apiVersion: v1
kind: Service
metadata:
