apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: mediabox
  labels:
    app.kubernetes.io/name: flaresolverr
    app.kubernetes.io/instance: flaresolverr
    app.kubernetes.io/part-of: mediabox
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flaresolverr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flaresolverr
        app.kubernetes.io/instance: flaresolverr
        app.kubernetes.io/part-of: mediabox
        app.kubernetes.io/managed-by: argocd
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["k8s"]
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
          env:
            - name: TZ
              value: Europe/Warsaw
          ports:
            - name: http
              containerPort: 8191
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          volumeMounts:
            - name: config
              mountPath: /app/data
      volumes:
        - name: config
          hostPath:
            path: /mnt/nas-media/k8s/mediabox/flaresolverr
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
