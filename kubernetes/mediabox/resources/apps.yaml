          args: ["--upstream=www.goodreads.com", "--verbose"]
          envFrom:
            - secretRef:
                name: rreading-glasses
          env:
            - name: POSTGRES_HOST
              value: postgres-rw.cloudnative-pg.svc
          ports:
            - name: http
              containerPort: 8788
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
