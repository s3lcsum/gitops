apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
        app.kubernetes.io/instance: monitoring
        app.kubernetes.io/part-of: monitoring
        app.kubernetes.io/managed-by: argocd
    spec:
      priorityClassName: homelab-critical
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: homelab.dominiksiejak.pl/worker
          operator: Exists
          effect: PreferNoSchedule
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.12.1
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            # 9100 is already taken on both nodes.
            - --web.listen-address=:9101
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
            - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
            # Drop pod veth / CNI / loopback — biggest series win. Keep eth*/en*/wl*.
            - --collector.netdev.device-exclude=^(veth.*|cni.*|flannel.*|cali.*|docker.*|br-.*|lo|tun.*|kube-ipvs.*)$
            - --collector.netclass.ignored-devices=^(veth.*|cni.*|flannel.*|cali.*|docker.*|br-.*|lo|tun.*|kube-ipvs.*)$
            # Homelab nodes: drop collectors dashboards/alerts do not use.
            - --no-collector.arp
            - --no-collector.nfs
            - --no-collector.nfsd
            - --no-collector.zfs
            - --no-collector.softnet
            - --no-collector.sockstat
            - --no-collector.netstat
            - --no-collector.thermal_zone
            - --no-collector.edac
            - --no-collector.dmi
            - --no-collector.selinux
            - --no-collector.watchdog
            - --no-collector.schedstat
            - --no-collector.udp_queues
            - --no-collector.bcache
            - --no-collector.btrfs
            - --no-collector.xfs
            - --no-collector.mdadm
            - --no-collector.ipvs
            - --no-collector.fibrechannel
            - --no-collector.infiniband
            - --no-collector.tapestats
            - --no-collector.nvme
            - --no-collector.rapl
            - --no-collector.pcidevice
          ports:
            - name: http
              containerPort: 9101
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
