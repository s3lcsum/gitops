apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: exporter
    app.kubernetes.io/version: 2.20.0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: exporter
    app.kubernetes.io/version: 2.20.0
# Slim RBAC matches --resources=nodes,pods,deployments (alerts + k8s-overview).
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: exporter
    app.kubernetes.io/version: 2.20.0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: exporter
    app.kubernetes.io/version: 2.20.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/instance: monitoring
        app.kubernetes.io/part-of: monitoring
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: exporter
        app.kubernetes.io/version: 2.20.0
    spec:
      priorityClassName: homelab-critical
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args:
            # Alerts + k8s-overview / homelab-overview only.
            - --resources=nodes,pods,deployments
            - --metric-allowlist=kube_node_info,kube_node_status_condition,kube_pod_status_phase,kube_pod_container_status_restarts_total,kube_deployment_status_replicas_available
          ports:
            - name: http-metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /livez
              port: http-metrics
            initialDelaySeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: exporter
    app.kubernetes.io/version: 2.20.0
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
    - name: telemetry
      port: 8081
      targetPort: telemetry
