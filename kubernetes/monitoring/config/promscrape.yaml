global:
  scrape_interval: 300s

scrape_configs:
  - job_name: victoria-metrics
    static_configs:
      - targets:
          - victoria-metrics.monitoring.svc:8428

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: traefik
    static_configs:
      - targets:
          - traefik:9100

  # WatchYourLAN is hostNetwork on the lake node.
  - job_name: "watchyourlan"
    static_configs:
      - targets:
          - "192.168.89.252:8840"

  - job_name: "authentik"
    static_configs:
      - targets:
          - "192.168.89.252:9300"
    metrics_path: /metrics

  - job_name: "proxmox"
    static_configs:
      - targets:
          - "pve-exporter:9221"
    metrics_path: /pve
    params:
      module: [default]
      target: ["proxmox.dominiksiejak.pl"]

  - job_name: "lake"
    static_configs:
      - targets:
          - "192.168.89.254:9100"
    # Proxmox VE host (Debian 13 trixie)

  - job_name: "vibe"
    static_configs:
      - targets:
          - "192.168.89.200:9100"
    # MacBook Pro dev machine (en5 USB Ethernet, static IP)
    # Wi-Fi fallback: 192.168.89.130:9100 (DHCP, may change)

  # Kubernetes Views dashboards expect label cluster on these series.
  - job_name: kube-state-metrics
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - kube-state-metrics.monitoring.svc:8080
    relabel_configs:
      - target_label: cluster
        replacement: homelab

  - job_name: cadvisor
    scrape_interval: 30s
    scheme: https
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
      - target_label: cluster
        replacement: homelab

  - job_name: node-exporter
    scrape_interval: 30s
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        regex: monitoring
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: node-exporter
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - source_labels: [__meta_kubernetes_pod_ip]
        regex: (.+)
        target_label: __address__
        replacement: ${1}:9101
      - target_label: cluster
        replacement: homelab

  - job_name: scraparr
    static_configs:
      - targets:
          - scraparr.mediabox.svc:7100
    metrics_path: /metrics

  - job_name: n8n
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - n8n.n8n.svc:5678

  - job_name: blackbox-netbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "https://netbox.dominiksiejak.pl"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.monitoring.svc:9115

  - job_name: blackbox-auth
