global:
  scrape_interval: 300s

scrape_configs:
  - job_name: victoria-metrics
    static_configs:
      - targets:
          - victoria-metrics.monitoring.svc:8428

  # hostNetwork DaemonSet. Metrics listen on every node :9100.
  # Do not scrape traefik:9100 — chart disables the main Service (service.enabled: false).
  # Scrape by IP (cluster DNS search breaks short names). Relabel instance for Grafana.
  - job_name: traefik
    static_configs:
      - targets:
          - 192.168.89.252:9100
          - 192.168.89.201:9100
    relabel_configs:
      - source_labels: [__address__]
        regex: 192\.168\.89\.252:9100
        target_label: instance
        replacement: k8s:9100
      - source_labels: [__address__]
        regex: 192\.168\.89\.201:9100
        target_label: instance
        replacement: vibe-k8s:9100

  - job_name: "authentik"
    static_configs:
      - targets:
          - "192.168.89.252:9300"
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: k8s:9300

  - job_name: "vibe"
    static_configs:
      - targets:
          - "192.168.89.200:9100"
    # MacBook Pro dev machine (en5 USB Ethernet, static IP)
    # Wi-Fi fallback: 192.168.89.130:9100 (DHCP, may change)
    relabel_configs:
      - target_label: instance
        replacement: vibe:9100

  - job_name: "vibe-ismc"
    static_configs:
      - targets:
          - "192.168.89.200:65002"
    # iSMC + SMART exporter on vibe (LaunchAgent tech.skowronski.ismc-exporter)
    # Feeds dashboard ismc-vibe (temps, fans, power, NVMe SMART).
    relabel_configs:
      - target_label: instance
        replacement: vibe:65002

  # Kubernetes Views dashboards expect label cluster on these series.
  - job_name: kube-state-metrics
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - kube-state-metrics.monitoring.svc:8080
    relabel_configs:
      - target_label: cluster
        replacement: homelab

  - job_name: cadvisor
    scrape_interval: 30s
    scheme: https
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
      - target_label: cluster
        replacement: homelab
    # Keep CPU, working-set RAM, and volume/fs usage (drop the rest of cAdvisor).
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_fs_usage_bytes|container_fs_limit_bytes
        action: keep

  - job_name: node-exporter
    scrape_interval: 30s
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        regex: monitoring
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: node-exporter
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - source_labels: [__meta_kubernetes_pod_ip]
        regex: (.+)
        target_label: __address__
        replacement: ${1}:9101
      - target_label: cluster
        replacement: homelab

  - job_name: scraparr
    static_configs:
      - targets:
          - scraparr.mediabox.svc:7100
    metrics_path: /metrics

  - job_name: n8n
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - n8n.n8n.svc:5678

  # WatchYourLAN hostNetwork on lake (:8840). PROMETHEUS_ENABLE=true → /metrics.
  - job_name: watchyourlan
    scrape_interval: 60s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "192.168.89.252:8840"
    relabel_configs:
      - target_label: instance
        replacement: k8s:8840
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: watch_your_lan_up
        action: keep

  # MKTXP talks to RouterOS API at 192.168.89.1:8728. Not router.dominiksiejak.pl.
  - job_name: mktxp
    scrape_interval: 60s
    static_configs:
      - targets:
          - mktxp.monitoring.svc:49090

  # Synology NAS via snmp-exporter (disk / hrStorage / storageIO).
  # Walk is large — keep scrape_timeout under interval.
  - job_name: synology
    scrape_interval: 120s
    scrape_timeout: 90s
    static_configs:
      - targets:
          - "192.168.89.240"
    params:
      module: [synology]
      auth: [public]
    metrics_path: /snmp
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter.monitoring.svc:9116
    # Disk usage + health; drop high-churn SMART attr dumps if present.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: hrStorage.+|disk(Status|Temperature|Name|Model|Type|HealthStatus|BadSector|RemainLife)|storageIO.+
        action: keep

  # Critical HTTP probes only. Media stack → scraparr; WAN/login → Synthetic Monitoring.
  - job_name: blackbox-auth
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "https://auth.dominiksiejak.pl"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.monitoring.svc:9115

  - job_name: blackbox-hass
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "https://hass.dominiksiejak.pl"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.monitoring.svc:9115

  - job_name: blackbox-traefik
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "https://traefik.dominiksiejak.pl"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.monitoring.svc:9115

  - job_name: blackbox-nas
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "https://nas.dominiksiejak.pl"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.monitoring.svc:9115

  - job_name: blackbox-router
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "https://router.dominiksiejak.pl"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.monitoring.svc:9115

  - job_name: blackbox-adguard
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "https://adguard.dominiksiejak.pl"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.monitoring.svc:9115

  - job_name: blackbox-jellyfin
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "https://jellyfin.dominiksiejak.pl"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.monitoring.svc:9115
