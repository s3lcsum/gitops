# 1Password vault Servers, item sure. Tag: ArgoCD External Secrets Operator
# Fields: SECRET_KEY_BASE, db-password, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, OIDC_ISSUER
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-user
  namespace: cloudnative-pg
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: sure-user
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        username: sure_user
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: sure/db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure
  namespace: sure
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: sure
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        SECRET_KEY_BASE: "{{ .secretKeyBase }}"
        POSTGRES_PASSWORD: "{{ .dbPassword }}"
        OIDC_CLIENT_ID: "{{ .oidcClientId }}"
        OIDC_CLIENT_SECRET: "{{ .oidcClientSecret }}"
        OIDC_ISSUER: "{{ .oidcIssuer }}"
        OIDC_REDIRECT_URI: "https://sure.dominiksiejak.pl/auth/openid_connect/callback"
  data:
    - secretKey: secretKeyBase
      remoteRef:
        key: sure/SECRET_KEY_BASE
    - secretKey: oidcClientId
      remoteRef:
        key: sure/OIDC_CLIENT_ID
    - secretKey: oidcClientSecret
      remoteRef:
        key: sure/OIDC_CLIENT_SECRET
    - secretKey: oidcIssuer
      remoteRef:
        key: sure/OIDC_ISSUER
    - secretKey: dbPassword
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-cnpg
      remoteRef:
        key: sure-user
        property: password
