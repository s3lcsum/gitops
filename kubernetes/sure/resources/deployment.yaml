            - name: POSTGRES_DB
              value: sure_production
            - name: REDIS_URL
              value: redis://sure-redis:6379/1
            - name: WEBAUTHN_RP_ID
              value: sure.dominiksiejak.pl
            - name: WEBAUTHN_ALLOWED_ORIGINS
              value: https://sure.dominiksiejak.pl
          volumeMounts:
            - name: storage
              mountPath: /rails/storage
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: sure-storage
