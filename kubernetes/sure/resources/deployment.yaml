apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-redis
  namespace: sure
  labels:
    app.kubernetes.io/name: sure-redis
    app.kubernetes.io/instance: sure
    app.kubernetes.io/part-of: sure
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sure-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sure-redis
        app.kubernetes.io/instance: sure
        app.kubernetes.io/part-of: sure
        app.kubernetes.io/managed-by: argocd
    spec:
      priorityClassName: homelab-high
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: valkey
          image: ghcr.io/valkey-io/valkey:9.1.2
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sure-redis
  namespace: sure
  labels:
    app.kubernetes.io/name: sure-redis
    app.kubernetes.io/instance: sure
    app.kubernetes.io/part-of: sure
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: sure-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-web
  namespace: sure
  labels:
    app.kubernetes.io/name: sure-web
    app.kubernetes.io/instance: sure
    app.kubernetes.io/part-of: sure
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sure-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sure-web
        app.kubernetes.io/instance: sure
        app.kubernetes.io/part-of: sure
        app.kubernetes.io/managed-by: argocd
    spec:
      priorityClassName: homelab-low
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: db-prepare
          image: ghcr.io/we-promise/sure:stable@sha256:cd6706f544cd5f9b299a586d719776cf2595b483ea1f1a396137da0d23eafb20
          command: ["bash", "-lc"]
          args:
            - |
              until pg_isready -h "$DB_HOST" -p "$DB_PORT"; do echo waiting-db; sleep 5; done
              DISABLE_DATABASE_ENVIRONMENT_CHECK=1 bundle exec rake db:prepare
          envFrom:
            - secretRef:
                name: sure
          env:
            - name: SELF_HOSTED
              value: "true"
            - name: DB_HOST
              value: postgres-rw.cloudnative-pg.svc
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: sure_user
            - name: POSTGRES_DB
              value: sure_production
            - name: REDIS_URL
              value: redis://sure-redis:6379/1
      containers:
        - name: sure
          image: ghcr.io/we-promise/sure:stable@sha256:cd6706f544cd5f9b299a586d719776cf2595b483ea1f1a396137da0d23eafb20
          envFrom:
            - secretRef:
                name: sure
          env:
            - name: SELF_HOSTED
              value: "true"
            - name: ONBOARDING_STATE
              value: open
            - name: RAILS_ASSUME_SSL
              value: "true"
            - name: RAILS_FORCE_SSL
              value: "false"
            - name: DB_HOST
              value: postgres-rw.cloudnative-pg.svc
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: sure_user
            - name: POSTGRES_DB
              value: sure_production
            - name: REDIS_URL
              value: redis://sure-redis:6379/1
            - name: WEBAUTHN_RP_ID
              value: sure.dominiksiejak.pl
            - name: WEBAUTHN_ALLOWED_ORIGINS
              value: https://sure.dominiksiejak.pl
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: storage
              mountPath: /rails/storage
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: sure-storage
---
apiVersion: v1
kind: Service
metadata:
  name: sure
  namespace: sure
  labels:
    app.kubernetes.io/name: sure
    app.kubernetes.io/instance: sure
    app.kubernetes.io/part-of: sure
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: sure-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
