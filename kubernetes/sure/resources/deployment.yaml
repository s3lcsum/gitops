  namespace: sure
  labels:
    app.kubernetes.io/name: sure-worker
    app.kubernetes.io/instance: sure
    app.kubernetes.io/part-of: sure
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
