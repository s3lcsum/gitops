apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/part-of: gitea
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
        app.kubernetes.io/instance: gitea
        app.kubernetes.io/part-of: gitea
        app.kubernetes.io/managed-by: argocd
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: gitea
          image: gitea/gitea:1.27.3
          envFrom:
            - secretRef:
                name: gitea
          env:
            - name: GITEA__server__ROOT_URL
              value: https://git.dominiksiejak.pl
            - name: GITEA__service__ENABLE_PASSWORD_SIGNIN_FORM
              value: "true"
            - name: GITEA__openid__ENABLE_OPENID_SIGNUP
              value: "true"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            - name: GITEA__service__REQUIRE_EXTERNAL_REGISTRATION_PASSWORD
              value: "false"
            - name: GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION
              value: "true"
            - name: GITEA__oauth2_client__ACCOUNT_LINKING
              value: auto
            - name: GITEA__indexer__REPO_INDEXER_ENABLED
              value: "true"
            - name: GITEA__indexer__REPO_INDEXER_TYPE
              value: bleve
            - name: GITEA__indexer__REPO_INDEXER_PATH
              value: indexers/repos.bleve
            - name: GITEA__database__DB_TYPE
              value: postgres
            - name: GITEA__database__HOST
              value: postgres-rw.cloudnative-pg.svc:5432
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          hostPath:
            path: /mnt/nas-media/gitea
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/part-of: gitea
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: gitea
  ports:
    - name: http
      port: 3000
      targetPort: http
