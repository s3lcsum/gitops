# One-shot backfill for objects already in the cluster. Admission mutation
# lives in add-recommended-labels. Every rule here needs mutate.targets
# because mutateExistingOnPolicyUpdate is set.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-recommended-labels-existing
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Add recommended labels to existing resources
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  background: true
  mutateExistingOnPolicyUpdate: true
  rules:
    - name: flannel-daemonset
      match:
        any:
          - resources:
              kinds:
                - DaemonSet
              namespaces:
                - flannel
              names:
                - kube-flannel-ds
      mutate:
        targets:
          - apiVersion: apps/v1
            kind: DaemonSet
            name: kube-flannel-ds
            namespace: flannel
        patchStrategicMerge:
          spec:
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: flannel
                  app.kubernetes.io/instance: flannel
                  app.kubernetes.io/part-of: flannel
                  app.kubernetes.io/managed-by: Helm
    - name: cloudflare-tunnel-controller
      match:
        any:
          - resources:
              kinds:
                - Deployment
              namespaces:
                - cloudflare-tunnel-ingress-controller
              names:
                - cloudflare-tunnel-ingress-controller
      mutate:
        targets:
          - apiVersion: apps/v1
            kind: Deployment
            name: cloudflare-tunnel-ingress-controller
            namespace: cloudflare-tunnel-ingress-controller
        patchStrategicMerge:
          spec:
            template:
              metadata:
                labels:
                  app.kubernetes.io/part-of: cloudflare-tunnel-ingress-controller
                  app.kubernetes.io/managed-by: Helm
    - name: static-control-plane-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - kube-system
              selector:
                matchLabels:
                  tier: control-plane
      preconditions:
        all:
          - key: '{{ request.object.metadata.labels."app.kubernetes.io/name" || "" }}'
            operator: Equals
            value: ""
      mutate:
        targets:
          - apiVersion: v1
            kind: Pod
            name: "{{ request.object.metadata.name }}"
            namespace: kube-system
        patchStrategicMerge:
          metadata:
            labels:
              app.kubernetes.io/name: "{{ request.object.metadata.labels.component }}"
              app.kubernetes.io/instance: "{{ request.object.metadata.labels.component }}"
              app.kubernetes.io/part-of: kubernetes
              app.kubernetes.io/managed-by: kubeadm
    - name: dnscheck
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - default
              names:
                - dnscheck
      mutate:
        targets:
          - apiVersion: v1
            kind: Pod
            name: dnscheck
            namespace: default
        patchStrategicMerge:
          metadata:
            labels:
              app.kubernetes.io/name: dnscheck
              app.kubernetes.io/instance: dnscheck
              app.kubernetes.io/part-of: dnscheck
              app.kubernetes.io/managed-by: kyverno
    - name: scaled-down-replicasets
      match:
        any:
          - resources:
              kinds:
                - ReplicaSet
      preconditions:
        all:
          - key: "{{ request.object.spec.replicas }}"
            operator: Equals
            value: 0
          - key: '{{ request.object.spec.template.metadata.labels."app.kubernetes.io/part-of" || "" }}'
            operator: Equals
            value: ""
      mutate:
        targets:
          - apiVersion: apps/v1
            kind: ReplicaSet
            name: "{{ request.object.metadata.name }}"
            namespace: "{{ request.object.metadata.namespace }}"
        patchStrategicMerge:
          spec:
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: '{{ request.object.spec.template.metadata.labels."app.kubernetes.io/name" || request.object.metadata.namespace }}'
                  app.kubernetes.io/instance: '{{ request.object.spec.template.metadata.labels."app.kubernetes.io/instance" || request.object.metadata.namespace }}'
                  app.kubernetes.io/part-of: "{{ request.object.metadata.namespace }}"
                  app.kubernetes.io/managed-by: '{{ request.object.spec.template.metadata.labels."app.kubernetes.io/managed-by" || "Helm" }}'
