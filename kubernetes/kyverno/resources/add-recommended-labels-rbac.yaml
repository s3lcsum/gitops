# Background controller must be allowed to update the objects
# add-recommended-labels-existing patches. Admission checks this on the policy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-add-recommended-labels
rules:
  - apiGroups:
      - apps
    resources:
      - daemonsets
    resourceNames:
      - kube-flannel-ds
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - cloudflare-tunnel-ingress-controller
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    resourceNames:
      - dnscheck
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  # Historical ReplicaSets (replicas 0) in every namespace.
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
      - update
      - patch
---
# Target name is a variable, so the auth check is for every Pod in kube-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-add-recommended-labels
  namespace: kube-system
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-add-recommended-labels
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno-add-recommended-labels
subjects:
  - kind: ServiceAccount
    name: kyverno-background-controller
    namespace: kyverno
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno-add-recommended-labels
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno-add-recommended-labels
subjects:
  - kind: ServiceAccount
    name: kyverno-background-controller
    namespace: kyverno
