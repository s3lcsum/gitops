# Admission mutate for workloads whose chart cannot emit pod labels, plus
# objects this repo does not template.
# Flannel v0.28.9 hardcodes app/tier. The tunnel controller chart only emits
# selector labels. Stamping on the write keeps Argo's apply to one update.
# Backfill of objects already in the cluster is add-recommended-labels-existing.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-recommended-labels
  annotations:
    policies.kyverno.io/title: Add recommended labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  background: true
  rules:
    - name: flannel-daemonset
      match:
        any:
          - resources:
              kinds:
                - DaemonSet
              namespaces:
                - flannel
              names:
                - kube-flannel-ds
      preconditions:
        all:
          - key: '{{ request.object.spec.template.metadata.labels."app.kubernetes.io/part-of" || "" }}'
            operator: Equals
            value: ""
      mutate:
        patchStrategicMerge:
          spec:
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: flannel
                  app.kubernetes.io/instance: flannel
                  app.kubernetes.io/part-of: flannel
                  app.kubernetes.io/managed-by: Helm
    - name: cloudflare-tunnel-controller
      match:
        any:
          - resources:
              kinds:
                - Deployment
              namespaces:
                - cloudflare-tunnel-ingress-controller
              names:
                - cloudflare-tunnel-ingress-controller
      preconditions:
        all:
          - key: '{{ request.object.spec.template.metadata.labels."app.kubernetes.io/part-of" || "" }}'
            operator: Equals
            value: ""
      mutate:
        patchStrategicMerge:
          spec:
            template:
              metadata:
                labels:
                  app.kubernetes.io/part-of: cloudflare-tunnel-ingress-controller
                  app.kubernetes.io/managed-by: Helm
    - name: static-control-plane-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - kube-system
              selector:
                matchLabels:
                  tier: control-plane
      preconditions:
        all:
          - key: '{{ request.object.metadata.labels."app.kubernetes.io/name" || "" }}'
            operator: Equals
            value: ""
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              app.kubernetes.io/name: "{{ request.object.metadata.labels.component }}"
              app.kubernetes.io/instance: "{{ request.object.metadata.labels.component }}"
              app.kubernetes.io/part-of: kubernetes
              app.kubernetes.io/managed-by: kubeadm
    - name: dnscheck
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - default
              names:
                - dnscheck
      preconditions:
        all:
          - key: '{{ request.object.metadata.labels."app.kubernetes.io/name" || "" }}'
            operator: Equals
            value: ""
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              app.kubernetes.io/name: dnscheck
              app.kubernetes.io/instance: dnscheck
              app.kubernetes.io/part-of: dnscheck
              app.kubernetes.io/managed-by: kyverno
    # Old ReplicaSets stay at replicas 0 after a rollout. The Deployment
    # controller does not rewrite them, so stamp the missing label there.
    - name: scaled-down-replicasets
      match:
        any:
          - resources:
              kinds:
                - ReplicaSet
      preconditions:
        all:
          - key: "{{ request.object.spec.replicas }}"
            operator: Equals
            value: 0
          - key: '{{ request.object.spec.template.metadata.labels."app.kubernetes.io/part-of" || "" }}'
            operator: Equals
            value: ""
      mutate:
        patchStrategicMerge:
          spec:
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: '{{ request.object.spec.template.metadata.labels."app.kubernetes.io/name" || request.object.metadata.namespace }}'
                  app.kubernetes.io/instance: '{{ request.object.spec.template.metadata.labels."app.kubernetes.io/instance" || request.object.metadata.namespace }}'
                  app.kubernetes.io/part-of: "{{ request.object.metadata.namespace }}"
                  app.kubernetes.io/managed-by: '{{ request.object.spec.template.metadata.labels."app.kubernetes.io/managed-by" || "Helm" }}'
