apiVersion: apps/v1
kind: Deployment
metadata:
  name: dozzle
  namespace: dozzle
  labels:
    app.kubernetes.io/name: dozzle
    app.kubernetes.io/instance: dozzle
    app.kubernetes.io/part-of: dozzle
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dozzle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dozzle
        app.kubernetes.io/instance: dozzle
        app.kubernetes.io/part-of: dozzle
        app.kubernetes.io/managed-by: argocd
    spec:
      serviceAccountName: dozzle
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      containers:
        - name: dozzle
          image: ghcr.io/amir20/dozzle:v11.1.1
          env:
            - name: DOZZLE_MODE
              value: k8s
            - name: DOZZLE_AUTH_PROVIDER
              value: forward-proxy
            - name: DOZZLE_AUTH_HEADER_USER
              value: X-authentik-username
            - name: DOZZLE_AUTH_HEADER_EMAIL
              value: X-authentik-email
            - name: DOZZLE_AUTH_HEADER_NAME
              value: X-authentik-name
            - name: DOZZLE_ENABLE_ACTIONS
              value: "false"
            - name: DOZZLE_ENABLE_SHELL
              value: "false"
            - name: DOZZLE_AUTO_UPDATE
              value: "off"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: data
          hostPath:
            path: /mnt/nas-media/k8s/dozzle/data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: dozzle
  namespace: dozzle
  labels:
    app.kubernetes.io/name: dozzle
    app.kubernetes.io/instance: dozzle
    app.kubernetes.io/part-of: dozzle
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: dozzle
  ports:
    - name: http
      port: 8080
      targetPort: http
