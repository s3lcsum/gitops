# Manual RADIUS outpost. docker-local on 192.168.89.253 is down; do not
# point authentik_outpost.radius at that integration.
# AUTHENTIK_TOKEN is the outpost service-account token (intent api),
# not an app password. 1Password item: authentik / radius-token.
# Tag: ArgoCD External Secrets Operator.
# hostNetwork so RouterOS can reach UDP 1812/1813 on 192.168.89.252.
# authentik apply must land before this pod, or the token has no outpost.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-radius-outpost
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-radius-outpost
    app.kubernetes.io/instance: radius-outpost
    app.kubernetes.io/part-of: authentik
    app.kubernetes.io/managed-by: argocd
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: authentik-radius-outpost
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        AUTHENTIK_HOST: https://auth.dominiksiejak.pl
        AUTHENTIK_INSECURE: "false"
        AUTHENTIK_TOKEN: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: authentik/radius-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-radius-outpost
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-radius-outpost
    app.kubernetes.io/instance: radius-outpost
    app.kubernetes.io/part-of: authentik
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-radius-outpost
      app.kubernetes.io/instance: radius-outpost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-radius-outpost
        app.kubernetes.io/instance: radius-outpost
        app.kubernetes.io/part-of: authentik
        app.kubernetes.io/managed-by: argocd
    spec:
      priorityClassName: homelab-low
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: radius
          image: ghcr.io/goauthentik/radius:2026.8.3
          envFrom:
            - secretRef:
                name: authentik-radius-outpost
          ports:
            - name: radius
              containerPort: 1812
              protocol: UDP
            - name: radius-acct
              containerPort: 1813
              protocol: UDP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
