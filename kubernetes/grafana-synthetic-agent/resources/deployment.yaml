apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-synthetic-agent
  namespace: grafana-synthetic-agent
  labels:
    app.kubernetes.io/name: grafana-synthetic-agent
    app.kubernetes.io/instance: grafana-synthetic-agent
    app.kubernetes.io/part-of: grafana-synthetic-agent
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-synthetic-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-synthetic-agent
        app.kubernetes.io/instance: grafana-synthetic-agent
        app.kubernetes.io/part-of: grafana-synthetic-agent
        app.kubernetes.io/managed-by: argocd
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: grafana-synthetic-agent
          image: grafana/synthetic-monitoring-agent:v0.66.0
          command:
            - /bin/sh
            - -c
            - /usr/local/bin/synthetic-monitoring-agent -api-server-address "$API_SERVER" -api-token "$API_TOKEN"
          envFrom:
            - secretRef:
                name: grafana-synthetic-agent
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
