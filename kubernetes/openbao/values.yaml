# Overrides for the vendored OpenBao chart (charts/openbao, 0.29.6 / app v2.6.3).
# Nested under the dependency name. Do not edit charts/openbao/values.yaml.
openbao:
  injector:
    enabled: false
  csi:
    enabled: false
  server:
    standalone:
      enabled: false
    ha:
      enabled: true
      replicas: 1
      raft:
        enabled: true
    dataStorage:
      enabled: true
      size: 2Gi
      storageClass: openbao
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
