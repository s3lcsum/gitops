apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingressroute-dnsendpoints
  namespace: external-dns
  labels:
    app.kubernetes.io/name: ingressroute-dnsendpoints
    app.kubernetes.io/part-of: external-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ingressroute-dnsendpoints
  labels:
    app.kubernetes.io/name: ingressroute-dnsendpoints
    app.kubernetes.io/part-of: external-dns
rules:
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["externaldns.k8s.io"]
    resources: ["dnsendpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ingressroute-dnsendpoints
  labels:
    app.kubernetes.io/name: ingressroute-dnsendpoints
    app.kubernetes.io/part-of: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ingressroute-dnsendpoints
subjects:
  - kind: ServiceAccount
    name: ingressroute-dnsendpoints
    namespace: external-dns
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingressroute-dnsendpoints
  namespace: external-dns
  labels:
    app.kubernetes.io/name: ingressroute-dnsendpoints
    app.kubernetes.io/part-of: external-dns
data:
  bridge.py: |
    import json
    import os
    import re
    import ssl
    import time
    import urllib.error
    import urllib.request

    DOMAIN = os.environ.get("DOMAIN", "dominiksiejak.pl")
    NS = os.environ["POD_NAMESPACE"]
    INTERVAL = int(os.environ.get("INTERVAL", "30"))
    MANAGED = "app.kubernetes.io/managed-by=ingressroute-dnsendpoints"
    HOST = re.compile(r"Host\(`([^`]+)`\)")
    TOKEN = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read()
    CTX = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")

    def api(method, path, body=None):
        data = None if body is None else json.dumps(body).encode()
        req = urllib.request.Request(
            "https://kubernetes.default.svc" + path,
            data=data,
            method=method,
            headers={
                "Authorization": "Bearer " + TOKEN,
                "Accept": "application/json",
                "Content-Type": "application/json",
            },
        )
        try:
            with urllib.request.urlopen(req, context=CTX, timeout=30) as res:
                raw = res.read()
                return res.status, json.loads(raw) if raw else {}
        except urllib.error.HTTPError as err:
            raw = err.read()
            return err.code, json.loads(raw) if raw else {}

    def hosts():
        status, body = api("GET", "/apis/traefik.io/v1alpha1/ingressroutes")
        if status != 200:
            raise RuntimeError(f"list IngressRoutes: {status} {body}")
        found = {}
        for item in body.get("items", []):
            for route in item.get("spec", {}).get("routes", []):
                for name in HOST.findall(route.get("match") or ""):
                    if name == DOMAIN or name.endswith("." + DOMAIN):
                        found[name] = True
        return sorted(found)

    def desired(name):
        slug = name[: -len("." + DOMAIN)] if name.endswith("." + DOMAIN) else name
        slug = re.sub(r"[^a-z0-9-]", "-", slug.lower()).strip("-")[:63]
        return {
            "apiVersion": "externaldns.k8s.io/v1alpha1",
            "kind": "DNSEndpoint",
            "metadata": {
                "name": slug,
                "namespace": NS,
                "labels": {
                    "app.kubernetes.io/name": slug,
                    "app.kubernetes.io/managed-by": "ingressroute-dnsendpoints",
                    "app.kubernetes.io/part-of": "external-dns",
                },
            },
            "spec": {
                "endpoints": [
                    {
                        "dnsName": name,
                        "recordType": "A",
                    }
                ]
            },
        }

    def sync():
        wanted = {h: desired(h) for h in hosts()}
        status, body = api(
            "GET",
            f"/apis/externaldns.k8s.io/v1alpha1/namespaces/{NS}/dnsendpoints?labelSelector={MANAGED}",
        )
        if status != 200:
            raise RuntimeError(f"list DNSEndpoints: {status} {body}")
        have = {item["metadata"]["name"]: item for item in body.get("items", [])}
        for name, obj in wanted.items():
            slug = obj["metadata"]["name"]
            path = f"/apis/externaldns.k8s.io/v1alpha1/namespaces/{NS}/dnsendpoints"
            if slug not in have:
                code, resp = api("POST", path, obj)
                print(f"create {name} -> {code}", flush=True)
                continue
            current = have[slug].get("spec", {}).get("endpoints", [])
            if current != obj["spec"]["endpoints"]:
                code, resp = api("PUT", f"{path}/{slug}", obj)
                print(f"update {name} -> {code}", flush=True)
        for slug, item in have.items():
            dns = (item.get("spec", {}).get("endpoints") or [{}])[0].get("dnsName")
            if dns not in wanted:
                code, resp = api(
                    "DELETE",
                    f"/apis/externaldns.k8s.io/v1alpha1/namespaces/{NS}/dnsendpoints/{slug}",
                )
                print(f"delete {dns} -> {code}", flush=True)
        print(f"synced {len(wanted)} hosts", flush=True)

    while True:
        try:
            sync()
        except Exception as exc:
            print(f"sync failed: {exc}", flush=True)
        time.sleep(INTERVAL)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingressroute-dnsendpoints
  namespace: external-dns
  labels:
    app.kubernetes.io/name: ingressroute-dnsendpoints
    app.kubernetes.io/part-of: external-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingressroute-dnsendpoints
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingressroute-dnsendpoints
        app.kubernetes.io/instance: ingressroute-dnsendpoints
        app.kubernetes.io/part-of: external-dns
        app.kubernetes.io/managed-by: argocd
    spec:
      priorityClassName: homelab-critical
      serviceAccountName: ingressroute-dnsendpoints
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: homelab.dominiksiejak.pl/worker
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      containers:
        - name: bridge
          image: python:3.13-alpine
          command: ["python", "-u", "/opt/bridge/bridge.py"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DOMAIN
              value: dominiksiejak.pl
            - name: INTERVAL
              value: "30"
          volumeMounts:
            - name: script
              mountPath: /opt/bridge
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: script
          configMap:
            name: ingressroute-dnsendpoints
