# Cloudflare DNS API token for the letsencrypt ClusterIssuer.
# 1Password item: Servers / cloudflare-dns / credential
# Tag: ArgoCD External Secrets Operator
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  # Empty template.metadata maps stop ESO copying Argo tracking-id onto Secret.
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations: {}
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-dns/credential
