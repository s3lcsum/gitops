apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/part-of: n8n
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/instance: n8n
        app.kubernetes.io/part-of: n8n
        app.kubernetes.io/managed-by: argocd
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
      containers:
        - name: n8n
          image: ghcr.io/n8n-io/n8n:2.40.7
          envFrom:
            - secretRef:
                name: n8n
          env:
            - name: N8N_METRICS
              value: "true"
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "true"
            - name: N8N_EDITOR_BASE_URL
              value: https://n8n.dominiksiejak.pl
            - name: N8N_HOST
              value: n8n.dominiksiejak.pl
            - name: N8N_PROTOCOL
              value: https
            - name: N8N_SSRF_PROTECTION_ENABLED
              value: "true"
            - name: N8N_SSRF_ALLOWED_IP_RANGES
              value: 192.168.89.1/32,192.168.89.200/32
            - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
              value: "true"
            - name: NODE_FUNCTION_ALLOW_BUILTIN
              value: crypto
            - name: db_postgresdb_host
              value: postgres-rw.cloudnative-pg.svc
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: data
          hostPath:
            path: /mnt/nas-media/k8s/n8n/data
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/part-of: n8n
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: n8n
  ports:
    - name: http
      port: 5678
      targetPort: http
