# App-owned route in policy-reporter ns. Shared middlewares + default TLS live in traefik.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kyverno
  namespace: policy-reporter
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kyverno.dominiksiejak.pl`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
          namespace: traefik
        - name: secure-headers
          namespace: traefik
        - name: authentik
          namespace: traefik
      services:
        - name: policy-reporter-ui
          port: 8080
  tls: {}
