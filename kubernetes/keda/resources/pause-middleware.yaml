# Holds the request while the backend has no endpoints so KEDA can wake the
# Deployment. Without this, Traefik returns 503 the instant replicas hit 0
# and the visitor has to refresh after the pod is up.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: scale-to-zero
  namespace: traefik
spec:
  forwardingTimeouts:
    dialTimeout: 180s
    responseHeaderTimeout: 180s
