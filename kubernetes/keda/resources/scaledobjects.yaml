# Idle HTTP UIs. Default is 1 (idleReplicaCount). KEDA scales to 0 only after
# cooldownPeriod with no requests on that app's interceptor.
# metrics-api reads nginx stub_status. KEDA 2.21 has no nginx scaler.
# fallback.failureThreshold keeps replicas at 1 if the interceptor metrics die.
# Git replicas is 1 so a missing ScaledObject does not pin the app at 0.
#
# Not here: calibre-web-automated (public API), n8n (webhooks), gitea.
# Blackbox HTTP probes hit the interceptor and reset the idle window.
# Do not add blackbox jobs for these hosts.
# UniFi UI sleeps. APs keep forwarding. Inform :8080 and STUN :3478 are dark
# until the UI request wakes the pod. New adopts wait for that.
# flaresolverr has no IngressRoute. Prowlarr and the *arr apps call it on the
# ClusterIP, which does not pass the interceptor, so a cold *arr request 503s
# until something else wakes it.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: headlamp
  namespace: headlamp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: headlamp
  idleReplicaCount: 0
  minReplicaCount: 1
  maxReplicaCount: 1
  cooldownPeriod: 300
  pollingInterval: 15
  fallback:
    failureThreshold: 3
    replicas: 1
  triggers:
    - type: metrics-api
      metadata:
        targetValue: "1"
        url: http://interceptor-headlamp.keda.svc:8081/metrics
        valueLocation: Active connections
        format: "Active connections: {value}"
---
