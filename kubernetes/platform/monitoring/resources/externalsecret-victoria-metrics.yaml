# OpenBao secret/k8s/victoria-metrics
# Seeded from the pre-ESO hand-made Secret. Consumed by the monitoring Deployment
# via envFrom (secretRef: victoria-metrics) for the Uptime Kuma probes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: victoria-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: victoria-metrics
    app.kubernetes.io/instance: victoria-metrics
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: argocd
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: victoria-metrics
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: victoria-metrics
          app.kubernetes.io/part-of: monitoring
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: UPTIME_KUMA_USERNAME
      remoteRef:
        key: k8s/victoria-metrics
        property: UPTIME_KUMA_USERNAME
    - secretKey: UPTIME_KUMA_PASSWORD
      remoteRef:
        key: k8s/victoria-metrics
        property: UPTIME_KUMA_PASSWORD
