# OpenBao secret/grafana
# Fields: synthetic-api-token, synthetic-api-server.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-synthetic-agent
  namespace: grafana-synthetic-agent
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-synthetic-agent
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: API_TOKEN
      remoteRef:
        key: grafana
        property: synthetic-api-token
    - secretKey: API_SERVER
      remoteRef:
        key: grafana
        property: synthetic-api-server
