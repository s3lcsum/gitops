# kubernetes/cloudnative-pg/resources/cluster.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: cloudnative-pg
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  instances: 1
  # Operator already sets name, instance, and managed-by on the pod.
  inheritedMetadata:
    labels:
      app.kubernetes.io/part-of: cloudnative-pg
  enableSuperuserAccess: true
  storage:
    size: 8Gi
    storageClass: local-path
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  # Empty shared cluster: keep default app DB as unused canary; apps add Database CRs.
  bootstrap:
    initdb:
      database: app
      owner: app
  # WAL archiving -> NAS MinIO via the Barman Cloud plugin (ObjectStore "nas").
  # isWALArchiver is mutually exclusive with spec.backup.barmanObjectStore, and
  # only one plugin may claim it. This replaces the in-tree backup config, which
  # is deprecated in CNPG 1.26 and removed in 1.32.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: nas
