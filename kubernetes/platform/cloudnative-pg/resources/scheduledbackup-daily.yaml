# Daily base backup to the NAS ObjectStore.
#
# CNPG's ScheduledBackup cron takes SIX fields (seconds first), unlike a
# Kubernetes CronJob. 03:17 UTC keeps the job off the hour so it does not
# stack with the other nightly work.
#
# method: plugin is required once the Cluster uses spec.plugins (the plugin
# is the WAL archiver). Backups carry pluginConfiguration.name so the plugin
# knows which implementation to invoke.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-daily
  namespace: cloudnative-pg
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: argocd
spec:
  schedule: "0 17 3 * * *"
  immediate: false
  # Wipe backups past retentionPolicy (14d on the ObjectStore) on the NAS.
  backupOwnerReference: self
  cluster:
    name: postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
