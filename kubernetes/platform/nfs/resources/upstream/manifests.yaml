# Source: nfs-subdir-external-provisioner/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: nfs
  name: nfs-nfs-subdir-external-provisioner
  labels:
    chart: nfs-subdir-external-provisioner-4.0.18
    heritage: Helm
    app: nfs-subdir-external-provisioner
    release: nfs
    app.kubernetes.io/instance: nfs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nfs-subdir-external-provisioner
    app.kubernetes.io/part-of: nfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-subdir-external-provisioner
      release: nfs
  template:
    metadata:
      annotations:
      labels:
        app: nfs-subdir-external-provisioner
        release: nfs
        app.kubernetes.io/instance: nfs
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: nfs-subdir-external-provisioner
        app.kubernetes.io/part-of: nfs
    spec:
      serviceAccountName: nfs-nfs-subdir-external-provisioner
      securityContext:
        {}
      priorityClassName: "homelab-critical"
      containers:
        - name: nfs-subdir-external-provisioner
          image: "registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2"
          imagePullPolicy: IfNotPresent
          securityContext:
            {}
          volumeMounts:
            - name: nfs-subdir-external-provisioner-root
              mountPath: /persistentvolumes
          env:
            - name: PROVISIONER_NAME
              value: cluster.local/nfs-nfs-subdir-external-provisioner
            - name: NFS_SERVER
              value: 192.168.89.240
            - name: NFS_PATH
              value: /volume1/media/k8s
      volumes:
        - name: nfs-subdir-external-provisioner-root
          persistentVolumeClaim:
            claimName: pvc-nfs-nfs-subdir-external-provisioner
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
