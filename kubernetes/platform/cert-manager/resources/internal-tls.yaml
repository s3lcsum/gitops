# Wildcard internal TLS, one leaf per application namespace.
#
# SANs: *.<ns>.svc, *.<ns>.svc.cluster.local, *.<ns>.pod.cluster.local
# A wildcard matches exactly one label, so each namespace needs its own leaf;
# *.<ns>.svc.cluster.local covers postgres-rw.<ns>.svc.cluster.local etc.
#
# Secret `internal-tls` (kubernetes.io/tls) is what pods mount. The issuing CA
# chain is available in every namespace as ConfigMap `homelab-ca`
# (key ca-certificates.crt) — see openbao-ca.yaml.
#
# Issuer openbao-internal -> OpenBao pki_int_servers/server-internal.
# Declarative, not Kyverno generate: Kyverno's provenance webhook rejects
# cert-manager's CertificateRequest when the Certificate carries
# generate.kyverno.io/* labels, which stalls issuance forever.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-wildcard-tls
  namespace: adguard
  labels:
    app.kubernetes.io/name: internal-wildcard-tls
    app.kubernetes.io/part-of: internal-tls
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: internal-tls
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - client auth
  commonName: "*.adguard.svc.cluster.local"
  dnsNames:
    - "*.adguard.svc"
    - "*.adguard.svc.cluster.local"
    - "*.adguard.pod.cluster.local"
  issuerRef:
    name: openbao-internal
    kind: ClusterIssuer
    group: cert-manager.io
---
