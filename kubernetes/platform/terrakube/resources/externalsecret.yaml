# 1Password vault Servers, item terrakube. Tag: ArgoCD External Secrets Operator
# Fields: pat-secret, internal-secret, client-secret, valkey,
# minio-root-user, minio-root-password
#
# DB password is NOT in 1Password. Same pattern as hass-user:
# cluster Secret cloudnative-pg/terrakube-user (kubernetes.io/basic-auth),
# referenced by DatabaseRole.passwordSecret. DatasourcePassword copies it
# via ClusterSecretStore kubernetes-cnpg.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terrakube-api-secrets
  namespace: terrakube
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: terrakube-api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        PatSecret: "{{ .patSecret | b64enc }}"
        InternalSecret: "{{ .internalSecret | b64enc }}"
        DexClientId: terrakube
        TerrakubeRedisPassword: "{{ .redisPassword }}"
        AwsStorageAccessKey: "{{ .minioUser }}"
        AwsStorageSecretKey: "{{ .minioPassword }}"
        DatasourcePassword: "{{ .dbPassword }}"
  data:
    - secretKey: patSecret
      remoteRef:
        key: terrakube/pat-secret
    - secretKey: internalSecret
      remoteRef:
        key: terrakube/internal-secret
    - secretKey: redisPassword
      remoteRef:
        key: terrakube/valkey
    - secretKey: minioUser
      remoteRef:
        key: terrakube/minio-root-user
    - secretKey: minioPassword
      remoteRef:
        key: terrakube/minio-root-password
    - secretKey: dbPassword
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-cnpg
      remoteRef:
        key: terrakube-user
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terrakube-executor-secrets
  namespace: terrakube
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: terrakube-executor-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        InternalSecret: "{{ .internalSecret | b64enc }}"
        TerrakubeRedisPassword: "{{ .redisPassword }}"
        AwsTerraformStateAccessKey: "{{ .minioUser }}"
        AwsTerraformStateSecretKey: "{{ .minioPassword }}"
        AwsTerraformOutputAccessKey: "{{ .minioUser }}"
        AwsTerraformOutputSecretKey: "{{ .minioPassword }}"
  data:
    - secretKey: internalSecret
      remoteRef:
        key: terrakube/internal-secret
    - secretKey: redisPassword
      remoteRef:
        key: terrakube/valkey
    - secretKey: minioUser
      remoteRef:
        key: terrakube/minio-root-user
    - secretKey: minioPassword
      remoteRef:
        key: terrakube/minio-root-password
---
