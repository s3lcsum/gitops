---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terrakube-dex
  namespace: terrakube
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  # Separate from Helm Dex secret `terrakube-dex` (config.yaml).
  # Sharing that name with Owner+Replace wiped config → Dex CrashLoop.
  target:
    name: terrakube-dex-client
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: client-secret
      remoteRef:
        key: terrakube/client-secret
