{% load authentik_stages_email %}
<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>{% block title %}SLAB{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#F9F8FD;font-family:Inter,'Segoe UI',system-ui,sans-serif;color:#2A1F3D;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F9F8FD;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
            <tr>
              <td style="background-color:#14101C;border-radius:13px 13px 0 0;overflow:hidden;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td align="center" style="padding:28px 24px 24px 24px;">
                      <a href="https://auth.dominiksiejak.pl" style="text-decoration:none;">
                        <img src="https://auth.dominiksiejak.pl/media/public/slab/logo-horizontal-dark.png" alt="SLAB — dominiksiejak.pl" width="300" style="display:block;max-width:100%;height:auto;border:0;" />
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="background-color:#FFFFFF;border-radius:0 0 13px 13px;border:1px solid #CBB8F0;border-top:none;box-shadow:0 12px 40px rgba(68,51,122,0.12);overflow:hidden;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="height:4px;background:linear-gradient(90deg,#5442AE,#7E4EFC);font-size:0;line-height:0;">&nbsp;</td>
                  </tr>
                  <tr>
                    <td style="padding:32px 28px 8px 28px;">
                      {% block content %}{% endblock %}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 8px 0 8px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EDE8F8;border-radius:13px;border:1px solid #CBB8F0;">
                  <tr>
                    <td style="padding:16px 20px;font-size:13px;line-height:1.5;color:#6B5E80;text-align:center;">
                      {% block sub_content %}{% endblock %}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px 8px 0 8px;font-size:12px;line-height:1.5;color:#6B5E80;letter-spacing:0.08em;text-transform:lowercase;">
                dominiksiejak.pl · SLAB
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
