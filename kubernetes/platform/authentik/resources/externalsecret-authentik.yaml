# OpenBao secret/k8s/authentik
# Seeded from the pre-ESO hand-made Secret. Consumed by the authentik Deployment
# via envFrom (secretRef: authentik), so secretKey == env var name.
# Do not add ldap-token / radius-token / email-* here: those have their own
# ExternalSecrets (outposts, authentik-email) reading the same KV path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/instance: authentik
    app.kubernetes.io/part-of: authentik
    app.kubernetes.io/managed-by: argocd
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authentik
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: authentik
          app.kubernetes.io/part-of: authentik
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: AUTHENTIK_BOOTSTRAP_EMAIL
      remoteRef:
        key: k8s/authentik
        property: AUTHENTIK_BOOTSTRAP_EMAIL
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: k8s/authentik
        property: AUTHENTIK_BOOTSTRAP_PASSWORD
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: k8s/authentik
        property: AUTHENTIK_BOOTSTRAP_TOKEN
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: k8s/authentik
        property: AUTHENTIK_SECRET_KEY
    - secretKey: AUTHENTIK_POSTGRESQL__HOST
      remoteRef:
        key: k8s/authentik
        property: AUTHENTIK_POSTGRESQL__HOST
    - secretKey: AUTHENTIK_POSTGRESQL__NAME
      remoteRef:
        key: k8s/authentik
        property: AUTHENTIK_POSTGRESQL__NAME
    - secretKey: AUTHENTIK_POSTGRESQL__USER
      remoteRef:
        key: k8s/authentik
        property: AUTHENTIK_POSTGRESQL__USER
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: k8s/authentik
        property: AUTHENTIK_POSTGRESQL__PASSWORD
    - secretKey: AUTHENTIK_EMAIL__FROM
      remoteRef:
        key: k8s/authentik
        property: AUTHENTIK_EMAIL__FROM
    - secretKey: AUTHENTIK_EMAIL__HOST
      remoteRef:
        key: k8s/authentik
        property: AUTHENTIK_EMAIL__HOST
    - secretKey: AUTHENTIK_EMAIL__PORT
      remoteRef:
        key: k8s/authentik
        property: AUTHENTIK_EMAIL__PORT
    - secretKey: AUTHENTIK_EMAIL__USERNAME
      remoteRef:
        key: k8s/authentik
        property: AUTHENTIK_EMAIL__USERNAME
    - secretKey: AUTHENTIK_EMAIL__PASSWORD
      remoteRef:
        key: k8s/authentik
        property: AUTHENTIK_EMAIL__PASSWORD
    - secretKey: AUTHENTIK_EMAIL__USE_TLS
      remoteRef:
        key: k8s/authentik
        property: AUTHENTIK_EMAIL__USE_TLS
    - secretKey: AUTHENTIK_EMAIL__USE_SSL
      remoteRef:
        key: k8s/authentik
        property: AUTHENTIK_EMAIL__USE_SSL
    - secretKey: AUTHENTIK_EMAIL__TIMEOUT
      remoteRef:
        key: k8s/authentik
        property: AUTHENTIK_EMAIL__TIMEOUT
