# Manual LDAP outpost. docker-local on 192.168.89.253 is down; do not
# point authentik_outpost.ldap at that integration.
# AUTHENTIK_TOKEN is the outpost service-account token (intent api),
# not an app password. 1Password item: authentik / ldap-token.
# Tag: ArgoCD External Secrets Operator.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-ldap-outpost
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-ldap-outpost
    app.kubernetes.io/instance: ldap-outpost
    app.kubernetes.io/part-of: authentik
    app.kubernetes.io/managed-by: argocd
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: authentik-ldap-outpost
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        AUTHENTIK_HOST: https://auth.dominiksiejak.pl
        AUTHENTIK_INSECURE: "false"
        AUTHENTIK_TOKEN: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: authentik/ldap-token
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-ldap-outpost
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-ldap-outpost
    app.kubernetes.io/instance: ldap-outpost
    app.kubernetes.io/part-of: authentik
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: authentik-ldap-outpost
    app.kubernetes.io/instance: ldap-outpost
  ports:
    # Outpost process binds 3389/6636, not 389/636.
    # Traefik entryPoints own the standard ports and forward here.
    - name: ldap
      port: 389
      targetPort: 3389
      protocol: TCP
    - name: ldaps
      port: 636
      targetPort: 6636
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-ldap-outpost
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-ldap-outpost
    app.kubernetes.io/instance: ldap-outpost
    app.kubernetes.io/part-of: authentik
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-ldap-outpost
      app.kubernetes.io/instance: ldap-outpost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-ldap-outpost
        app.kubernetes.io/instance: ldap-outpost
        app.kubernetes.io/part-of: authentik
        app.kubernetes.io/managed-by: argocd
    spec:
      priorityClassName: homelab-low
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ldap
          image: ghcr.io/goauthentik/ldap:2026.8.3
          envFrom:
            - secretRef:
                name: authentik-ldap-outpost
          ports:
            - name: ldap
              containerPort: 3389
              protocol: TCP
            - name: ldaps
              containerPort: 6636
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
