# Internal TLS for every namespace.
#
# cert-manager + OpenBao issue one wildcard leaf per namespace:
#   Secret internal-tls  <-  Certificate internal-wildcard-tls
#   SANs: *.<ns>.svc, *.<ns>.svc.cluster.local, *.<ns>.pod.cluster.local
#
# Pods mount internal-tls and verify peers against ConfigMap/homelab-ca
# (see kubernetes/platform/cert-manager/resources/openbao-ca.yaml).
# A wildcard matches exactly one label, so each namespace needs its own leaf;
# *.<ns>.svc.cluster.local covers postgres-rw.<ns>.svc.cluster.local and friends.
#
# Trigger is the Namespace object, so namespaces created later (Argo
# CreateNamespace=true) get a leaf automatically. generateExisting covers the
# namespaces that already exist when this policy lands.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: internal-tls-wildcard
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    policies.kyverno.io/title: Wildcard internal TLS per namespace
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Certificate
spec:
  admission: true
  background: true
  generateExisting: true
  rules:
    - name: per-namespace-wildcard
      match:
        any:
          - resources:
              kinds:
                - Namespace
      preconditions:
        all:
          # Kyverno owns these; no leaf wanted and the generate would loop.
          - key: "{{ request.object.metadata.name }}"
            operator: AnyNotIn
            value:
              - kube-system
              - kube-public
              - kube-node-lease
              - kyverno
              - cert-manager
              - openbao
      generate:
        apiVersion: cert-manager.io/v1
        kind: Certificate
        name: internal-wildcard-tls
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          metadata:
            labels:
              app.kubernetes.io/part-of: internal-tls
          spec:
            secretName: internal-tls
            duration: 2160h
            renewBefore: 720h
            privateKey:
              algorithm: ECDSA
              size: 256
              rotationPolicy: Always
            usages:
              - server auth
              - client auth
            dnsNames:
              - "*.{{ request.object.metadata.name }}.svc"
              - "*.{{ request.object.metadata.name }}.svc.cluster.local"
              - "*.{{ request.object.metadata.name }}.pod.cluster.local"
            issuerRef:
              name: openbao-internal
              kind: ClusterIssuer
              group: cert-manager.io
