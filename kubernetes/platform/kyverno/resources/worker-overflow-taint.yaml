# Non-control-plane nodes are overflow capacity.
# PreferNoSchedule is a score penalty, not a filter: pods still land here
# when the control-plane node cannot fit their requests.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: worker-overflow-taint
  annotations:
    policies.kyverno.io/title: Worker overflow taint
    policies.kyverno.io/category: Scheduling
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Node
spec:
  admission: true
  background: true
  emitWarning: false
  validationFailureAction: Audit
  # Node.spec.taints has no strategic-merge key, so patchStrategicMerge would
  # replace the whole list and drop kubelet/controller taints (unreachable,
  # not-ready, cordon). Use JSON6902 add, split by whether the list exists.
  rules:
    - name: taint-non-control-plane-no-taints
      match:
        any:
          - resources:
              kinds:
                - Node
      exclude:
        any:
          - resources:
              selector:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      preconditions:
        all:
          - key: "{{ length(request.object.spec.taints || `[]`) }}"
            operator: Equals
            value: 0
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/taints
            value:
              - key: homelab.dominiksiejak.pl/worker
                value: "true"
                effect: PreferNoSchedule
    - name: taint-non-control-plane-append
      match:
        any:
          - resources:
              kinds:
                - Node
      exclude:
        any:
          - resources:
              selector:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      preconditions:
        all:
          - key: "{{ length(request.object.spec.taints || `[]`) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ length(request.object.spec.taints[?key=='homelab.dominiksiejak.pl/worker'] || `[]`) }}"
            operator: Equals
            value: 0
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/taints/-
            value:
              key: homelab.dominiksiejak.pl/worker
              value: "true"
              effect: PreferNoSchedule
