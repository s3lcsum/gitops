apiVersion: batch/v1
kind: Job
metadata:
  name: kyverno-check-legacy-policies
  namespace: kyverno
  labels:
    app.kubernetes.io/component: hooks
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kyverno-hooks
    app.kubernetes.io/part-of: kyverno
    app.kubernetes.io/version: 3.10.0
    helm.sh/chart: kyverno-3.10.0
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "200"
spec:
  backoffLimit: 0
  # Fail the Job (and unblock the release) if the check can't finish in time,
  # e.g. against a stalled or unreachable API server, so the hook never hangs.
  activeDeadlineSeconds: 120
  # Auto-delete the finished Job (and its Pod) after this many seconds. The Job
  # omits the hook-failed delete policy so a failed run's logs stay available,
  # but on the opt-out recovery path the hook is not rendered again, so nothing
  # would ever clean up a failed Job. This TTL bounds that. Set to 0 or null to
  # keep failed Jobs indefinitely.
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: kyverno-check-legacy-policies
      automountServiceAccountToken: true
      restartPolicy: Never
      containers:
        - name: kyverno-cli
          image: "reg.kyverno.io/kyverno/kyverno-cli:v1.20.0"
          imagePullPolicy: IfNotPresent
          args:
            - check-legacy-policies
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      nodeSelector:
        kubernetes.io/os: linux
