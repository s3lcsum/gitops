# Kyverno stamps generate.kyverno.io/* provenance labels on generated resources.
# cert-manager copies Certificate labels onto the CertificateRequest it creates,
# and Kyverno's own webhooks reject that ("Kyverno generate provenance can only
# be set by Kyverno" / "generate labels can only be set by Kyverno").
# Net effect without this: a generated Certificate stays Issuing forever.
#
# This strips provenance from CertificateRequests at admission, i.e. after
# cert-manager builds them and before any validating webhook sees them.
# MutatingPolicy (CEL) not ClusterPolicy: the CEL form can emit a JSON patch.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: strip-generate-provenance
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    policies.kyverno.io/title: Strip Kyverno generate provenance from CertificateRequests
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: CertificateRequest
spec:
  matchConstraints:
    resourceRules:
      - apiGroups:
          - cert-manager.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - certificaterequests
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        # Guard on has(...) first: a patch that removes an absent key is a no-op
        # and the whole mutation is reported as "not applied".
        expression: >-
          (has(object.metadata.labels) ? object.metadata.labels.map(k, k).filter(k, k.startsWith('generate.kyverno.io/')).map(k, JSONPatch{op: "remove", path: "/metadata/labels/" + k.replace('/', '~1')}) : []) +
          (has(object.metadata.annotations) ? object.metadata.annotations.map(k, k).filter(k, k.startsWith('generate.kyverno.io/') || k.startsWith('kyverno.io/')).map(k, JSONPatch{op: "remove", path: "/metadata/annotations/" + k.replace('/', '~1')}) : [])
