# ApplicationSet chart pin.
repoURL: https://kyverno.github.io/kyverno/
chart: kyverno
version: 3.9.1

# Overrides for kyverno/kyverno 3.9.1 (appVersion v1.19.1).
# Single-node kubeadm (lake): one replica per controller + control-plane toleration.
crds:
  install: true

# Global — applied to all chart workloads; per-controller empty tolerations inherit this.
global:
  priorityClassName: homelab-critical
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

admissionController:
  replicas: 1
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

backgroundController:
  replicas: 1
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

cleanupController:
  replicas: 1
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

# Resource webhooks match Deployments. Fail + a dead admission controller
# freezes applies. The flag forces Ignore while this pod is up. The git
# overlay in resources/webhook-failure-policy.yaml is what Argo puts back
# when the pod is not.
features:
  forceFailurePolicyIgnore:
    enabled: true

reportsController:
  replicas: 1
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
