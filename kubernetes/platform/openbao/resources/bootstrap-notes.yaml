apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-bootstrap
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-bootstrap
    app.kubernetes.io/part-of: openbao
data:
  RUNBOOK.md: |
    # OpenBao bootstrap

    ## 1. Init (once)
    kubectl exec -n openbao openbao-0 -- bao operator init -key-shares=5 -key-threshold=3

    Store unseal-key-1..3 (any 3 of 5 shares) and root-token in 1Password Servers/openbao.
    Force-sync:
      kubectl annotate externalsecret openbao-unseal -n openbao force-sync=$(date +%s) --overwrite

    ## 2. AppRole chicken-egg (once, root token)
    # Full commands: docs/superpowers/plans/2026-10-31-openbao-tofu-auth.md Task 3
    # Result: 1Password fields approle-role-id / approle-secret-id
    # Also store oidc-client-id / oidc-client-secret (Authentik OpenBao app).

    ## 3. App secrets
    # ESO reads secret/k8s/<item> via ClusterSecretStore/openbao (policy eso-read).
    # Do not put unseal shares or the 1Password SA token under k8s/.

    ## 4. Day-2 config
    # tofu/openbao (GCS prefix gitops-openbao) owns:
    #   KV secret/, policies, OIDC default_role=admin, kubernetes eso-openbao, approle terraform
    # Local: AppRole files ~/.config/openbao/{role_id,secret_id}; secrets in KV secret/terraform_env/openbao
    # UI: method oidc/, leave Role blank (do not type Default)

    ## 5. Break-glass
    # root-token in 1Password; prefer OIDC UI or AppRole tofu thereafter
