# Default bus — EventSources/Sensors need this. replicas:1 for single-node lake.
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: argo-events
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  jetstream:
    # Pin to a version listed in configs.jetstream.versions (chart values).
    version: "2.10.29"
    # Pod template only. Selector stays controller / eventbus-name / owner-name.
    metadata:
      labels:
        app.kubernetes.io/name: eventbus
        app.kubernetes.io/instance: default
        app.kubernetes.io/part-of: argo-events
        app.kubernetes.io/managed-by: argocd
    replicas: 1
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: homelab.dominiksiejak.pl/ai
                  operator: In
                  values:
                    - "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: homelab.dominiksiejak.pl/worker
        operator: Exists
        effect: PreferNoSchedule
