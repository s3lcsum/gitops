apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - resources/namespace.yaml
  - resources/externalsecret.yaml
  - resources/deployment.yaml
  - resources/ingressroute.yaml
configMapGenerator:
  - name: homepage-config
    files:
      - settings.yaml=../../stacks/homepage/config/settings.yaml
      - docker.yaml=../../stacks/homepage/config/docker.yaml
      - services.yaml=../../stacks/homepage/config/services.yaml
      - bookmarks.yaml=../../stacks/homepage/config/bookmarks.yaml
      - widgets.yaml=../../stacks/homepage/config/widgets.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    argocd.argoproj.io/sync-wave: "0"
