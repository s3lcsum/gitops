# 1Password vault Servers. Tag: ArgoCD External Secrets Operator
# Item homepage. Field names match HOMEPAGE_VAR_* from stacks/homepage/homepage.env.example.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
  namespace: homepage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: homepage
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: HOMEPAGE_VAR_PORTAINER_TOKEN
      remoteRef:
        key: homepage/HOMEPAGE_VAR_PORTAINER_TOKEN
    - secretKey: HOMEPAGE_VAR_AUTHENTIK_KEY
      remoteRef:
        key: homepage/HOMEPAGE_VAR_AUTHENTIK_KEY
    - secretKey: HOMEPAGE_VAR_CLOUDFLARE_EMAIL
      remoteRef:
        key: homepage/HOMEPAGE_VAR_CLOUDFLARE_EMAIL
    - secretKey: HOMEPAGE_VAR_CLOUDFLARE_API_KEY
      remoteRef:
        key: homepage/HOMEPAGE_VAR_CLOUDFLARE_API_KEY
    - secretKey: HOMEPAGE_VAR_ADGUARD_USER
      remoteRef:
        key: homepage/HOMEPAGE_VAR_ADGUARD_USER
    - secretKey: HOMEPAGE_VAR_ADGUARD_PASS
      remoteRef:
        key: homepage/HOMEPAGE_VAR_ADGUARD_PASS
    - secretKey: HOMEPAGE_VAR_MIKROTIK_USER
      remoteRef:
        key: homepage/HOMEPAGE_VAR_MIKROTIK_USER
    - secretKey: HOMEPAGE_VAR_MIKROTIK_PASS
      remoteRef:
        key: homepage/HOMEPAGE_VAR_MIKROTIK_PASS
    - secretKey: HOMEPAGE_VAR_SYNOLOGY_USER
      remoteRef:
        key: homepage/HOMEPAGE_VAR_SYNOLOGY_USER
    - secretKey: HOMEPAGE_VAR_SYNOLOGY_PASS
      remoteRef:
        key: homepage/HOMEPAGE_VAR_SYNOLOGY_PASS
    - secretKey: HOMEPAGE_VAR_GRAFANA_USER
      remoteRef:
        key: homepage/HOMEPAGE_VAR_GRAFANA_USER
    - secretKey: HOMEPAGE_VAR_GRAFANA_PASS
      remoteRef:
        key: homepage/HOMEPAGE_VAR_GRAFANA_PASS
    - secretKey: HOMEPAGE_VAR_PROXMOX_TOKEN_ID
      remoteRef:
        key: homepage/HOMEPAGE_VAR_PROXMOX_TOKEN_ID
    - secretKey: HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET
      remoteRef:
        key: homepage/HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET
    - secretKey: HOMEPAGE_VAR_HASS_TOKEN
      remoteRef:
        key: homepage/HOMEPAGE_VAR_HASS_TOKEN
    - secretKey: HOMEPAGE_VAR_GITEA_TOKEN
      remoteRef:
        key: homepage/HOMEPAGE_VAR_GITEA_TOKEN
    - secretKey: HOMEPAGE_VAR_JELLYFIN_KEY
      remoteRef:
        key: homepage/HOMEPAGE_VAR_JELLYFIN_KEY
    - secretKey: HOMEPAGE_VAR_RADARR_KEY
      remoteRef:
        key: homepage/HOMEPAGE_VAR_RADARR_KEY
    - secretKey: HOMEPAGE_VAR_SONARR_KEY
      remoteRef:
        key: homepage/HOMEPAGE_VAR_SONARR_KEY
    - secretKey: HOMEPAGE_VAR_BAZARR_USER
      remoteRef:
        key: homepage/HOMEPAGE_VAR_BAZARR_USER
    - secretKey: HOMEPAGE_VAR_BAZARR_KEY
      remoteRef:
        key: homepage/HOMEPAGE_VAR_BAZARR_KEY
    - secretKey: HOMEPAGE_VAR_READARR_KEY
      remoteRef:
        key: homepage/HOMEPAGE_VAR_READARR_KEY
    - secretKey: HOMEPAGE_VAR_SABNZBD_KEY
      remoteRef:
        key: homepage/HOMEPAGE_VAR_SABNZBD_KEY
    - secretKey: HOMEPAGE_VAR_QBT_USER
      remoteRef:
        key: homepage/HOMEPAGE_VAR_QBT_USER
    - secretKey: HOMEPAGE_VAR_QBT_PASS
      remoteRef:
        key: homepage/HOMEPAGE_VAR_QBT_PASS
    - secretKey: HOMEPAGE_VAR_WEATHER_API_KEY
      remoteRef:
        key: homepage/HOMEPAGE_VAR_WEATHER_API_KEY
