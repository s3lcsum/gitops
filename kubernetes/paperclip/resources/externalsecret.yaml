# 1Password vault Servers. Tag: ArgoCD External Secrets Operator
# Item: paperclip / password  (BETTER_AUTH_SECRET)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app.kubernetes.io/name: paperclip
    app.kubernetes.io/instance: paperclip
    app.kubernetes.io/part-of: paperclip
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: paperclip
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: paperclip/password
