apiVersion: v1
kind: Service
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app.kubernetes.io/name: paperclip
    app.kubernetes.io/instance: paperclip
    app.kubernetes.io/part-of: paperclip
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: paperclip
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app.kubernetes.io/name: paperclip
    app.kubernetes.io/instance: paperclip
    app.kubernetes.io/part-of: paperclip
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: paperclip
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperclip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperclip
        app.kubernetes.io/instance: paperclip
        app.kubernetes.io/part-of: paperclip
        app.kubernetes.io/managed-by: argocd
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: homelab.dominiksiejak.pl/worker
          operator: Exists
          effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: homelab.dominiksiejak.pl/ai
                    operator: In
                    values:
                      - "true"
      # kube-dns ClusterIP is unreachable from pods. AdGuard then Cloudflare
      # match the CoreDNS forwarders and are reachable on the LAN.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 192.168.89.253
          - 1.1.1.1
        searches:
          - paperclip.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "2"
      securityContext:
        fsGroup: 1000
      containers:
        - name: paperclip
          image: ghcr.io/paperclipai/paperclip:2026.916.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3100
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PAPERCLIP_HOME
              value: /paperclip
            - name: PAPERCLIP_DEPLOYMENT_MODE
              value: authenticated
            # public exposure refuses embedded Postgres. private keeps the
            # hostname allowlist on; Traefik still publishes the host.
            - name: PAPERCLIP_DEPLOYMENT_EXPOSURE
              value: private
            - name: PAPERCLIP_PUBLIC_URL
              value: https://paperclip.dominiksiejak.pl
            - name: PAPERCLIP_AUTH_PUBLIC_BASE_URL
              value: https://paperclip.dominiksiejak.pl
            - name: PAPERCLIP_ALLOWED_HOSTNAMES
              value: paperclip.dominiksiejak.pl
            # One hop: Traefik-k8s. Needed so Better Auth sees https.
            - name: TRUST_PROXY
              value: "1"
            # Public hostname. Open signup would let anyone create an account.
            - name: PAPERCLIP_AUTH_DISABLE_SIGN_UP
              value: "true"
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: paperclip
                  key: BETTER_AUTH_SECRET
          volumeMounts:
            - name: data
              mountPath: /paperclip
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: 127.0.0.1
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: 127.0.0.1
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
