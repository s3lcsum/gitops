# Cloudflare API token for STRRL tunnel ingress controller.
# Needs Zone:Zone:Read, Zone:DNS:Edit, Account:Cloudflare Tunnel:Edit
# (https://tunnel.strrl.dev/reference/cloudflare-credentials/).
# 1Password item: Servers / cloudflare-tunnel-ingress / credential
# Tag: ArgoCD External Secrets Operator
# account-id + tunnel-name are non-secret (from terraform/cloudflare); only the token is vaulted.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api
  namespace: cloudflare-tunnel-ingress-controller
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: cloudflare-api
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        api-token: "{{ .apitoken }}"
        cloudflare-account-id: "e092ee6780d8a561afd1530702c0fd6a"
        # New tunnel owned by this controller — do not reuse terraform `homelab`.
        cloudflare-tunnel-name: "lake-k8s"
  data:
    - secretKey: apitoken
      remoteRef:
        key: cloudflare-tunnel-ingress/credential
