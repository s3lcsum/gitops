apiVersion: v1
kind: Secret
metadata:
  name: terrakube-ui-secrets
  namespace: terrakube
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  env-config.js: |
    window._env_ = {
      REACT_APP_TERRAKUBE_API_URL: "https://terrakube-api.dominiksiejak.pl/api/v1/",
      REACT_APP_CLIENT_ID: "terrakube",
      REACT_APP_AUTHORITY: "https://terrakube-api.dominiksiejak.pl/dex",
      REACT_APP_REDIRECT_URI: "https://terrakube.dominiksiejak.pl",
      REACT_APP_REGISTRY_URI: "https://terrakube-reg.dominiksiejak.pl",
      REACT_APP_SCOPE: "email openid profile offline_access groups",
      REACT_APP_TERRAKUBE_VERSION: "2.33.1",
    }
