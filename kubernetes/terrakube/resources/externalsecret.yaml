# 1Password vault Servers. Tag every item: ArgoCD External Secrets Operator
# terrakube/pat-secret          raw PAT HMAC secret (chart b64enc's it)
# terrakube/internal-secret     raw internal HMAC secret (chart b64enc's it)
# terrakube-database/password   CNPG role password, also DatasourcePassword
# terrakube-minio/root-user
# terrakube-minio/root-password
# terrakube-valkey/default      Valkey ACL default-user password
# terrakube-dex/client-secret   tofu output -raw applications | jq -r .terrakube.client_secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terrakube-user
  namespace: cloudnative-pg
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: terrakube-user
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        username: terrakube_user
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: terrakube-database/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terrakube-api-secrets
  namespace: terrakube
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: terrakube-api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        PatSecret: "{{ .patSecret | b64enc }}"
        InternalSecret: "{{ .internalSecret | b64enc }}"
        DexClientId: terrakube
        TerrakubeRedisPassword: "{{ .redisPassword }}"
        AwsStorageAccessKey: "{{ .minioUser }}"
        AwsStorageSecretKey: "{{ .minioPassword }}"
        DatasourcePassword: "{{ .dbPassword }}"
  data:
    - secretKey: patSecret
      remoteRef:
        key: terrakube/pat-secret
    - secretKey: internalSecret
      remoteRef:
        key: terrakube/internal-secret
    - secretKey: redisPassword
      remoteRef:
        key: terrakube-valkey/default
    - secretKey: minioUser
      remoteRef:
        key: terrakube-minio/root-user
    - secretKey: minioPassword
      remoteRef:
        key: terrakube-minio/root-password
    - secretKey: dbPassword
      remoteRef:
        key: terrakube-database/password
---
