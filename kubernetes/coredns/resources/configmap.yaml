apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
  labels:
    addonmanager.kubernetes.io/mode: Reconcile
    k8s-app: kube-dns
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        # Short LAN hostnames for in-cluster scrapers (instance=vibe:65002).
        # FQDNs still go to AdGuard via forward.
        hosts {
           192.168.89.200 vibe
           192.168.89.201 vibe-k8s
           192.168.89.252 k8s
           192.168.89.254 lake
           fallthrough
        }
        # Prefer AdGuard (LAN rewrites); then RouterOS DNS; then Cloudflare.
        forward . 192.168.89.252 192.168.89.1 1.1.1.1 {
           policy sequential
           health_check 5s
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
