apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: unifi-insecure
  namespace: unifi
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: unifi
  namespace: unifi
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`unifi.dominiksiejak.pl`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
          namespace: traefik
        - name: secure-headers
          namespace: traefik
      services:
        - name: unifi
          port: 8443
          scheme: https
          serversTransport: unifi-insecure
  tls: {}
