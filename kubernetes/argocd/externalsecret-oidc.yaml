# Merges Authentik OIDC client secret into the existing argocd-secret.
# creationPolicy Merge: do not create/replace the Secret (server.secretkey must survive).
# 1Password item: Servers / argocd-oidc / credential
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-oidc
    app.kubernetes.io/part-of: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: oidc.authentik.clientSecret
      remoteRef:
        key: argocd-oidc/credential
