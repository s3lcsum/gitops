apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kubernetes
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kubernetes
    app.kubernetes.io/part-of: argocd
spec:
  goTemplate: true
  # Drop child Applications when their chart directory leaves the repo.
  # Sync of each child stays manual (no automated prune/selfHeal on the Apps).
  syncPolicy:
    applicationsSync: sync
  generators:
    - git:
        repoURL: https://github.com/s3lcsum/gitops.git
        revision: main
        directories:
          - path: kubernetes/*
          - path: kubernetes/argocd
            exclude: true
  template:
    metadata:
      # Helm must not expand ApplicationSet go-templates — backtick-escape.
      name: '{{`{{.path.basename}}`}}'
      namespace: {{ .Release.Namespace }}
      labels:
        app.kubernetes.io/name: '{{`{{.path.basename}}`}}'
        app.kubernetes.io/part-of: kubernetes
    spec:
      project: default
      source:
        repoURL: https://github.com/s3lcsum/gitops.git
        targetRevision: main
        path: '{{`{{.path.path}}`}}'
        helm:
          releaseName: '{{`{{.path.basename}}`}}'
          valueFiles:
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{`{{.path.basename}}`}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
