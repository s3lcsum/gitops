apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/s3lcsum/gitops.git
    targetRevision: main
    path: kubernetes/argocd
    helm:
      releaseName: argocd
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}
  # ESO merges oidc.authentik.clientSecret into this Helm-owned Secret.
  # Ignore data + ESO reconcile metadata so Argo does not thrash or wipe keys.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: argocd-secret
      jsonPointers:
        - /data
        - /metadata/annotations/reconcile.external-secrets.io~1data-hash
        - /metadata/labels/reconcile.external-secrets.io~1managed
  # Sync is manual. Automated prune/selfHeal on main would apply a bad push
  # and overwrite a live fix.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
