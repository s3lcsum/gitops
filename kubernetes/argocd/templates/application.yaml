apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/s3lcsum/gitops.git
    targetRevision: main
    path: kubernetes/argocd
    helm:
      releaseName: argocd
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}
  # ESO merges oidc.authentik.clientSecret into this Helm-owned Secret.
  # Live also carries Helm release annotations + ESO reconcile metadata.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: argocd-secret
      jqPathExpressions:
        - .data
        - .metadata.annotations
        - .metadata.labels["reconcile.external-secrets.io/managed"]
  # Sync is manual. Automated prune/selfHeal on main would apply a bad push
  # and overwrite a live fix.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
