apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.4.0
      helm:
        releaseName: argocd
        valueFiles:
          - $values/kubernetes/argocd/values.yaml
    - repoURL: https://github.com/s3lcsum/gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/s3lcsum/gitops.git
      targetRevision: main
      path: kubernetes/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Sync is manual. Automated prune/selfHeal on main would apply a bad push
  # and overwrite a live fix.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
