# Overrides for argo-cd 10.4.0 (app v3.5.1) from https://argoproj.github.io/argo-helm.
# Passed straight to that chart. There is no local wrapper chart.
global:
  domain: argocd.k8s.local
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  # Single-node kubeadm: skip anti-affinity / zone pinning.
  affinity:
    podAntiAffinity: none
    nodeAffinity:
      type: none

crds:
  install: true
  keep: true

configs:
  cm:
    # Must match the port-forward. Authentik redirects the browser here.
    url: http://localhost:8080
    admin.enabled: false
    oidc.config: |
      name: Authentik
      issuer: https://auth.dominiksiejak.pl/application/o/argocd/
      clientID: argocd
      clientSecret: $oidc.authentik.clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
  rbac:
    policy.csv: |
      g, admins, role:admin
  params:
    # ClusterIP only. Port-forward uses HTTP. Turn this off when an ingress terminates TLS.
    server.insecure: true
  # Public URL. Optional PAT via 1Password ExternalSecret (see externalsecret-repo-creds.yaml.example). Anonymous GitHub is 60 req/h.
  repositories:
    gitops:
      type: git
      name: gitops
      url: https://github.com/s3lcsum/gitops.git

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

server:
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

dex:
  enabled: false

notifications:
  enabled: false
