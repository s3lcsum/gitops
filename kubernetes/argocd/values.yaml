# Overrides for the vendored argo-cd chart (charts/argo-cd, 10.4.0 / app v3.5.1).
# Nested under the dependency name. Do not edit charts/argo-cd/values.yaml.
argo-cd:
  global:
    domain: argocd.k8s.local
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    # Single-node kubeadm: skip anti-affinity / zone pinning.
    affinity:
      podAntiAffinity: none
      nodeAffinity:
        type: none

  crds:
    install: true
    keep: true

  configs:
    params:
      # ClusterIP only. Port-forward uses HTTP. Turn this off when an ingress terminates TLS.
      server.insecure: true

  controller:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

  repoServer:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

  server:
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

  redis:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

  dex:
    enabled: false

  notifications:
    enabled: false
