# Overrides for argo-cd 10.4.0 (app v3.5.1).
global:
  # Must match browser origin used for SSO (return_url host check).
  domain: argocd.dominiksiejak.pl
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  # Single-node kubeadm: skip anti-affinity / zone pinning.
  affinity:
    podAntiAffinity: none
    nodeAffinity:
      type: none

crds:
  install: true
  keep: true

configs:
  cm:
    # Label tracking (custom key). Cilium secretsync copies ConfigMap
    # annotations into cilium-secrets; annotation tracking-id caused Argo
    # Diff to want those Secrets deleted. Labels are not copied.
    application.resourceTrackingMethod: label
    application.instanceLabelKey: argocd.argoproj.io/instance
    # Keep chart defaults but allow EndpointSlice — Traefik/Cilium backends
    # are Service + EndpointSlice to LAN IPs (Argo must apply them).
    resource.exclusions: |
      ### Network resources created by the Kubernetes control plane
      - apiGroups:
        - ''
        kinds:
        - Endpoints
      ### Internal Kubernetes resources excluded reduce the number of watched events
      - apiGroups:
        - coordination.k8s.io
        kinds:
        - Lease
      ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
      - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
        kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
      ### Intermediate Certificate Request excluded reduce the number of watched events
      - apiGroups:
        - certificates.k8s.io
        kinds:
        - CertificateSigningRequest
      - apiGroups:
        - cert-manager.io
        kinds:
        - CertificateRequest
      ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
      - apiGroups:
        - cilium.io
        kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
      ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
      - apiGroups:
        - kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
        kinds:
        - PolicyReport
        - ClusterPolicyReport
        - EphemeralReport
        - ClusterEphemeralReport
        - AdmissionReport
        - ClusterAdmissionReport
        - BackgroundScanReport
        - ClusterBackgroundScanReport
        - UpdateRequest
    # Public UI. Cilium Gateway terminates TLS and routes to argocd-server:80.
    url: https://argocd.dominiksiejak.pl
    # Port-forward SSO (`kubectl port-forward … 8080:80`). Without these,
    # /auth/login rejects return_url=http://localhost:8080/… with
    # "Invalid redirect URL: the protocol and host … must match".
    additionalUrls: |
      - http://localhost:8080
      - http://localhost:8085
    admin.enabled: false
    oidc.config: |
      name: Authentik
      issuer: https://auth.dominiksiejak.pl/application/o/argocd/
      clientID: argocd
      clientSecret: $oidc.authentik.clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
  rbac:
    policy.csv: |
      g, admins, role:admin
  params:
    # Gateway terminates TLS. Server stays HTTP.
    server.insecure: true
  # Public URL. PAT from 1Password item argocd-github-repo-credentials (resources/externalsecret-repo-creds.yaml).
  repositories:
    gitops:
      type: git
      name: gitops
      url: https://github.com/s3lcsum/gitops.git

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

server:
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

dex:
  enabled: false

notifications:
  enabled: false
