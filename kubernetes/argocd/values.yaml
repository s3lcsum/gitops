# Overrides for the vendored argo-cd chart (charts/argo-cd, 10.4.0 / app v3.5.1).
# Nested under the dependency name. Do not edit charts/argo-cd/values.yaml.
argo-cd:
  global:
    domain: argocd.vibe.local
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    # Single-node KIND: skip anti-affinity / zone pinning.
    affinity:
      podAntiAffinity: none
      nodeAffinity:
        type: none

  crds:
    install: true
    keep: true

  configs:
    params:
      server.insecure: true
    cm:
      # Nested Application CRs should not keep a parent app Progressing.
      resource.customizations.health.argoproj.io_Application: |
        hs = {}
        hs.status = "Healthy"
        hs.message = "Application CR"
        return hs
      # Traefik hostPort on KIND never fills Ingress loadBalancer status.
      resource.customizations.health.networking.k8s.io_Ingress: |
        hs = {}
        hs.status = "Healthy"
        hs.message = "Ingress (KIND/Traefik hostPort)"
        return hs

  server:
    ingress:
      enabled: true
      controller: generic
      ingressClassName: traefik
      hostname: argocd.vibe.local
      tls: false

  dex:
    enabled: false

  notifications:
    enabled: false
