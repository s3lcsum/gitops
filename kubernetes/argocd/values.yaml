# Overrides for argo-cd 10.4.0 (app v3.5.1).
global:
  # Must match browser origin used for SSO (return_url host check).
  domain: argocd.dominiksiejak.pl
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  # Single-node kubeadm: skip anti-affinity / zone pinning.
  affinity:
    podAntiAffinity: none
    nodeAffinity:
      type: none

crds:
  install: true
  keep: true

configs:
  cm:
    # Annotation tracking: copied resources (Cilium secretsync) whose
    # tracking-id does not self-reference must not drive prune/Diff.
    application.resourceTrackingMethod: annotation
    # Public UI. Cilium Gateway terminates TLS and routes to argocd-server:80.
    url: https://argocd.dominiksiejak.pl
    # Port-forward SSO (`kubectl port-forward … 8080:80`). Without these,
    # /auth/login rejects return_url=http://localhost:8080/… with
    # "Invalid redirect URL: the protocol and host … must match".
    additionalUrls: |
      - http://localhost:8080
      - http://localhost:8085
    admin.enabled: false
    oidc.config: |
      name: Authentik
      issuer: https://auth.dominiksiejak.pl/application/o/argocd/
      clientID: argocd
      clientSecret: $oidc.authentik.clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
  rbac:
    policy.csv: |
      g, admins, role:admin
  params:
    # Gateway terminates TLS. Server stays HTTP.
    server.insecure: true
  # Public URL. PAT from 1Password item argocd-github-repo-credentials (resources/externalsecret-repo-creds.yaml).
  repositories:
    gitops:
      type: git
      name: gitops
      url: https://github.com/s3lcsum/gitops.git

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

server:
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

dex:
  enabled: false

notifications:
  enabled: false
