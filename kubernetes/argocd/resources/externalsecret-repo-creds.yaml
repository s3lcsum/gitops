# GitHub PAT from OpenBao secret/argocd. Username is the GitHub login.
# Helm does not own the Secret. ExternalSecret creationPolicy Owner does.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-creds-github
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-repo-creds-github
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: argocd-repo-creds-github
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        type: git
        url: https://github.com/s3lcsum/
        username: s3lcsum
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: argocd
        property: github-pat
