# GitHub PAT from 1Password. Item is PAT-only; username is the GitHub login.
# 1Password item: Servers / argocd-github-repo-credentials / credential
# Tag: ArgoCD External Secrets Operator
# Helm does not own the Secret. ExternalSecret creationPolicy Owner does.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-creds-github
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-repo-creds-github
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: argocd-repo-creds-github
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://github.com/s3lcsum/
        username: s3lcsum
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: argocd-github-repo-credentials/credential
