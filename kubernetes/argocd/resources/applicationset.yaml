apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kubernetes
  namespace: argocd
  labels:
    app.kubernetes.io/name: kubernetes
    app.kubernetes.io/part-of: argocd
spec:
  goTemplate: true
  # Drop child Applications when their values.yaml leaves the repo.
  syncPolicy:
    applicationsSync: sync
  generators:
    # values.yaml is every Helm app. kustomization.yaml joins on values.appName.
    # kind: Kustomization in the merged params means the directory source stays.
    - merge:
        mergeKeys:
          - values
        generators:
          - git:
              repoURL: https://github.com/s3lcsum/gitops.git
              revision: main
              files:
                - path: kubernetes/*/values.yaml
                - path: kubernetes/argocd/values.yaml
                  exclude: true
              values:
                appName: '{{index .path.segments 1}}'
          - git:
              repoURL: https://github.com/s3lcsum/gitops.git
              revision: main
              files:
                - path: kubernetes/*/kustomization.yaml
              values:
                appName: '{{index .path.segments 1}}'
  template:
    metadata:
      name: "{{index .path.segments 1}}"
      namespace: argocd
      labels:
        app.kubernetes.io/name: "{{index .path.segments 1}}"
        app.kubernetes.io/part-of: kubernetes
    spec:
      project: default
      sources:
        - repoURL: "{{.repoURL}}"
          chart: "{{.chart}}"
          targetRevision: "{{.version}}"
          helm:
            releaseName: "{{index .path.segments 1}}"
            # values.yaml carries repoURL/chart/version for this generator.
            # cert-manager's schema rejects those keys.
            skipSchemaValidation: true
            valueFiles:
              - "$values/kubernetes/{{index .path.segments 1}}/values.yaml"
        - repoURL: https://github.com/s3lcsum/gitops.git
          targetRevision: main
          ref: values
        - repoURL: https://github.com/s3lcsum/gitops.git
          targetRevision: main
          path: "kubernetes/{{index .path.segments 1}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{index .path.segments 1}}"
      # Flannel cannot emit pod labels. Kyverno adds them on apply.
      # Ignore the injected keys so selfHeal does not strip them and roll the pods.
      ignoreDifferences:
        - group: apps
          kind: DaemonSet
          name: kube-flannel-ds
          namespace: flannel
          jsonPointers:
            - /spec/template/metadata/labels/app.kubernetes.io~1name
            - /spec/template/metadata/labels/app.kubernetes.io~1instance
            - /spec/template/metadata/labels/app.kubernetes.io~1part-of
            - /spec/template/metadata/labels/app.kubernetes.io~1managed-by
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ServerSideDiff=true
          - RespectIgnoreDifferences=true
  # No kustomization.yaml → directory source would apply values.yaml as a manifest.
  # Drop that source. Apps that have the file keep the template's third source.
  templatePatch: |
    {{- if ne (printf "%v" (index . "kind")) "Kustomization" }}
    spec:
      sources:
        - repoURL: {{ .repoURL | quote }}
          chart: {{ .chart | quote }}
          targetRevision: {{ .version | quote }}
          helm:
            releaseName: {{ index .path.segments 1 | quote }}
            skipSchemaValidation: true
            valueFiles:
              - {{ printf "$values/kubernetes/%s/values.yaml" (index .path.segments 1) | quote }}
        - repoURL: https://github.com/s3lcsum/gitops.git
          targetRevision: main
          ref: values
      ignoreDifferences:
        - group: apps
          kind: DaemonSet
          name: kube-flannel-ds
          namespace: flannel
          jsonPointers:
            - /spec/template/metadata/labels/app.kubernetes.io~1name
            - /spec/template/metadata/labels/app.kubernetes.io~1instance
            - /spec/template/metadata/labels/app.kubernetes.io~1part-of
            - /spec/template/metadata/labels/app.kubernetes.io~1managed-by
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - .spec.replicas
          name: headlamp
          namespace: headlamp
    {{- else }}
    {}
    {{- end }}
