apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kubernetes
  namespace: argocd
  labels:
    app.kubernetes.io/name: kubernetes
    app.kubernetes.io/part-of: argocd
spec:
  goTemplate: true
  # Drop child Applications when their values.yaml leaves the repo.
  # Each child auto-syncs and self-heals. Prune stays off.
  syncPolicy:
    applicationsSync: sync
  generators:
    - git:
        repoURL: https://github.com/s3lcsum/gitops.git
        revision: main
        files:
          - path: kubernetes/*/values.yaml
          - path: kubernetes/argocd/values.yaml
            exclude: true
  template:
    metadata:
      name: "{{index .path.segments 1}}"
      namespace: argocd
      labels:
        app.kubernetes.io/name: "{{index .path.segments 1}}"
        app.kubernetes.io/part-of: kubernetes
    spec:
      project: default
      sources:
        - repoURL: "{{.repoURL}}"
          chart: "{{.chart}}"
          targetRevision: "{{.version}}"
          helm:
            releaseName: "{{index .path.segments 1}}"
            # values.yaml carries repoURL/chart/version for this generator.
            # cert-manager's schema rejects those keys.
            skipSchemaValidation: true
            valueFiles:
              - "$values/kubernetes/{{index .path.segments 1}}/values.yaml"
        - repoURL: https://github.com/s3lcsum/gitops.git
          targetRevision: main
          ref: values
        - repoURL: https://github.com/s3lcsum/gitops.git
          targetRevision: main
          path: "kubernetes/{{index .path.segments 1}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{index .path.segments 1}}"
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          # Gateway API defaulting (group/kind/weight) never matches a
          # client-side diff, so selfHeal reapplies the same objects forever.
          - ServerSideDiff=true
          - RespectIgnoreDifferences=true
      # Belt-and-suspenders with baked-in defaults in HTTPRoute/Gateway manifests.
      ignoreDifferences:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jqPathExpressions:
            - .status
        - group: gateway.networking.k8s.io
          kind: Gateway
          jqPathExpressions:
            - .status
        - group: gateway.networking.k8s.io
          kind: BackendTLSPolicy
          jqPathExpressions:
            - .status
