apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kubernetes
  namespace: argocd
  labels:
    app.kubernetes.io/name: kubernetes
    app.kubernetes.io/part-of: argocd
spec:
  goTemplate: true
  # Drop child Applications when their values.yaml leaves the repo.
  # Each child auto-syncs, self-heals, and prunes.
  syncPolicy:
    applicationsSync: sync
  generators:
    - git:
        repoURL: https://github.com/s3lcsum/gitops.git
        revision: main
        files:
          - path: kubernetes/*/values.yaml
          - path: kubernetes/argocd/values.yaml
            exclude: true
  template:
    metadata:
      name: "{{index .path.segments 1}}"
      namespace: argocd
      labels:
        app.kubernetes.io/name: "{{index .path.segments 1}}"
        app.kubernetes.io/part-of: kubernetes
    spec:
      project: default
      sources:
        - repoURL: "{{.repoURL}}"
          chart: "{{.chart}}"
          targetRevision: "{{.version}}"
          helm:
            releaseName: "{{index .path.segments 1}}"
            # values.yaml carries repoURL/chart/version for this generator.
            # cert-manager's schema rejects those keys.
            skipSchemaValidation: true
            valueFiles:
              - "$values/kubernetes/{{index .path.segments 1}}/values.yaml"
        - repoURL: https://github.com/s3lcsum/gitops.git
          targetRevision: main
          ref: values
        - repoURL: https://github.com/s3lcsum/gitops.git
          targetRevision: main
          path: "kubernetes/{{index .path.segments 1}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{index .path.segments 1}}"
      # Those two charts cannot emit pod labels. Kyverno adds them on apply.
      # Ignore the injected keys so selfHeal does not strip them and roll the pods.
      ignoreDifferences:
        - group: apps
          kind: DaemonSet
          name: kube-flannel-ds
          namespace: flannel
          jsonPointers:
            - /spec/template/metadata/labels/app.kubernetes.io~1name
            - /spec/template/metadata/labels/app.kubernetes.io~1instance
            - /spec/template/metadata/labels/app.kubernetes.io~1part-of
            - /spec/template/metadata/labels/app.kubernetes.io~1managed-by
        - group: apps
          kind: Deployment
          name: cloudflare-tunnel-ingress-controller
          namespace: cloudflare-tunnel-ingress-controller
          jsonPointers:
            - /spec/template/metadata/labels/app.kubernetes.io~1part-of
            - /spec/template/metadata/labels/app.kubernetes.io~1managed-by
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ServerSideDiff=true
          - RespectIgnoreDifferences=true
