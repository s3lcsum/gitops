apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kubernetes
  namespace: argocd
  labels:
    app.kubernetes.io/name: kubernetes
    app.kubernetes.io/part-of: argocd
spec:
  goTemplate: true
  # Drop child Applications when their values.yaml leaves the repo.
  syncPolicy:
    applicationsSync: sync
  generators:
    # values.yaml is every Helm app. kustomization.yaml joins on values.appName.
    # kind: Kustomization in the merged params means the directory source stays.
    - merge:
        mergeKeys:
          - values
        generators:
          - git:
              repoURL: https://github.com/s3lcsum/gitops.git
              revision: main
              files:
                - path: kubernetes/*/values.yaml
                - path: kubernetes/argocd/values.yaml
                  exclude: true
              values:
                appName: '{{index .path.segments 1}}'
          - git:
              repoURL: https://github.com/s3lcsum/gitops.git
              revision: main
              files:
                - path: kubernetes/*/kustomization.yaml
              values:
                appName: '{{index .path.segments 1}}'
  template:
    metadata:
      name: "{{index .path.segments 1}}"
      namespace: argocd
      labels:
        app.kubernetes.io/name: "{{index .path.segments 1}}"
        app.kubernetes.io/part-of: kubernetes
    spec:
      project: default
      sources:
        - repoURL: "{{.repoURL}}"
          chart: "{{.chart}}"
          targetRevision: "{{.version}}"
          helm:
            releaseName: "{{index .path.segments 1}}"
            # values.yaml carries repoURL/chart/version for this generator.
            # cert-manager's schema rejects those keys.
            skipSchemaValidation: true
            valueFiles:
              - "$values/kubernetes/{{index .path.segments 1}}/values.yaml"
        - repoURL: https://github.com/s3lcsum/gitops.git
          targetRevision: main
          ref: values
        - repoURL: https://github.com/s3lcsum/gitops.git
          targetRevision: main
          path: "kubernetes/{{index .path.segments 1}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{index .path.segments 1}}"
      # Flannel cannot emit pod labels. Kyverno adds them on apply.
      # Ignore the injected keys so selfHeal does not strip them and roll the pods.
      ignoreDifferences:
        - group: apps
          kind: DaemonSet
          name: kube-flannel-ds
          namespace: flannel
          jsonPointers:
            - /spec/template/metadata/labels/app.kubernetes.io~1name
            - /spec/template/metadata/labels/app.kubernetes.io~1instance
            - /spec/template/metadata/labels/app.kubernetes.io~1part-of
            - /spec/template/metadata/labels/app.kubernetes.io~1managed-by
        # Same injection on every other DaemonSet (Traefik hostNetwork).
        - group: apps
          kind: DaemonSet
          jqPathExpressions:
            - .spec.template.metadata.labels."app.kubernetes.io/name"
            - .spec.template.metadata.labels."app.kubernetes.io/instance"
            - .spec.template.metadata.labels."app.kubernetes.io/part-of"
            - .spec.template.metadata.labels."app.kubernetes.io/managed-by"
            # Chart emits `annotations:` with no keys (null). SSA then wipes
            # deprecated.daemonset.template.generation, which kube-controller
            # writes and Helm never emits. Key-only ignore does not stop that.
            - .metadata.annotations
        # Endpoint controller defaults conditions to {}. Git omits it.
        - group: discovery.k8s.io
          kind: EndpointSlice
          jqPathExpressions:
            - .endpoints[]?.conditions
        # Kyverno rewrites its own CRDs and admission webhooks after install.
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .metadata.annotations
            - .spec.conversion
            - .status
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
            # Kyverno renames mutate.kyverno.svc-fail → -ignore while up.
            - .webhooks[]?.name
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
            - .webhooks[]?.name
        # Kyverno drops controller-gen annotations and sets conversion.strategy
        # on policies.kyverno.io CRDs after install. Status already ignored.
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .spec.conversion.strategy
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # SSA off. Helm charts (cert-manager, kyverno, CNPG, external-secrets)
        # omit webhook .name. Argo v3.5.3 auto-uses structured-merge diff when
        # ServerSideApply is on, before ignoreDifferences → ComparisonError:
        # "does not contain declared merge key: name"
        # "duplicate entries for key [name=""]".
        # ServerSideDiff alone was not enough; SSA must stay off too.
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
  # No kustomization.yaml → directory source would apply values.yaml as a manifest.
  # Drop that source. Apps that have the file keep the template's third source.
  templatePatch: |
    {{- if ne (printf "%v" (index . "kind")) "Kustomization" }}
    spec:
      sources:
        - repoURL: {{ .repoURL | quote }}
          chart: {{ .chart | quote }}
          targetRevision: {{ .version | quote }}
          helm:
            releaseName: {{ index .path.segments 1 | quote }}
            skipSchemaValidation: true
            valueFiles:
              - {{ printf "$values/kubernetes/%s/values.yaml" (index .path.segments 1) | quote }}
        - repoURL: https://github.com/s3lcsum/gitops.git
          targetRevision: main
          ref: values
      ignoreDifferences:
        - group: apps
          kind: DaemonSet
          name: kube-flannel-ds
          namespace: flannel
          jsonPointers:
            - /spec/template/metadata/labels/app.kubernetes.io~1name
            - /spec/template/metadata/labels/app.kubernetes.io~1instance
            - /spec/template/metadata/labels/app.kubernetes.io~1part-of
            - /spec/template/metadata/labels/app.kubernetes.io~1managed-by
        - group: apps
          kind: DaemonSet
          jqPathExpressions:
            - .spec.template.metadata.labels."app.kubernetes.io/name"
            - .spec.template.metadata.labels."app.kubernetes.io/instance"
            - .spec.template.metadata.labels."app.kubernetes.io/part-of"
            - .spec.template.metadata.labels."app.kubernetes.io/managed-by"
            # Chart emits `annotations:` with no keys (null). SSA then wipes
            # deprecated.daemonset.template.generation. Ignore the whole map.
            - .metadata.annotations
        - group: discovery.k8s.io
          kind: EndpointSlice
          jqPathExpressions:
            - .endpoints[]?.conditions
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .metadata.annotations
            - .spec.conversion
            - .status
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
            - .webhooks[]?.name
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
            - .webhooks[]?.name
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .spec.conversion.strategy
    {{- else }}
    {}
    {{- end }}
