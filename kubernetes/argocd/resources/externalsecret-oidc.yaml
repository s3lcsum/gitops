# Merges Authentik OIDC client secret into the existing argocd-secret.
# creationPolicy Merge: do not create/replace the Secret (server.secretkey must survive).
# Empty template metadata maps stop ESO from copying ExternalSecret labels onto argocd-secret.
# 1Password item: Servers / argocd-oidc / credential
# Tag: ArgoCD External Secrets Operator
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-oidc
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels: {}
        annotations: {}
  data:
    - secretKey: oidc.authentik.clientSecret
      remoteRef:
        key: argocd-oidc/credential
