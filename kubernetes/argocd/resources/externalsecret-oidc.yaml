# Merges Authentik OIDC client secret into the existing argocd-secret.
# creationPolicy Merge: do not create/replace the Secret (server.secretkey must survive).
# Empty template metadata maps stop ESO from copying ExternalSecret labels onto argocd-secret.
# OpenBao secret/argocd, property oidc-client-secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-oidc
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels: {}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  data:
    - secretKey: oidc.authentik.clientSecret
      remoteRef:
        key: argocd
        property: oidc-client-secret
