# Kustomize only. No values.yaml → not in the Helm ApplicationSet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/part-of: kubernetes
spec:
  project: default
  source:
    repoURL: https://github.com/s3lcsum/gitops.git
    targetRevision: main
    path: kubernetes/homepage
  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  # Rollout injects a ReplicaSet hash into these selectors. Empty group
  # is dropped by the API and never converges — omit it.
  ignoreDifferences:
    - kind: Service
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
