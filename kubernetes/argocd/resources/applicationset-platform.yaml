apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kubernetes-platform
  namespace: argocd
  labels:
    app.kubernetes.io/name: kubernetes-platform
    app.kubernetes.io/part-of: argocd
spec:
  goTemplate: true
  # Drop child Applications when their discoverable files leave the repo.
  syncPolicy:
    applicationsSync: sync
  generators:
    - git:
        repoURL: https://github.com/s3lcsum/gitops.git
        revision: main
        files:
          - path: kubernetes/platform/*/kustomization.yaml
  template:
    metadata:
      name: "{{index .path.segments 2}}"
      namespace: argocd
      labels:
        app.kubernetes.io/name: "{{index .path.segments 2}}"
        app.kubernetes.io/part-of: platform
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{index .path.segments 2}}"
      source:
        repoURL: https://github.com/s3lcsum/gitops.git
        targetRevision: main
        path: "{{ .path.path }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
      # Flannel's pod labels are supplied by Kyverno on apply.
      # Ignore the injected keys so selfHeal does not strip them and roll the pods.
      ignoreDifferences:
        - group: apps
          kind: DaemonSet
          name: kube-flannel-ds
          namespace: flannel
          jsonPointers:
            - /spec/template/metadata/labels/app.kubernetes.io~1name
            - /spec/template/metadata/labels/app.kubernetes.io~1instance
            - /spec/template/metadata/labels/app.kubernetes.io~1part-of
            - /spec/template/metadata/labels/app.kubernetes.io~1managed-by
        # Same injection on every other DaemonSet (Traefik hostNetwork).
        - group: apps
          kind: DaemonSet
          jqPathExpressions:
            - .spec.template.metadata.labels."app.kubernetes.io/name"
            - .spec.template.metadata.labels."app.kubernetes.io/instance"
            - .spec.template.metadata.labels."app.kubernetes.io/part-of"
            - .spec.template.metadata.labels."app.kubernetes.io/managed-by"
            # Null `annotations:` in desired state can make SSA wipe
            # deprecated.daemonset.template.generation, which kube-controller
            # writes at runtime. Key-only ignore does not stop that.
            - .metadata.annotations
        # Endpoint controller defaults conditions to {}. Git omits it.
        - group: discovery.k8s.io
          kind: EndpointSlice
          jqPathExpressions:
            - .endpoints[]?.conditions
        # Kyverno rewrites its own CRDs and admission webhooks after install.
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .metadata.annotations
            - .spec.conversion
            - .status
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
            # Do NOT ignore .webhooks[]?.name — RespectIgnoreDifferences strips
            # the strategic-merge key and ComparisonError's with
            # "does not contain declared merge key: name".
            # Kyverno Fail↔Ignore churn while the controller is up.
            - .webhooks[]?.failurePolicy
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
            - .webhooks[]?.failurePolicy
        # Kyverno drops controller-gen annotations and sets conversion.strategy
        # on policies.kyverno.io CRDs after install. Status already ignored.
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .spec.conversion.strategy
        # The CNPG webhook and CRDs fill these Cluster fields after apply.
        # Server-side dry-run of cluster.yaml matches live. RespectIgnoreDifferences
        # strips these paths on apply — do not put git-managed values under them.
        - group: postgresql.cnpg.io
          kind: Cluster
          jqPathExpressions:
            - .spec.affinity.podAntiAffinityType
            - .spec.bootstrap.initdb.encoding
            - .spec.bootstrap.initdb.localeCType
            - .spec.bootstrap.initdb.localeCollate
            - .spec.enablePDB
            - .spec.failoverDelay
            - .spec.imageName
            - .spec.logLevel
            - .spec.maxSyncReplicas
            - .spec.minSyncReplicas
            - .spec.monitoring
            - .spec.plugins[]?.enabled
            - .spec.postgresGID
            - .spec.postgresUID
            - .spec.postgresql
            - .spec.primaryUpdateMethod
            - .spec.primaryUpdateStrategy
            - .spec.probes
            - .spec.replicationSlots
            - .spec.smartShutdownTimeout
            - .spec.startDelay
            - .spec.stopDelay
            - .spec.storage.resizeInUseVolumes
            - .spec.switchoverDelay
  # Keep the apply behavior of the platform apps that already used Kustomize.
  templatePatch: |
    spec:
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          {{- if not (has (index .path.segments 2) (list "authentik" "grafana-synthetic-agent" "monitoring")) }}
          - RespectIgnoreDifferences=true
          {{- end }}
