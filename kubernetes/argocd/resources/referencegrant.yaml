# Lets the argocd Gateway read the wildcard secret that cert-manager writes in cilium.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: argocd-wildcard-tls
  namespace: cilium
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: argocd
  to:
    - group: ""
      kind: Secret
      name: dominiksiejak-pl-tls
