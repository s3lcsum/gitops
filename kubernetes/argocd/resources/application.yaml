apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/s3lcsum/gitops.git
    targetRevision: main
    path: kubernetes/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # ESO merges oidc.authentik.clientSecret into the Argo CD Secret.
  # Live also carries Helm release annotations + ESO reconcile metadata.
  # Omit group. Core/v1 Secret is the default, and an explicit
  # empty group is dropped by the API, so selfHeal never converges.
  ignoreDifferences:
    - kind: Secret
      name: argocd-secret
      jqPathExpressions:
        - .data
        - .metadata.annotations
        - .metadata.labels["reconcile.external-secrets.io/managed"]
  # Auto-sync + selfHeal + prune. ESO-managed Secret keys stay via ignoreDifferences /
  # ExternalSecret template Prune=false (not by disabling Application prune).
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
