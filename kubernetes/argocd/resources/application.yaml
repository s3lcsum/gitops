apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.4.0
      helm:
        releaseName: argocd
        valueFiles:
          - $values/kubernetes/argocd/values.yaml
    - repoURL: https://github.com/s3lcsum/gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/s3lcsum/gitops.git
      targetRevision: main
      path: kubernetes/argocd/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # ESO merges oidc.authentik.clientSecret into this Helm-owned Secret.
  # Live also carries Helm release annotations + ESO reconcile metadata.
  # Omit group. Core/v1 Secret is the default, and an explicit
  # empty group is dropped by the API, so selfHeal never converges.
  ignoreDifferences:
    - kind: Secret
      name: argocd-secret
      jqPathExpressions:
        - .data
        - .metadata.annotations
        - .metadata.labels["reconcile.external-secrets.io/managed"]
  # Auto-sync + selfHeal. Prune stays off.
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
      - RespectIgnoreDifferences=true
