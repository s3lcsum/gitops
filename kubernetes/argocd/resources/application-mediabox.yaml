# Kustomize only. No values.yaml → not in the Helm ApplicationSet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mediabox
  namespace: argocd
  labels:
    app.kubernetes.io/name: mediabox
    app.kubernetes.io/part-of: kubernetes
spec:
  project: default
  source:
    repoURL: https://github.com/s3lcsum/gitops.git
    targetRevision: main
    path: kubernetes/mediabox
  destination:
    server: https://kubernetes.default.svc
    namespace: mediabox
  # KEDA writes replicas. Name-scoped so radarr/sonarr stay pinned.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: flaresolverr
      jqPathExpressions:
        - .spec.replicas
    - group: apps
      kind: Deployment
      name: prowlarr
      jqPathExpressions:
        - .spec.replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
      - RespectIgnoreDifferences=true
