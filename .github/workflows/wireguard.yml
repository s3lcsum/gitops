name: WireGuard

on:
  workflow_dispatch:

# Peer github-actions is a single IP (192.168.200.254/32). Only one
# runner may hold that tunnel at a time — queue others, do not cancel mid-run.
concurrency:
  group: wireguard-peer-github-actions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Connect to home LAN
        uses: ./.github/actions/wireguard
        with:
          private-key: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          public-key: ${{ secrets.WIREGUARD_PUBLIC_KEY }}

      - name: Reach the LAN gateway
        run: ping -c 2 -W 2 192.168.89.1
