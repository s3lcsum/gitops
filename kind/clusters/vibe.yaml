kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vibe
# Single-node KIND on the basement Intel Mac (hostname vibe).
# Same recipe as kind/clusters/local.yaml — different cluster name / machine.
# Traefik binds hostPorts 80/443. ExtraPortMappings keep those ports
# reachable on the Mac even if the CNI does not publish them itself.
networking:
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
