# Traefik on the hermes KIND cluster.
# KIND extraPortMappings forward host :80/:443 onto the control-plane node;
# hostPort binds those node ports into Traefik.
service:
  spec:
    type: ClusterIP

ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

ingressClass:
  enabled: true
  isDefaultClass: true
