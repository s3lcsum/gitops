repos:
  # General file checks: YAML, JSON, whitespace, etc.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^kubernetes/.*/charts/
      - id: end-of-file-fixer
        exclude: ^kubernetes/.*/charts/
      - id: check-yaml
        exclude: (^kubernetes/.*/templates/|^kubernetes/.*/charts/)
      - id: check-json
      - id: check-added-large-files
        args: [ --maxkb=5120 ]
      - id: check-symlinks
      - id: detect-aws-credentials
        args: [ --allow-missing-credentials ]
      - id: detect-private-key
        exclude: ^kubernetes/.*/charts/
      - id: double-quote-string-fixer
      - id: forbid-new-submodules
      - id: mixed-line-ending
        exclude: ^kubernetes/.*/charts/
      - id: pretty-format-json
        exclude: ^(stacks/n8n/workflows/|stacks/monitoring/grafana/provisioning/dashboards/)

  # OpenTofu-specific hooks: formatting and validation
  - repo: https://github.com/tofuutils/pre-commit-opentofu
    rev: v2.4.2
    hooks:
      - id: tofu_fmt
      - id: tofu_validate

  # Terraform linters and security scanners (compatible with OpenTofu configs)
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_tflint

  - repo: local
    hooks:
      - id: gitops-consistency
        name: gitops host consistency
        entry: python3 scripts/check-consistency.py
        language: system
        pass_filenames: false
        files: ^(stacks/|terraform/authentik/|scripts/check-consistency\.py)
      - id: gitops-security-invariants
        name: gitops security invariants
        entry: python3 scripts/test_security_invariants.py
        language: system
        pass_filenames: false
        files: ^(stacks/|terraform/)
