# https://github.com/s3lcsum/gitops/blob/main/stacks/calibre/compose.yaml
# Calibre (desktop UI + content server) and Calibre-Web (browser / OPDS).
# Readarr was archived in 2025; use Calibre's own tools or a small ingest script for automation.
#
# Calibre-Web uses one Calibre library (one metadata.db). If Calibre has multiple library roots,
# point Calibre-Web at the folder that contains the primary metadata.db. Book roots use the same
# host paths inside the container as the calibre service and mediabox (/mnt/LOCAL_MEDIA/books,
# /mnt/NAS_Shared_Media/books).

x-defaults: &defaults
  restart: unless-stopped
  networks:
    - proxy

services:
  calibre:
    <<: *defaults
    image: ghcr.io/linuxserver/calibre:9.13.0
    container_name: calibre
    environment:
      DRINODE: /dev/dri/renderD128
      PUID: 0
      PGID: 0
      TZ: Europe/Warsaw
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - calibre_config:/config
      - /mnt/LOCAL_MEDIA/books:/mnt/LOCAL_MEDIA/books
      - /mnt/NAS_Shared_Media/books:/mnt/NAS_Shared_Media/books
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      traefik.enable: true
      traefik.http.routers.calibre-gui.rule: Host(`calibre-gui.dominiksiejak.pl`)
      traefik.http.routers.calibre-gui.service: calibre-gui
      traefik.http.routers.calibre-gui.middlewares: authentik@docker
      traefik.http.services.calibre-gui.loadbalancer.server.port: 8080

  # First-run: default login admin / admin123 — change immediately.
  # Ingest: anything dropped in /cwa-book-ingest (NAS books/inbox) is auto-imported,
  # metadata-fetched, DRM-stripped (if Adept + DeDRM installed), converted to KEPUB,
  # then removed from ingest. Untouched originals archived to /config/processed_books.
  # Library auto-created at /calibre-library (NAS books/library) if empty.
  # NETWORK_SHARE_MODE=true: library on NFS/SMB → disables SQLite WAL + uses polling watcher.
  calibre-web-automated:
    <<: *defaults
    image: crocodilestick/calibre-web-automated:v4.0.6
    container_name: calibre-web-automated
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/Warsaw
      NETWORK_SHARE_MODE: "true"
      TRUSTED_PROXY_COUNT: "2"
    volumes:
      - cwa_config:/config
      - /mnt/NAS_Shared_Media/books/inbox:/cwa-book-ingest
      - /mnt/NAS_Shared_Media/books/library:/calibre-library
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8083/')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      traefik.enable: true
      traefik.http.routers.calibre-web.rule: Host(`calibre.dominiksiejak.pl`)
      traefik.http.routers.calibre-web.middlewares: remote@file
      traefik.http.services.calibre-web-automated.loadbalancer.server.port: 8083
      traefik.http.routers.calibre-api.rule: Host(`calibre-api.dominiksiejak.pl`)
      traefik.http.routers.calibre-api.middlewares: remote@file
      traefik.http.routers.calibre-api.service: calibre-web-automated

networks:
  proxy:
    external: true

volumes:
  calibre_config:
  cwa_config:
