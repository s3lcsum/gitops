global:
  scrape_interval: 300s

scrape_configs:
  - job_name: victoria-metrics
    static_configs:
      - targets:
          - victoria-metrics:8428

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: traefik
    static_configs:
      - targets:
          - traefik:9100

  - job_name: "gatus"
    static_configs:
      - targets:
          - "gatus:8080"
    metrics_path: /metrics

  # WatchYourLAN uses network_mode: host; scrape via Docker host gateway (not Docker bridge DNS).
  - job_name: "watchyourlan"
    static_configs:
      - targets:
          - "host.docker.internal:8840"

  - job_name: "authentik"
    static_configs:
      - targets:
          - "authentik-server:9300"
    metrics_path: /metrics

  - job_name: "proxmox"
    static_configs:
      - targets:
          - "pve-exporter:9221"
    metrics_path: /pve
    params:
      module: [default]
      target: ["proxmox.dominiksiejak.pl"]

  - job_name: "lake"
    static_configs:
      - targets:
          - "192.168.89.254:9100"
    # Proxmox VE host (Debian 13 trixie)

  - job_name: "vibe"
    static_configs:
      - targets:
          - "192.168.89.200:9100"
    # MacBook Pro dev machine (en5 USB Ethernet, static IP)
    # Wi-Fi fallback: 192.168.89.130:9100 (DHCP, may change)

  - job_name: scraparr
    static_configs:
      - targets:
          - scraparr:7100
    metrics_path: /metrics

  - job_name: blackbox-portainer
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "https://portainer.dominiksiejak.pl"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-vault
    metrics_path: /probe
    params:
      module: [http_2xx]
