# https://github.com/s3lcsum/gitops/blob/main/stacks/dozzle/compose.yaml

services:
  dozzle:
    image: ghcr.io/amir20/dozzle:v11.1.1
    container_name: dozzle
    restart: unless-stopped
    # v11 prompts a setup wizard when /data is empty and sessions are signed
    # with a secret persisted there, so /data must be a volume. Auth is owned
    # by Authentik via forward-proxy, which sends X-authentik-* headers rather
    # than dozzle's Remote-* defaults.
    environment:
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_AUTH_HEADER_USER: X-authentik-username
      DOZZLE_AUTH_HEADER_EMAIL: X-authentik-email
      DOZZLE_AUTH_HEADER_NAME: X-authentik-name
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_AUTO_UPDATE: "off"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - data:/data
    networks:
      - proxy
    labels:
      traefik.enable: true

networks:
  proxy:
    external: true

volumes:
  data:
