# https://hub.docker.com/r/linuxserver/unifi-network-application

services:
  unifi:
    image: lscr.io/linuxserver/unifi-network-application:10.5.67
    container_name: unifi
    restart: unless-stopped
    network_mode: host
    # /opt/unifi/unifi.env must define MONGO_PASS and MONGO_INITDB_ROOT_PASSWORD
    # with the same value (app reads the former, unifi-db init reads the latter).
    env_file:
      - /opt/unifi/unifi.env
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Warsaw
      MONGO_USER: unifi
      MONGO_HOST: 127.0.0.1
      MONGO_PORT: 27017
      MONGO_DBNAME: unifi
      MONGO_AUTHSOURCE: admin
    volumes:
      - config:/config
    depends_on:
      - unifi-db
    labels:
      traefik.enable: true
      traefik.http.services.unifi.loadbalancer.server.port: 8443
      traefik.http.services.unifi.loadbalancer.server.scheme: https
      traefik.http.services.unifi.loadbalancer.serversTransport: insecure@file

  unifi-db:
    # MongoDB 8.0+ refuses to start on Linux kernel >= 6.19 (tcmalloc/rseq bug,
    # SERVER-121912) and exits with "known incompatibility with this version of
    # MongoDB". On a kernel 7.x Proxmox host this crash-loops forever.
    # MongoDB 7.0.x is unaffected and starts normally. Do NOT bump this to 8.x
    # unless the host kernel is pinned below 6.19; moving an existing 8.x data
    # dir back to 7.x needs a mongodump/restore, which requires a running 8.x.
    image: mongo:8.3.8
    container_name: unifi-db
    restart: unless-stopped
    env_file:
      - /opt/unifi/unifi.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: unifi
      MONGO_INITDB_DATABASE: unifi
    ports:
      - 127.0.0.1:27017:27017
    volumes:
      - db:/data/db
    networks:
      - unifi

networks:
  unifi:

volumes:
  config:
  db:
