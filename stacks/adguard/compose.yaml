# https://github.com/s3lcsum/gitops/blob/main/stacks/adguard/compose.yaml

services:
  adguard:
    image: adguard/adguardhome:v0.107.79
    container_name: adguard
    restart: always
    network_mode: host
    volumes:
      - work:/opt/adguardhome/work
      - /opt/adguard/conf:/opt/adguardhome/conf
    # Host network: Docker provider (network: proxy) ignores these labels.
    # The router is adguard@file in stacks/traefik/dynamic.yaml.
    labels:
      traefik.enable: true
      # Edge Authentik on Traefik-k8s; this Traefik is origin only.
      traefik.http.services.adguard.loadbalancer.server.url: http://host.docker.internal:3000
volumes:
  work:
