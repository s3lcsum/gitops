log:
  level: INFO

accessLog: {}

entryPoints:
  web:
    address: ":80"
    asDefault: false
    http:
      redirections:
        entrypoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    asDefault: true
    forwardedHeaders:
      trustedIPs:
        - "172.16.0.0/12"
        - "10.0.0.0/8"
        - "192.168.0.0/16"
        # Traefik-k8s edge on lake node
        - "192.168.89.252/32"
    http3: {}
    http:
      # Edge auth (CrowdSec + Authentik) lives on Traefik-k8s.
      # This instance is the Docker origin only.
      tls:
        certResolver: letsencrypt
        domains:
          - main: dominiksiejak.pl
            sans:
              - '*.dominiksiejak.pl'

  traefik:
    address: ":8080"
    asDefault: false

  metrics:
    address: ":9100"
    asDefault: false

api:
  dashboard: true
  insecure: false

ping: {}

providers:
  docker:
    exposedByDefault: false
    # Host-network containers are not on this network, so their labels never
    # load. hass, adguard, unifi, and watchyourlan are routed from dynamic.yaml.
    network: proxy
    defaultRule: "Host(`{{ .ContainerName }}.dominiksiejak.pl`)"
  file:
    filename: /etc/traefik/dynamic.yaml

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@dominiksiejak.pl
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: "0"
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
        disablePropagationCheck: false

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0

experimental:
  plugins:
    crowdsec-bouncer-traefik-plugin:
      moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      version: "v1.4.4"
