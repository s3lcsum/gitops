# Mosquitto MQTT broker — used by Home Assistant and zigbee2mqtt
persistence true
persistence_location /mosquitto/data/

# Cannot bind 0.0.0.0:1883 together with 127.0.0.1:1883 — they overlap and
# mosquitto exits with "Error: Address in use". Use distinct bind addresses.
# Create the password file on the host (uid 1883 must be able to read it):
#   docker run --rm -v /opt/hass:/pw eclipse-mosquitto:2.1.2-alpine \
#     mosquitto_passwd -c -b /pw/mosquitto.passwd mqtt 'choose-a-long-password'
#   chown 1883:1883 /opt/hass/mosquitto.passwd && chmod 640 /opt/hass/mosquitto.passwd
# Then put the same user/password in /opt/hass/mqtt.env (see mqtt.env.example).

# HA is host-networked and talks to localhost. Keep this listener anonymous
# so the broker healthcheck and Home Assistant keep working without a password.
listener 1883 127.0.0.1
listener_allow_anonymous true

# LAN IoT (Tasmota and similar) → portainer host IP
listener 1883 192.168.89.253
listener_allow_anonymous false
password_file /mosquitto/config/passwd

# Docker host-gateway (zigbee2mqtt extra_hosts: mosquitto:host-gateway)
listener 1883 172.17.0.1
listener_allow_anonymous false
password_file /mosquitto/config/passwd
