# Mosquitto MQTT broker — used by Home Assistant and zigbee2mqtt
per_listener_settings true
persistence true
persistence_location /mosquitto/data/

# HA is host-networked and talks to localhost. Keep this listener anonymous
# so the broker healthcheck and Home Assistant keep working without a password.
listener 1883 127.0.0.1
allow_anonymous true

# LAN / Docker (host-gateway) requires a password. Create the file on the host:
#   docker run --rm -v /opt/hass:/pw eclipse-mosquitto:2.1.2-alpine \
#     mosquitto_passwd -c -b /pw/mosquitto.passwd mqtt 'choose-a-long-password'
# Then put the same user/password in /opt/hass/mqtt.env (see mqtt.env.example).
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
