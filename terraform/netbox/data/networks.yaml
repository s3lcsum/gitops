# Homelab IP plan — keep in sync with terraform/routeros, kubernetes/flannel, AGENTS.md.
# IPv4 only. No dual-stack / ULA in use (old fd12: Talos prefixes dropped).
prefixes:
  lan-ipv4:
    prefix: 192.168.89.0/24
    site: lake
    description: Primary LAN — DHCP (.100-.199 via RouterOS), Wi‑Fi, servers, NAS, IoT (flat L2)
    is_pool: true
    status: active

  wireguard-ipv4:
    prefix: 192.168.200.0/24
    site: lake
    description: WireGuard overlay (vpn.dominiksiejak.pl:51820) — peers; CI github-actions .254/32
    is_pool: false
    status: active

  k8s-pods-ipv4:
    prefix: 10.244.0.0/16
    site: lake
    description: Flannel host-gw pod CIDR (matches kubernetes/flannel values)
    is_pool: false
    status: active

# Static / reserved host addresses (CIDR form required by NetBox).
# DHCP clients (.100-.199) stay out of this map.
ip_addresses:
  router:
    address: 192.168.89.1/24
    site: lake
    status: active
    description: MikroTik RouterOS gateway

  vibe:
    address: 192.168.89.200/24
    site: lake
    status: active
    description: Mac host vibe (SSH / node_exporter)

  vibe-k8s:
    address: 192.168.89.201/24
    site: lake
    status: active
    description: vibe Lima/k8s worker bridge (Traefik hostNetwork, NFS client)

  nas:
    address: 192.168.89.240/24
    site: lake
    status: active
    description: Synology NAS (NFS server)

  k8s:
    address: 192.168.89.252/24
