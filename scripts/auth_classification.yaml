# Every Traefik-routed host (see scripts/check-consistency.py traefik_hosts) must appear
# under exactly one class. Classes:
#   forward-auth — Traefik middleware authentik@docker
#   native-oidc  — app handles OIDC/SSO itself (or native admin login + OIDC)
#   public       — intentional unauthenticated / edge-only auth (basicAuth, IdP, catalog)
#   lan-only     — not meant for WAN (none today)
#
# Adding a new Traefik host without classifying it fails `make consistency` / pre-commit.

forward-auth:
  - adguard
  - adminer
  - bazarr
  - calibre-gui
  - dozzle
  - hass-timemachine
  - jellyfin
  - lan
  - metrics
  - opencode
  - profilarr
  - prowlarr
  - qbittorrent
  - radarr
  - readarr
  - sabnzbd
  - sonarr
  - traefik
  - zigbee2mqtt-usb
  - zigbee2mqtt-wifi

native-oidc:
  - calibre          # CWA native OIDC
  - ghostfolio
  - git              # Gitea
  - grafana
  - hass             # Home Assistant
  - hermes
  - n8n              # UI OIDC; /webhook* bypasses Authentik by design
  - nas              # Synology DSM OIDC
  - netbox
  - portainer
  - proxmox
  - router           # RouterOS native SSO
  - seerr
  - vault
  - vaultwarden
  - wealthfolio

public:
  - auth             # IdP itself
  - calibre-api      # OPDS / device sync
  - homepage         # intentional unauthenticated catalog (config in repo)
  - status           # Gatus status page
  - unifi            # controller local auth

lan-only: []
