# Every Traefik-routed host must appear under exactly one class.
# Classes (middleware on Traefik-k8s IngressRoute):
#   forward-auth — crowdsec + secure-headers + authentik
#   native-oidc  — crowdsec + secure-headers (app SSO)
#   public       — crowdsec + secure-headers
#   lan-only     — crowdsec + secure-headers + lan-only
#
# k8s-only hosts (not Portainer hop): argocd, headlamp, paperclip, policy-reporter, traefik, workflows
# ldap.dominiksiejak.pl is IngressRouteTCP to the Authentik LDAP outpost.
# Not an HTTP auth class — LDAPS on :636, not Authentik forward-auth.
# LAN metal (Traefik-k8s → host): nas, proxmox, router, zigbee-bridge

forward-auth:
  - adguard
  - calibre-gui
  - dozzle
  - hass-timemachine
  - headlamp
  - lan
  - metrics
  - policy-reporter
  - qbittorrent
  - traefik
  - zigbee-bridge
  - zigbee2mqtt-usb
  - zigbee2mqtt-wifi

native-oidc:
  - argocd
  - bazarr
  - calibre
  - git
  - grafana
  - hass
  - jellyfin
  - n8n
  - nas
  - netbox
  - paperclip
  - portainer
  - profilarr
  - prowlarr
  - proxmox
  - radarr
  - readarr
  - router
  - sabnzbd
  - seerr
  - sonarr
  - wealthfolio
  - workflows

public:
  - auth
  - calibre-api
  - homepage
  - status
  - unifi

lan-only:
  - adminer
