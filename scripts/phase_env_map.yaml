# Compose env files → Phase apps (environment: prod).
# Bootstrap files are never exported from Phase (chicken-egg).

bootstrap:
  - phase/phase.env

apps:
  - path: authentik/authentik.env
    app: authentik
  - path: cloudflared/cloudflared.env
    app: cloudflared
  - path: gatus/gatus.env
    app: gatus
  - path: gitea/gitea.env
    app: gitea
  - path: grafana-synthetic-agent/grafana-synthetic-agent.env
    app: grafana-synthetic-agent
  - path: hass/mqtt.env
    app: hass-mqtt
  - path: hass/timemachine.env
    app: hass-timemachine
  - path: homepage/homepage.env
    app: homepage
  - path: mediabox/gluetun.env
    app: mediabox-gluetun
  - path: mediabox/rreading-glasses.env
    app: mediabox-rreading-glasses
  - path: mediabox/sabnzbd.env
    app: mediabox-sabnzbd
  - path: mediabox/scraparr.env
    app: mediabox-scraparr
  - path: monitoring/blackbox-exporter.env
    app: monitoring-blackbox-exporter
  - path: monitoring/grafana.env
    app: monitoring-grafana
  - path: monitoring/victoria-metrics.env
    app: monitoring-victoria-metrics
  - path: n8n/n8n.env
    app: n8n
  - path: netbox/netbox.env
    app: netbox
  - path: postgres/postgres.env
    app: postgres
  - path: traefik/crowdsec.env
    app: traefik-crowdsec
  - path: traefik/traefik.env
    app: traefik
  - path: unifi/unifi.env
    app: unifi
  - path: v-maintenance/v-maintenance.env
    app: v-maintenance
  - path: vaultwarden/vaultwarden.env
    app: vaultwarden
  - path: watchyourlan/watchyourlan.env
    app: watchyourlan
  - path: wealthfolio/wealthfolio.env
    app: wealthfolio
